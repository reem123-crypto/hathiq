<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - حاذق</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>العودة للرئيسية</span>
            </a>
            <div class="auth-header">
                <a href="index.html" class="auth-logo"><h1>حاذق</h1></a>
                <h2>تسجيل الدخول</h2>
                <p>مرحباً بعودتك! سجل دخولك للمتابعة</p>
            </div>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
                </div>
                <div class="form-options">
                    <label class="checkbox-label" for="rememberMe">
                        <input id="rememberMe" name="rememberMe" type="checkbox">
                        <span>تذكرني</span>
                    </label>
                    <a href="forgot-password.html" class="link">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
            </form>
            <div class="auth-footer">
                <p>ليس لديك حساب؟ <a href="register.html" class="link">إنشاء حساب جديد</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="js/appwrite-helper.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Load footer safely
        document.addEventListener('DOMContentLoaded', () => {
            fetch('components/footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load footer');
                    return response.text();
                })
                .then(data => {
                    const footer = document.getElementById('footer-container');
                    if (footer) footer.innerHTML = data;
                })
                .catch(error => {
                    console.warn('Footer loading error:', error);
                    // Continue without footer
                });
        });
    </script>
</body>
</html>
