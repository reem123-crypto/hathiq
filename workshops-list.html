                    <a href="my-profile.html" class="icon-btn">

                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <nav class="mobile-nav">
            <a href="index.html" class="nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                <span data-ar="الرئيسية" data-en="Home">الرئيسية</span>
            </a>
            <a href="talents.html" class="nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <a href="talents.html" class="nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                </svg>
                <span data-ar="المواهب" data-en="Talents">المواهب</span>
            </a>
            <a href="store.html" class="nav-link">

                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>

                </svg>

    <!-- Back Button -->
    <a href="workshops.html" class="btn-back-circle">
    <!-- Page Header -->
    <section class="talents-header">
        <div class="container">
            <div class="header-with-back">
                <a href="workshops.html" class="btn-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span data-ar="العودة للأنواع" data-en="Back to Types">العودة للأنواع</span>
                </a>
                <div class="header-content">
                    <div class="category-badge" id="categoryBadge">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1 class="page-title" id="categoryTitle" data-ar="الورش الحضورية" data-en="In-Person Workshops">الورش الحضورية</h1>
                        <p class="page-subtitle" id="talentsCount" data-ar="تصفح الورش المتاحة" data-en="Browse available workshops">تصفح الورش المتاحة</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filters Section -->
    <section class="filters-section">
        <div class="container">
            <div class="filters-bar">
                <div class="search-filter">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="ابحث عن ورشة..." data-ar="ابحث عن ورشة..." data-en="Search workshops...">
                </div>
                
                <div class="filter-group">
                    <select id="cityFilter" class="filter-select">
                        <option value="all" data-ar="جميع المحافظات" data-en="All Governorates">جميع المحافظات</option>
                        <option value="muscat" data-ar="مسقط" data-en="Muscat">مسقط</option>
                        <option value="dhofar" data-ar="ظفار" data-en="Dhofar">ظفار</option>
                        <option value="musandam" data-ar="مسندم" data-en="Musandam">مسندم</option>
                        <option value="buraimi" data-ar="البريمي" data-en="Al Buraimi">البريمي</option>
                        <option value="dakhliyah" data-ar="الداخلية" data-en="Ad Dakhiliyah">الداخلية</option>
                        <option value="batinah-north" data-ar="شمال الباطنة" data-en="North Al Batinah">شمال الباطنة</option>
                        <option value="batinah-south" data-ar="جنوب الباطنة" data-en="South Al Batinah">جنوب الباطنة</option>
                        <option value="sharqiyah-north" data-ar="شمال الشرقية" data-en="North Ash Sharqiyah">شمال الشرقية</option>
                        <option value="sharqiyah-south" data-ar="جنوب الشرقية" data-en="South Ash Sharqiyah">جنوب الشرقية</option>
                        <option value="dhahirah" data-ar="الظاهرة" data-en="Ad Dhahirah">الظاهرة</option>
                        <option value="wusta" data-ar="الوسطى" data-en="Al Wusta">الوسطى</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <select id="priceFilter" class="filter-select">
                        <option value="all" data-ar="الكل" data-en="All">الكل</option>
                        <option value="free" data-ar="مجاني" data-en="Free">مجاني</option>
                        <option value="paid" data-ar="مدفوع" data-en="Paid">مدفوع</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Workshops Grid -->
    <section class="talents-section">
        <div class="container">
            <div class="talents-grid" id="talentsGrid">
                <!-- Workshops will be loaded here -->
            </div>
        </div>
    </section>
    <script src="js/main.js"></script>
    <script src="js/workshops-list.js"></script>
    <script>
        // Load footer component
        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
