<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - حاذق</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html"><h1>حاذق</h1></a>
                </div>
                
                <nav class="header-nav">
                    <ul class="nav-links">
                        <li><a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a></li>
                        <li><a href="talents.html" data-ar="المواهب" data-en="Talents">المواهب</a></li>
                        <li><a href="store.html" data-ar="المتجر" data-en="Store">المتجر</a></li>
                        <li><a href="workshops.html" data-ar="الورش" data-en="Workshops">الورش</a></li>
                        <li><a href="community.html" data-ar="المجتمع" data-en="Community">المجتمع</a></li>
                    </ul>
                </nav>

                <div class="header-actions">
                    <button class="lang-toggle" id="langToggle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span class="lang-text">EN</span>
                    </button>
                    <a href="notifications.html" class="icon-btn active">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-badge" id="notificationBadge">5</span>
                    </a>
                    <a href="chat.html" class="icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </a>
                    <a href="dashboard.html" class="icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                    <button class="menu-btn">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu">
        <div class="mobile-menu-header">
            <h2 data-ar="القائمة" data-en="Menu">القائمة</h2>
            <button class="mobile-menu-close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <nav class="mobile-nav">
            <a href="index.html" class="nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                <span data-ar="الرئيسية" data-en="Home">الرئيسية</span>
            </a>
            <a href="notifications.html" class="nav-link active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span data-ar="الإشعارات" data-en="Notifications">الإشعارات</span>
            </a>
        </nav>
    </div>

    <button onclick="window.history.back()" class="btn-back-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </button>

    <!-- Notifications Content -->
    <div class="notifications-wrapper">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title" data-ar="الإشعارات" data-en="Notifications">الإشعارات</h1>
                <p class="page-subtitle" data-ar="تابع آخر التحديثات والأنشطة" data-en="Stay updated with latest activities">تابع آخر التحديثات والأنشطة</p>
            </div>

            <div class="notifications-container">
                <!-- Notifications Header -->
                <div class="notifications-header">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all" data-ar="الكل" data-en="All">الكل</button>
                        <button class="filter-tab" data-filter="unread" data-ar="غير مقروءة" data-en="Unread">غير مقروءة</button>
                        <button class="filter-tab" data-filter="messages" data-ar="رسائل" data-en="Messages">رسائل</button>
                        <button class="filter-tab" data-filter="orders" data-ar="طلبات" data-en="Orders">طلبات</button>
                        <button class="filter-tab" data-filter="system" data-ar="النظام" data-en="System">النظام</button>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-text" id="markAllReadBtn" data-ar="تعليم الكل كمقروء" data-en="Mark All as Read">تعليم الكل كمقروء</button>
                        <button class="btn btn-text" id="clearAllBtn" data-ar="مسح الكل" data-en="Clear All">مسح الكل</button>
                    </div>
                </div>

                <!-- Notifications List -->
                <div class="notifications-list" id="notificationsList">
                    <!-- Notifications will be loaded here -->
                </div>

                <!-- Empty State -->
                <div class="notifications-empty" id="notificationsEmpty" style="display: none;">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <h3 data-ar="لا توجد إشعارات" data-en="No Notifications">لا توجد إشعارات</h3>
                    <p data-ar="ستظهر إشعاراتك هنا" data-en="Your notifications will appear here">ستظهر إشعاراتك هنا</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="js/main.js"></script>
    <script src="js/footer-loader.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
</body>
</html>
