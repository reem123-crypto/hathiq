<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور - حاذق</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>العودة للرئيسية</span>
            </a>
            <div class="auth-header">
                <a href="index.html" class="auth-logo"><h1>حاذق</h1></a>
                <h2>استعادة كلمة المرور</h2>
                <p>أدخل بريدك الإلكتروني وسنرسل لك رابط التحقق</p>
            </div>
            <form class="auth-form" id="forgotPasswordForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="email" required placeholder="example@email.com">
                </div>
                <button type="submit" class="btn btn-primary btn-block">إرسال رابط التحقق</button>
            </form>

            <div id="resetLinkSection" class="reset-link-section" style="display: none; margin-top: 1.5rem;">
                <div class="info-box" style="padding: 1rem; background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 0.5rem; margin-bottom: 1rem;">
                    <p style="color: #15803d; margin: 0;">✓ تم إرسال رابط التحقق إلى بريدك الإلكتروني</p>
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmNewPassword" required placeholder="••••••••">
                </div>
                <button type="button" class="btn btn-primary btn-block" id="resetPasswordBtn">تعيين كلمة المرور الجديدة</button>
            </div>

            <div class="auth-footer">
                <p>تذكرت كلمة المرور؟ <a href="login.html" class="link">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="js/appwrite-helper.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Load footer safely
        document.addEventListener('DOMContentLoaded', () => {
            fetch('components/footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load footer');
                    return response.text();
                })
                .then(data => {
                    const footer = document.getElementById('footer-container');
                    if (footer) footer.innerHTML = data;
                })
                .catch(error => {
                    console.warn('Footer loading error:', error);
                });

            // Initialize forgot password form
            initializeForgotPasswordForm();
        });

        function initializeForgotPasswordForm() {
            const form = document.getElementById('forgotPasswordForm');
            const resetSection = document.getElementById('resetLinkSection');
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');
            let resetEmail = '';

            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const email = document.querySelector('input[type="email"]').value.trim().toLowerCase();
                    const users = JSON.parse(localStorage.getItem('site_users') || '[]');
                    const user = users.find(u => u.email === email);

                    if (!user) {
                        window.showToast('البريد الإلكتروني غير مسجل في النظام', 'error');
                        return;
                    }

                    resetEmail = email;
                    form.style.display = 'none';
                    resetSection.style.display = 'block';
                    window.showToast('تحقق من بريدك الإلكتروني', 'info');
                });
            }

            if (resetPasswordBtn) {
                resetPasswordBtn.addEventListener('click', function() {
                    const newPassword = document.getElementById('newPassword').value.trim();
                    const confirmPassword = document.getElementById('confirmNewPassword').value.trim();

                    if (newPassword !== confirmPassword) {
                        window.showToast('كلمة المرور غير متطابقة', 'error');
                        return;
                    }

                    if (newPassword.length < 6) {
                        window.showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                        return;
                    }

                    const users = JSON.parse(localStorage.getItem('site_users') || '[]');
                    const userIndex = users.findIndex(u => u.email === resetEmail);

                    if (userIndex !== -1) {
                        users[userIndex].password = newPassword;
                        localStorage.setItem('site_users', JSON.stringify(users));
                        
                        window.showToast('تم تعيين كلمة المرور الجديدة بنجاح', 'success');
                        
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                    }
                });
            }
        }
    </script>
</body>
</html>
