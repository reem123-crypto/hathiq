: center;\n    padding-top: 1.75rem;\n    border-top: 2px solid var(--border-color);\n    color: var(--text-secondary);\n    font-size: 0.9rem;\n}\n\n.auth-footer p {\n    margin: 0;\n}\n\n/* Responsive Design */\n@media (max-width: 768px) {\n    .auth-container {\n        max-width: 100%;\n    }\n    \n    .auth-card {\n        padding: 2rem 1.75rem;\n    }\n    \n    .auth-logo h1 {\n        font-size: 2rem;\n    }\n    \n    .auth-header h2 {\n        font-size: 1.35rem;\n    }\n    \n    .form-row {\n        grid-template-columns: 1fr;\n        gap: 0;\n    }\n    \n    .account-type-cards {\n        grid-template-columns: 1fr;\n    }\n}\n\n@media (max-width: 480px) {\n    .auth-page {\n        padding: var(--spacing-md);\n    }\n    \n    .auth-card {\n        padding: 1.75rem 1.25rem;\n    }\n    \n    .auth-logo h1 {\n        font-size: 1.75rem;\n    }\n    \n    .auth-header h2 {\n        font-size: 1.25rem;\n    }\n    \n    .auth-header p {\n        font-size: 0.85rem;\n    }\n    \n    .form-group input,\n    .form-group select {\n        padding: 0.75rem 0.85rem;\n        font-size: 0.85rem;\n    }\n    \n    .form-options {\n        flex-direction: column;\n        align-items: flex-start;\n    }\n    \n    .btn-block {\n        padding: 0.85rem;\n        font-size: 0.9rem;\n    }\n    \n    .account-type-card {\n        padding: 1.25rem 0.85rem;\n    }\n    \n    .account-type-icon {\n        width: 45px;\n        height: 45px;\n    }\n    \n    .account-type-icon svg {\n        width: 28px;\n        height: 28px;\n    }\n}\n</style>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;display=swap\" rel=\"stylesheet\"/>\n</head>\n<body class=\"auth-page\">\n<div class=\"auth-container\">\n<div class=\"auth-card\">\n<a class=\"auth-back-link\" href=\"index.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<line x1=\"19\" x2=\"5\" y1=\"12\" y2=\"12\"></line>\n<polyline points=\"12 19 5 12 12 5\"></polyline>\n</svg>\n<span>العودة للرئيسية</span>\n</a>\n<div class=\"auth-header\">\n<a class=\"auth-logo\" href=\"index.html\"><h1>حاذق</h1></a>\n<h2>استعادة كلمة المرور</h2>\n<p>أدخل بريدك الإلكتروني وسنرسل لك رابط التحقق</p>\n</div>\n<form class=\"auth-form\" id=\"forgotPasswordForm\">\n<div class=\"form-group\">\n<label>البريد الإلكتروني</label>\n<input name=\"email\" placeholder=\"example@email.com\" required=\"\" type=\"email\"/>\n</div>\n<button class=\"btn btn-primary btn-block\" type=\"submit\">إرسال رابط التحقق</button>\n</form>\n<div class=\"reset-link-section\" id=\"resetLinkSection\" style=\"display: none; margin-top: 1.5rem;\">\n<div class=\"info-box\" style=\"padding: 1rem; background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 0.5rem; margin-bottom: 1rem;\">\n<p style=\"color: #15803d; margin: 0;\">✓ تم إرسال رابط التحقق إلى بريدك الإلكتروني</p>\n</div>\n<div class=\"form-group\">\n<label>كلمة المرور الجديدة</label>\n<input id=\"newPassword\" placeholder=\"••••••••\" required=\"\" type=\"password\"/>\n</div>\n<div class=\"form-group\">\n<label>تأكيد كلمة المرور</label>\n<input id=\"confirmNewPassword\" placeholder=\"••••••••\" required=\"\" type=\"password\"/>\n</div>\n<button class=\"btn btn-primary btn-block\" id=\"resetPasswordBtn\" type=\"button\">تعيين كلمة المرور الجديدة</button>\n</div>\n<div class=\"auth-footer\">\n<p>تذكرت كلمة المرور؟ <a class=\"link\" href=\"login.html\">تسجيل الدخول</a></p>\n</div>\n</div>\n</div>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script>/* Appwrite helper for authentication and profiles.\n * This file is a lightweight wrapper around the Appwrite JS SDK.\n * It falls back safely to localStorage when Appwrite is not available.\n */\n(function(window) {\n    const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';\n    const APPWRITE_PROJECT_ID = '6a01a17c0019070903f1';\n    const APPWRITE_DATABASE_ID = '6a01a20a0000dfd5ae2c';\n    \n    const SDK_URL = 'https://cdn.jsdelivr.net/npm/appwrite@14.0.1';\n\n    let initialized = false;\n    let client = null;\n    let account = null;\n    let databases = null;\n    let Query = null;\n\n    function loadSdk() {\n        return new Promise((resolve, reject) => {\n            // ✅ الاسم الصحيح للـ global هو Appwrite (بحرف A كابيتال) مش appwrite\n            if (window.Appwrite) {\n                return resolve();\n            }\n\n            const script = document.createElement('script');\n            script.src = SDK_URL;\n            script.onload = () => resolve();\n            script.onerror = () => reject(new Error('فشل تحميل Appwrite SDK'));\n            document.head.appendChild(script);\n        });\n    }\n\n    async function init() {\n        if (initialized) return;\n\n        try {\n            if (!window.Appwrite) {\n                await loadSdk();\n            }\n\n            // تأكد من تحميل الإصدار الجديد\n            if (!window.Appwrite || !window.Appwrite.Client) {\n                throw new Error('فشل تحميل مكتبة Appwrite');\n            }\n\n            client = new window.Appwrite.Client()\n                .setEndpoint(APPWRITE_ENDPOINT)\n                .setProject(APPWRITE_PROJECT_ID);\n\n            account = new window.Appwrite.Account(client);\n            databases = new window.Appwrite.Databases(client);\n            Query = window.Appwrite.Query;\n            initialized = true;\n            console.log('✅ Appwrite initialized successfully');\n        } catch (error) {\n            console.error('❌ AppwriteHelper init failed:', error);\n            initialized = false;\n            throw error;\n        }\n    }\n\n    async function createAccount({ email, password, name, role, prefs = {} }) {\n        try {\n            await init();\n\n            // تحقق من صحة المدخلات\n            if (!email || !password || !name) {\n                throw new Error('البريد الإلكتروني وكلمة المرور والاسم مطلوبة');\n            }\n\n            // ✅ نتأكد الأول إنه مفيش session قديمة نشطة (من تجربة سابقة مثلاً)\n            // لأن Appwrite بيرفض إنشاء session جديدة لو فيه واحدة شغالة بالفعل\n            try {\n                await account.deleteSession('current');\n                console.log('🗑️ تم حذف session قديمة كانت نشطة');\n            } catch (sessionCleanupError) {\n                // طبيعي جدًا إنها تفشل لو مفيش session أصلاً - نتجاهلها\n            }\n\n            console.log('جاري إنشاء حساب Appwrite...', { email, name });\n            // ✅ استخدام ID.unique() بدلاً من النص الحرفي 'unique()'\n            const user = await account.create(window.Appwrite.ID.unique(), email, password, name);\n\n            console.log('✅ تم إنشاء الحساب بنجاح:', user.$id);\n\n            // ✅ لازم نسجّل دخول (نعمل session) قبل أي عملية تانية زي updatePrefs\n            // لأن account.create() بينشئ الحساب بس من غير ما يسجّل دخول تلقائيًا\n            if (typeof account.createEmailPasswordSession === 'function') {\n                await account.createEmailPasswordSession(email, password);\n            } else {\n                await account.createEmailSession(email, password);\n            }\n            console.log('✅ تم تسجيل الدخول بعد إنشاء الحساب');\n\n            // تحديث التفضيلات\n            await account.updatePrefs({ role, ...prefs });\n            console.log('✅ تم تحديث التفضيلات');\n\n            return user;\n        } catch (error) {\n            console.error('❌ خطأ في إنشاء الحساب:', error);\n            throw new Error(`فشل إنشاء الحساب: ${error.message}`);\n        }\n    }\n\n    async function createSession(email, password) {\n        try {\n            await init();\n            console.log('جاري تسجيل الدخول...', email);\n            // ✅ createEmailSession قديمة/متوقفة في إصدارات SDK الأحدث، استخدم الاسم الجديد\n            if (typeof account.createEmailPasswordSession === 'function') {\n                await account.createEmailPasswordSession(email, password);\n            } else {\n                await account.createEmailSession(email, password);\n            }\n            const user = await account.get();\n            console.log('✅ تم تسجيل الدخول بنجاح');\n            return user;\n        } catch (error) {\n            console.error('❌ خطأ في تسجيل الدخول:', error);\n            throw new Error(`فشل تسجيل الدخول: ${error.message}`);\n        }\n    }\n\n    async function logout() {\n        await init();\n        try {\n            await account.deleteSession('current');\n        } catch (error) {\n            console.warn('Appwrite logout failed:', error);\n        }\n    }\n\n    async function getCurrentAccount() {\n        await init();\n        return account.get();\n    }\n\n    async function updatePrefs(prefs) {\n        await init();\n        return account.updatePrefs(prefs);\n    }\n\n    // Database operations\n    async function createDocument(collectionId, data) {\n        try {\n            await init();\n            console.log(`جاري حفظ document في ${collectionId}...`);\n            const doc = await databases.createDocument(APPWRITE_DATABASE_ID, collectionId, window.Appwrite.ID.unique(), data);\n            console.log(`✅ تم حفظ المستند بنجاح: ${doc.$id}`);\n            return doc;\n        } catch (error) {\n            console.error(`❌ خطأ في حفظ المستند في ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function getDocument(collectionId, documentId) {\n        try {\n            await init();\n            return await databases.getDocument(APPWRITE_DATABASE_ID, collectionId, documentId);\n        } catch (error) {\n            console.error(`❌ خطأ في الحصول على المستند من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function updateDocument(collectionId, documentId, data) {\n        try {\n            await init();\n            console.log(`جاري تحديث المستند في ${collectionId}...`);\n            const doc = await databases.updateDocument(APPWRITE_DATABASE_ID, collectionId, documentId, data);\n            console.log(`✅ تم تحديث المستند بنجاح`);\n            return doc;\n        } catch (error) {\n            console.error(`❌ خطأ في تحديث المستند في ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function deleteDocument(collectionId, documentId) {\n        try {\n            await init();\n            await databases.deleteDocument(APPWRITE_DATABASE_ID, collectionId, documentId);\n            console.log(`✅ تم حذف المستند بنجاح`);\n        } catch (error) {\n            console.error(`❌ خطأ في حذف المستند من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function listDocuments(collectionId, queries = []) {\n        try {\n            await init();\n            return await databases.listDocuments(APPWRITE_DATABASE_ID, collectionId, queries);\n        } catch (error) {\n            console.error(`❌ خطأ في جلب المستندات من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    window.AppwriteHelper = {\n        init,\n        createAccount,\n        createSession,\n        logout,\n        getCurrentAccount,\n        updatePrefs,\n        createDocument,\n        getDocument,\n        updateDocument,\n        deleteDocument,\n        listDocuments,\n        get Query() {\n            return Query;\n        },\n        APPWRITE_ENDPOINT,\n        APPWRITE_PROJECT_ID,\n        APPWRITE_DATABASE_ID,\n        isReady: () => initialized\n    };\n})(window);<\/script>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script>// Auth functionality\n// Appwrite هو مصدر الحقيقة الأساسي دلوقتي لتسجيل الدخول والتسجيل.\n// localStorage بقى مجرد fallback لحالة عدم توفر Appwrite (تطوير/اختبار أوفلاين) - مفيهوش كلمات سر حقيقية بعد كده.\ndocument.addEventListener('DOMContentLoaded', () => {\n    initializeAccountTypeSelection();\n    initializeFileUploads();\n    initializeLoginForm();\n    initializeRegisterForm();\n});\n\n// Account Type Selection\nfunction initializeAccountTypeSelection() {\n    const accountTypeCards = document.querySelectorAll('.account-type-card');\n    const talentInfo = document.getElementById('talentInfo');\n    let selectedType = null;\n\n    accountTypeCards.forEach(card => {\n        card.addEventListener('click', function() {\n            accountTypeCards.forEach(c => c.classList.remove('active'));\n            this.classList.add('active');\n            selectedType = this.dataset.type;\n\n            if (talentInfo) {\n                if (selectedType === 'talent') {\n                    talentInfo.classList.remove('hidden');\n                    talentInfo.querySelectorAll('select[name=\"category\"]').forEach(field => {\n                        field.setAttribute('required', 'required');\n                    });\n                } else {\n                    talentInfo.classList.add('hidden');\n                    talentInfo.querySelectorAll('select[name=\"category\"]').forEach(field => {\n                        field.removeAttribute('required');\n                    });\n                }\n            }\n        });\n    });\n}\n\n// File Upload Handlers\nfunction initializeFileUploads() {\n    const cvFile = document.getElementById('cvFile');\n    const photoFile = document.getElementById('photoFile');\n    const cvFileName = document.getElementById('cvFileName');\n    const photoFileName = document.getElementById('photoFileName');\n\n    if (cvFile) {\n        cvFile.addEventListener('change', function() {\n            if (this.files && this.files[0]) {\n                cvFileName.textContent = '✓ ' + this.files[0].name;\n            } else {\n                cvFileName.textContent = '';\n            }\n        });\n    }\n\n    if (photoFile) {\n        photoFile.addEventListener('change', function() {\n            if (this.files && this.files[0]) {\n                photoFileName.textContent = '✓ ' + this.files[0].name;\n            } else {\n                photoFileName.textContent = '';\n            }\n        });\n    }\n}\n\n// localStorage دلوقتي بقى fallback بس (دليل أوفلاين) - مفيهوش كلمات سر حقيقية\nfunction getStoredUsers() {\n    try {\n        return JSON.parse(localStorage.getItem('site_users') || '[]');\n    } catch (error) {\n        return [];\n    }\n}\n\nfunction setStoredUsers(users) {\n    localStorage.setItem('site_users', JSON.stringify(users));\n}\n\nfunction normalizeUserRole(role) {\n    const normalized = (role || 'client').toString().trim().toLowerCase();\n    if (['admin', 'administrator', 'superadmin'].includes(normalized)) return 'admin';\n    if (['talent', 'موهوب', 'freelancer'].includes(normalized)) return 'talent';\n    if (['client', 'beneficiary', 'customer', 'مستفيد'].includes(normalized)) return 'client';\n    return 'client';\n}\n\nfunction buildSessionUserPayload(sourceUser = {}, fallbackUser = null) {\n    if (typeof window.createSessionUser === 'function') {\n        return window.createSessionUser(sourceUser, fallbackUser);\n    }\n\n    const baseUser = fallbackUser || {};\n    const firstName = sourceUser.firstName || sourceUser.name?.split(' ')[0] || baseUser.firstName || '';\n    const lastName = sourceUser.lastName || (sourceUser.name ? sourceUser.name.split(' ').slice(1).join(' ') : '') || baseUser.lastName || '';\n\n    return {\n        id: sourceUser.id || baseUser.id || '',\n        firstName,\n        lastName,\n        email: sourceUser.email || baseUser.email || '',\n        role: normalizeUserRole(sourceUser.role || baseUser.role || ''),\n        phone: sourceUser.phone || baseUser.phone || '',\n        category: sourceUser.category || baseUser.category || '',\n        bio: sourceUser.bio || baseUser.bio || '',\n        experience: sourceUser.experience ?? baseUser.experience ?? '',\n        city: sourceUser.city || baseUser.city || '',\n        portfolio: sourceUser.portfolio || baseUser.portfolio || '',\n        registeredAt: sourceUser.registeredAt || baseUser.registeredAt || '',\n        avatar: sourceUser.avatar || baseUser.avatar || '',\n        profileId: sourceUser.profileId || baseUser.profileId || null,\n        sessionSource: sourceUser.sessionSource || baseUser.sessionSource || '',\n        isDefaultProfile: false\n    };\n}\n\nfunction getCurrentUser() {\n    try {\n        const currentUser = JSON.parse(localStorage.getItem('site_current_user') || 'null');\n        if (currentUser) return currentUser;\n\n        const sessionData = JSON.parse(localStorage.getItem('site_session') || 'null');\n        return sessionData?.user || null;\n    } catch (error) {\n        return null;\n    }\n}\n\nfunction setCurrentUser(user) {\n    const normalizedUser = user ? buildSessionUserPayload(user, getCurrentUser()) : null;\n    localStorage.setItem('site_current_user', JSON.stringify(normalizedUser));\n    localStorage.setItem('site_session', JSON.stringify({\n        isLoggedIn: !!normalizedUser,\n        user: normalizedUser,\n        loggedInAt: new Date().toISOString(),\n        source: normalizedUser?.sessionSource || 'default'\n    }));\n\n    if (typeof window.setSiteCurrentUser === 'function') {\n        window.setSiteCurrentUser(normalizedUser);\n    }\n}\n\nfunction getDefaultRedirect(role) {\n    const normalizedRole = (role || '').toString().trim().toLowerCase();\n    if (normalizedRole === 'admin') return 'admin.html';\n    if (normalizedRole === 'talent') return 'dashboard.html';\n    return 'beneficiary.html';\n}\n\n/**\n * تسجيل الدخول عبر Appwrite.\n * - لو AppwriteHelper مش متاح خالص (السكريبت مش متحمّل مثلاً): بيرجع null بهدوء (يسمح بالـ fallback المحلي).\n * - لو Appwrite متاح لكن البريد/الباسورد غلط أو أي خطأ فعلي: بيرمي (throw) الخطأ عشان الكولر يفرّق\n *   بين \"Appwrite مش شغال\" و\"بيانات الدخول غلط\".\n */\nasync function loginWithAppwrite(email, password) {\n    if (!window.AppwriteHelper) return null;\n\n    const user = await window.AppwriteHelper.createSession(email, password);\n\n    // نجيب بروفايل المستخدم من كولكشن users عبر accountId\n    let profile = null;\n    try {\n        const userProfiles = await window.AppwriteHelper.listDocuments('users', [\n            window.AppwriteHelper.Query.equal('accountId', user.$id)\n        ]);\n        if (userProfiles.documents && userProfiles.documents.length > 0) {\n            profile = userProfiles.documents[0];\n        }\n    } catch (profileError) {\n        console.warn('⚠️ تعذّر جلب بروفايل المستخدم من قاعدة البيانات:', profileError);\n    }\n\n    return buildSessionUserPayload({\n        id: user.$id,\n        name: user.name || '',\n        firstName: user.name ? user.name.split(' ')[0] : email.split('@')[0],\n        lastName: user.name ? user.name.split(' ').slice(1).join(' ') : '',\n        email: user.email,\n        role: profile?.type || user.prefs?.role || '',\n        phone: profile?.phone || user.prefs?.phone || '',\n        category: profile?.category || user.prefs?.category || '',\n        bio: profile?.bio || user.prefs?.bio || '',\n        experience: profile?.experience || user.prefs?.experience || '',\n        city: profile?.city || user.prefs?.city || '',\n        portfolio: profile?.portfolio || user.prefs?.portfolio || '',\n        registeredAt: user.prefs?.registeredAt || '',\n        avatar: profile?.avatar || (user.name ? user.name.charAt(0) : ''),\n        profileId: profile?.$id || null,\n        sessionSource: profile ? 'database' : 'appwrite-auth-only',\n        isDefaultProfile: false\n    }, getCurrentUser());\n}\n\n/**\n * إنشاء حساب عبر Appwrite (Auth + مستند بروفايل في كولكشن users).\n * ملاحظة: مفيش created_at/updated_at في الـ payload لأن كولكشن users معندوش الأعمدة دي -\n * Appwrite بيسجل $createdAt/$updatedAt تلقائيًا لوحده.\n */\nasync function signupWithAppwrite(user) {\n    if (!window.AppwriteHelper) {\n        console.warn('⚠️ AppwriteHelper غير متاح - سيتم الحفظ في localStorage فقط');\n        return null;\n    }\n\n    console.log('📝 جاري محاولة إنشاء حساب في Appwrite...');\n\n    const appwriteUser = await window.AppwriteHelper.createAccount({\n        email: user.email,\n        password: user.password,\n        name: `${user.firstName} ${user.lastName}`,\n        role: user.role,\n        prefs: {\n            phone: user.phone,\n            category: user.category,\n            bio: user.bio,\n            experience: user.experience,\n            city: user.city,\n            portfolio: user.portfolio,\n            registeredAt: user.registeredAt\n        }\n    });\n\n    console.log('✅ تم إنشاء الحساب في Appwrite:', appwriteUser.$id);\n\n    const userProfile = {\n        accountId: appwriteUser.$id,\n        name: `${user.firstName} ${user.lastName}`,\n        email: user.email,\n        phone: user.phone,\n        type: user.role,\n        category: user.category,\n        bio: user.bio,\n        experience: parseInt(user.experience) || 0,\n        city: user.city,\n        rating: 0.0,\n        reviews_count: 0,\n        projects_completed: 0,\n        avatar: (user.firstName || 'م').charAt(0),\n        portfolio: user.portfolio,\n        verified: false,\n        status: 'active',\n        // لا created_at ولا updated_at هنا - العمودين دول مش موجودين في كولكشن users\n    };\n\n    try {\n        const userDoc = await window.AppwriteHelper.createDocument('users', userProfile);\n        console.log('✅ تم إنشاء ملف المستخدم في قاعدة البيانات:', userDoc.$id);\n        return { ...appwriteUser, profile: userDoc };\n    } catch (dbError) {\n        console.error('❌ تم إنشاء الحساب لكن فشل حفظ بروفايله في قاعدة البيانات:', dbError);\n        // نرمي الخطأ بدل ما نبلعه - عشان المستخدم يعرف إن حسابه ناقص بروفايل ومحتاج تدخل يدوي\n        throw new Error(`تم إنشاء الحساب لكن فشل حفظ بيانات البروفايل: ${dbError.message}`);\n    }\n}\n\n// Login Form\nfunction initializeLoginForm() {\n    const loginForm = document.getElementById('loginForm');\n    const existingUser = getCurrentUser();\n    if (existingUser && loginForm) {\n        __setHref(getDefaultRedirect(existingUser.role));\n        return;\n    }\n\n    if (loginForm) {\n        loginForm.addEventListener('submit', async (e) => {\n            e.preventDefault();\n\n            const emailInput = loginForm.querySelector('input[type=\"email\"]');\n            const passwordInput = loginForm.querySelector('input[type=\"password\"]');\n            const email = emailInput ? emailInput.value.trim().toLowerCase() : '';\n            const password = passwordInput ? passwordInput.value.trim() : '';\n\n            if (!email || !password) {\n                window.showToast ? window.showToast('الرجاء إدخال البريد وكلمة المرور', 'error') : alert('الرجاء إدخال البريد وكلمة المرور');\n                return;\n            }\n\n            // 1) نجرب Appwrite الأول دايمًا - هو مصدر الحقيقة\n            let appwriteUser = null;\n            let appwriteReachable = true;\n            try {\n                appwriteUser = await loginWithAppwrite(email, password);\n                if (appwriteUser === null) appwriteReachable = false; // AppwriteHelper مش متاح خالص\n            } catch (err) {\n                console.warn('⚠️ فشل تسجيل الدخول عبر Appwrite:', err);\n                appwriteReachable = true; // Appwrite شغال لكن البيانات غلط أو حصل خطأ فعلي\n                appwriteUser = null;\n            }\n\n            if (appwriteUser) {\n                setCurrentUser(appwriteUser);\n                window.showToast ? window.showToast('تم تسجيل الدخول بنجاح', 'success') : alert('تم تسجيل الدخول بنجاح!');\n                setTimeout(() => {\n                    __setHref(getDefaultRedirect(appwriteUser.role));\n                }, 1000);\n                return;\n            }\n\n            if (appwriteReachable) {\n                // Appwrite شغال لكن البريد/الباسورد غلط - منرجعش لـ localStorage عشان منضللش المستخدم\n                window.showToast ? window.showToast('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error') : alert('البريد الإلكتروني أو كلمة المرور غير صحيحة');\n                return;\n            }\n\n            // 2) fallback: Appwrite مش متاح خالص (مثلاً السكريبت مش متحمّل) - نستخدم localStorage كخطة بديلة للتطوير فقط\n            const users = getStoredUsers();\n            const localUser = users.find(u => u.email === email);\n            if (!localUser || (localUser.password && localUser.password !== password)) {\n                window.showToast ? window.showToast('المستخدم غير موجود أو كلمة المرور غير صحيحة', 'error') : alert('المستخدم غير موجود أو كلمة المرور غير صحيحة');\n                return;\n            }\n\n            setCurrentUser(localUser);\n            window.showToast ? window.showToast('تم تسجيل الدخول (وضع محلي - Appwrite غير متاح)', 'success') : alert('تم تسجيل الدخول بنجاح!');\n            setTimeout(() => {\n                __setHref(getDefaultRedirect(localUser.role));\n            }, 1000);\n        });\n    }\n}\n\n// Register Form\nfunction initializeRegisterForm() {\n    const registerForm = document.getElementById('registerForm');\n    const existingUser = getCurrentUser();\n    if (existingUser && registerForm) {\n        __setHref(getDefaultRedirect(existingUser.role));\n        return;\n    }\n\n    if (registerForm) {\n        registerForm.addEventListener('submit', async (e) => {\n            e.preventDefault();\n\n            const selectedCard = document.querySelector('.account-type-card.active');\n            if (!selectedCard) {\n                window.showToast ? window.showToast('الرجاء اختيار نوع الحساب', 'error') : alert('الرجاء اختيار نوع الحساب');\n                return;\n            }\n\n            const accountType = selectedCard.dataset.type;\n            const formData = new FormData(registerForm);\n            formData.append('accountType', accountType);\n\n            const password = (formData.get('password') || '').toString();\n            const confirmPassword = (formData.get('confirmPassword') || '').toString();\n\n            if (password.length < 8) {\n                window.showToast ? window.showToast('كلمة المرور يجب أن تكون 8 أحرف على الأقل', 'error') : alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');\n                return;\n            }\n\n            if (password !== confirmPassword) {\n                window.showToast ? window.showToast('كلمة المرور غير متطابقة', 'error') : alert('كلمة المرور غير متطابقة');\n                return;\n            }\n\n            const newUser = {\n                id: `u_${Date.now()}`,\n                firstName: formData.get('firstName') || '',\n                lastName: formData.get('lastName') || '',\n                email: (formData.get('email') || '').trim().toLowerCase(),\n                phone: formData.get('phone') || '',\n                password: password, // بتتشال قبل ما نخزّن في localStorage لو Appwrite نجح - بص تحت\n                role: accountType,\n                category: formData.get('category') || '',\n                bio: formData.get('bio') || '',\n                experience: formData.get('experience') || '',\n                city: formData.get('city') || '',\n                portfolio: formData.get('portfolio') || '',\n                registeredAt: new Date().toISOString(),\n                avatar: (formData.get('firstName') || 'م').charAt(0)\n            };\n\n            let appwriteUser = null;\n            let appwriteError = null;\n            try {\n                appwriteUser = await signupWithAppwrite(newUser);\n            } catch (err) {\n                appwriteError = err;\n                console.error('❌ خطأ في إنشاء حساب Appwrite:', err);\n            }\n\n            if (appwriteUser) {\n                // نجح Appwrite بالكامل - هو مصدر الحقيقة، منخزّنش الباسورد الحقيقي محليًا\n                newUser.id = appwriteUser.$id;\n                const localCacheUser = { ...newUser };\n                delete localCacheUser.password; // ما نخزنش كلمة سر حقيقية في localStorage\n\n                const users = getStoredUsers();\n                const existingIndex = users.findIndex(u => u.email === newUser.email);\n                if (existingIndex >= 0) {\n                    users[existingIndex] = localCacheUser;\n                } else {\n                    users.push(localCacheUser);\n                }\n                setStoredUsers(users);\n\n                const sessionUser = buildSessionUserPayload({\n                    id: appwriteUser.$id,\n                    firstName: newUser.firstName,\n                    lastName: newUser.lastName,\n                    email: newUser.email,\n                    role: newUser.role,\n                    phone: newUser.phone,\n                    category: newUser.category,\n                    bio: newUser.bio,\n                    experience: newUser.experience,\n                    city: newUser.city,\n                    portfolio: newUser.portfolio,\n                    registeredAt: newUser.registeredAt,\n                    avatar: newUser.avatar,\n                    profileId: appwriteUser.profile?.$id || null,\n                    sessionSource: 'database'\n                });\n                setCurrentUser(sessionUser);\n            } else {\n                // فشل Appwrite بالكامل (مش متاح أو حصل خطأ) - fallback كامل لـ localStorage للتطوير فقط\n                window.showToast\n                    ? window.showToast(\n                          appwriteError\n                              ? `⚠️ فشل إنشاء الحساب على Appwrite: ${appwriteError.message}`\n                              : '⚠️ Appwrite غير متاح - تم الحفظ محليًا فقط (وضع تطوير)',\n                          'error'\n                      )\n                    : alert('⚠️ فشل إنشاء الحساب على Appwrite. افتح Console (F12) لترى التفاصيل.');\n\n                const users = getStoredUsers();\n                const existing = users.find(u => u.email === newUser.email);\n                if (existing) {\n                    window.showToast ? window.showToast('هذا البريد مستخدم بالفعل', 'error') : alert('هذا البريد مستخدم بالفعل');\n                    return;\n                }\n                users.push(newUser); // هنا فقط بيتخزن الباسورد محليًا - لأن مفيش Appwrite أصلاً يتحقق منها\n                setStoredUsers(users);\n                setCurrentUser(newUser);\n            }\n\n            const message = accountType === 'talent'\n                ? 'تم إنشاء حساب الموهوب بنجاح! ستتم مراجعة بياناتك قريباً.'\n                : 'تم إنشاء الحساب بنجاح!';\n\n            window.showToast ? window.showToast(message, 'success') : alert(message);\n\n            setTimeout(() => {\n                __setHref(getDefaultRedirect(accountType));\n            }, 2000);\n        });\n    }\n}<\/script>\n<script>\n        // Load footer safely\n        document.addEventListener('DOMContentLoaded', () => {\n            fetch('components/footer.html')\n                .then(response => {\n                    if (!response.ok) throw new Error('Failed to load footer');\n                    return response.text();\n                })\n                .then(data => {\n                    const footer = document.getElementById('footer-container');\n                    if (footer) footer.innerHTML = data;\n                })\n                .catch(error => {\n                    console.warn('Footer loading error:', error);\n                });\n\n            // Initialize forgot password form\n            initializeForgotPasswordForm();\n        });\n\n        function initializeForgotPasswordForm() {\n            const form = document.getElementById('forgotPasswordForm');\n            const resetSection = document.getElementById('resetLinkSection');\n            const resetPasswordBtn = document.getElementById('resetPasswordBtn');\n            let resetEmail = '';\n\n            if (form) {\n                form.addEventListener('submit', function(e) {\n                    e.preventDefault();\n                    \n                    const email = document.querySelector('input[type=\"email\"]').value.trim().toLowerCase();\n                    const users = JSON.parse(localStorage.getItem('site_users') || '[]');\n                    const user = users.find(u => u.email === email);\n\n                    if (!user) {\n                        window.showToast('البريد الإلكتروني غير مسجل في النظام', 'error');\n                        return;\n                    }\n\n                    resetEmail = email;\n                    form.style.display = 'none';\n                    resetSection.style.display = 'block';\n                    window.showToast('تحقق من بريدك الإلكتروني', 'info');\n                });\n            }\n\n            if (resetPasswordBtn) {\n                resetPasswordBtn.addEventListener('click', function() {\n                    const newPassword = document.getElementById('newPassword').value.trim();\n                    const confirmPassword = document.getElementById('confirmNewPassword').value.trim();\n\n                    if (newPassword !== confirmPassword) {\n                        window.showToast('كلمة المرور غير متطابقة', 'error');\n                        return;\n                    }\n\n                    if (newPassword.length < 6) {\n                        window.showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');\n                        return;\n                    }\n\n                    const users = JSON.parse(localStorage.getItem('site_users') || '[]');\n                    const userIndex = users.findIndex(u => u.email === resetEmail);\n\n                    if (userIndex !== -1) {\n                        users[userIndex].password = newPassword;\n                        localStorage.setItem('site_users', JSON.stringify(users));\n                        \n                        window.showToast('تم تعيين كلمة المرور الجديدة بنجاح', 'success');\n                        \n                        setTimeout(() => {\n                            __setHref('login.html');\n                        }, 1500);\n                    }\n                });\n            }\n        }\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "talents": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>المواهب - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style></style>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;display=swap\" rel=\"stylesheet\"/>\n</head>\n<body>\n<!-- Header -->\n<header class=\"header\">\n<div class=\"container\">\n<div class=\"header-content\">\n<div class=\"logo\">\n<a href=\"index.html\"><h1>حاذق</h1></a>\n</div>\n<nav class=\"header-nav\">\n<ul class=\"nav-links\">\n<li><a data-ar=\"الرئيسية\" data-en=\"Home\" href=\"index.html\">الرئيسية</a></li>\n<li><a class=\"active\" data-ar=\"المواهب\" data-en=\"Talents\" href=\"talents.html\">المواهب</a></li>\n<li><a data-ar=\"المتجر\" data-en=\"Store\" href=\"store.html\">المتجر</a></li>\n<li><a data-ar=\"الورش\" data-en=\"Workshops\" href=\"workshops.html\">الورش</a></li>\n<li><a data-ar=\"المجتمع\" data-en=\"Community\" href=\"community.html\">المجتمع</a></li>\n</ul>\n</nav>\n<div class=\"header-actions\">\n<button class=\"lang-toggle\" id=\"langToggle\">\n<svg fill=\"none\" height=\"18\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"18\">\n<circle cx=\"12\" cy=\"12\" r=\"10\"></circle>\n<line x1=\"2\" x2=\"22\" y1=\"12\" y2=\"12\"></line>\n<path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"></path>\n</svg>\n<span class=\"lang-text\">EN</span>\n</button>\n<a class=\"icon-btn\" href=\"notifications.html\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"></path>\n<path d=\"M13.73 21a2 2 0 0 1-3.46 0\"></path>\n</svg>\n<span class=\"notification-badge\" id=\"headerNotificationBadge\" style=\"display: none;\">0</span>\n</a>\n<a class=\"icon-btn\" href=\"chat.html\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path>\n</svg>\n</a>\n<a class=\"icon-btn\" href=\"my-profile.html\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"12\" cy=\"7\" r=\"4\"></circle>\n</svg>\n</a>\n<button class=\"menu-btn\">\n<span></span>\n<span></span>\n<span></span>\n</button>\n</div>\n</div>\n</div>\n</header>\n<!-- Mobile Menu -->\n<div class=\"mobile-menu\">\n<div class=\"mobile-menu-header\">\n<h2 data-ar=\"القائمة\" data-en=\"Menu\">القائمة</h2>\n<button class=\"mobile-menu-close\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<line x1=\"18\" x2=\"6\" y1=\"6\" y2=\"18\"></line>\n<line x1=\"6\" x2=\"18\" y1=\"6\" y2=\"18\"></line>\n</svg>\n</button>\n</div>\n<nav class=\"mobile-nav\">\n<a class=\"nav-link\" href=\"index.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"></path>\n</svg>\n<span data-ar=\"الرئيسية\" data-en=\"Home\">الرئيسية</span>\n</a>\n<a class=\"nav-link active\" href=\"talents.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"9\" cy=\"7\" r=\"4\"></circle>\n<path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"></path>\n<path d=\"M16 3.13a4 4 0 0 1 0 7.75\"></path>\n</svg>\n<span data-ar=\"المواهب\" data-en=\"Talents\">المواهب</span>\n</a>\n<a class=\"nav-link\" href=\"store.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z\"></path>\n<line x1=\"3\" x2=\"21\" y1=\"6\" y2=\"6\"></line>\n<path d=\"M16 10a4 4 0 0 1-8 0\"></path>\n</svg>\n<span data-ar=\"المتجر\" data-en=\"Store\">المتجر</span>\n</a>\n<a class=\"nav-link\" href=\"workshops.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<rect height=\"14\" rx=\"2\" ry=\"2\" width=\"20\" x=\"2\" y=\"7\"></rect>\n<path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"></path>\n</svg>\n<span data-ar=\"الورش\" data-en=\"Workshops\">الورش</span>\n</a>\n<a class=\"nav-link\" href=\"community.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"9\" cy=\"7\" r=\"4\"></circle>\n<path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"></path>\n<path d=\"M16 3.13a4 4 0 0 1 0 7.75\"></path>\n</svg>\n<span data-ar=\"المجتمع\" data-en=\"Community\">المجتمع</span>\n</a>\n</nav>\n<div class=\"menu-actions\">\n<a class=\"btn btn-outline\" data-ar=\"تسجيل الدخول\" data-en=\"Login\" href=\"login.html\">تسجيل الدخول</a>\n<a class=\"btn btn-primary\" data-ar=\"انضم كموهوب\" data-en=\"Join\" href=\"register.html\">انضم كموهوب</a>\n</div>\n</div>\n<!-- Back Button -->\n<a class=\"btn-back-circle\" href=\"index.html\">\n<svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\">\n<path d=\"M19 12H5M12 19l-7-7 7-7\"></path>\n</svg>\n</a>\n<!-- Page Header -->\n<section class=\"page-header\">\n<div class=\"container\">\n<h1 class=\"page-title\" data-ar=\"المواهب\" data-en=\"Talents\">المواهب</h1>\n<p class=\"page-subtitle\" data-ar=\"اكتشف المواهب العمانية في مختلف المجالات وتواصل معهم مباشرة\" data-en=\"Discover Omani talents across various fields and connect with them directly\">اكتشف المواهب العمانية في مختلف المجالات وتواصل معهم مباشرة</p>\n<!-- عنصر خاص بالموهوب فقط: زر تعديل بروفايله -->\n<a class=\"btn btn-primary\" data-role-visible=\"talent\" href=\"my-profile.html\" style=\"display:none;\">\n                تعديل بروفايلي\n            </a>\n<!-- عنصر خاص بالأدمن فقط: رابط لوحة إدارة المواهب -->\n<a class=\"btn btn-outline\" data-role-visible=\"admin\" href=\"talents-admin.html\" style=\"display:none;\">\n                إدارة المواهب\n            </a>\n</div>\n</section>\n<!-- Filters -->\n<section class=\"talents-filter-section\">\n<div class=\"container\">\n<div class=\"talents-filter\">\n<div class=\"filter-tabs\" id=\"categoryTabs\">\n<button class=\"filter-tab active\" data-category=\"all\">الكل</button>\n<!-- باقي فئات المواهب هتتضاف هنا ديناميكيًا أو تدويًا حسب مجالاتك -->\n</div>\n<div class=\"talents-search\">\n<svg fill=\"none\" height=\"18\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"18\">\n<circle cx=\"11\" cy=\"11\" r=\"8\"></circle>\n<line x1=\"21\" x2=\"16.65\" y1=\"21\" y2=\"16.65\"></line>\n</svg>\n<input data-ar=\"ابحث عن موهوب...\" data-en=\"Search talents...\" id=\"talentSearchInput\" placeholder=\"ابحث عن موهوب...\" type=\"text\"/>\n</div>\n</div>\n</div>\n</section>\n<!-- Talents Grid -->\n<section class=\"talents-grid-section\">\n<div class=\"container\">\n<div class=\"talents-grid\" id=\"talentsGrid\">\n<!-- بطاقات المواهب هتتحمّل هنا بواسطة JavaScript -->\n</div>\n<div class=\"empty-state\" id=\"talentsEmptyState\" style=\"display:none;\">\n<p data-ar=\"لا يوجد مواهب مطابقة\" data-en=\"No matching talents\">لا يوجد مواهب مطابقة</p>\n</div>\n</div>\n</section>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>// Talents Page JavaScript\n// المواهب مش كولكشن منفصل - هي صفوف من كولكشن \"users\" حيث type = \"talent\"\n// الجزء الخاص بالصلاحيات (توثيق/تعليق/حذف) موجود في talent-roles.js\n// يعتمد على window.AppwriteHelper (js/appwrite-helper.js) - لازم يتحمّل قبل الملف ده\n\nconst USERS_COLLECTION_ID = \"users\";\n\nlet talentsData = [];\nlet currentTalentCategory = \"all\";\nlet talentSearchQuery = \"\";\n\ndocument.addEventListener(\"DOMContentLoaded\", function () {\n    fetchTalents();\n    initTalentFilters();\n    initTalentSearch();\n});\n\n/**\n * يجيب كل المواهب النشطين من كولكشن users (type=talent, status=active)\n */\nasync function fetchTalents() {\n    try {\n        const Query = window.AppwriteHelper.Query;\n        const queries = [\n            Query.equal(\"type\", \"talent\"),\n            Query.equal(\"status\", \"active\"),\n        ];\n        if (currentTalentCategory !== \"all\") {\n            queries.push(Query.equal(\"category\", currentTalentCategory));\n        }\n\n        const response = await window.AppwriteHelper.listDocuments(USERS_COLLECTION_ID, queries);\n        talentsData = response.documents;\n\n        renderCategoryTabs();\n        loadTalents();\n    } catch (err) {\n        console.error(\"فشل جلب المواهب من Appwrite:\", err);\n        talentsData = [];\n        loadTalents();\n    }\n}\n\nfunction renderCategoryTabs() {\n    const tabsContainer = document.getElementById(\"categoryTabs\");\n    if (!tabsContainer) return;\n\n    const uniqueCategories = [...new Set(talentsData.map((t) => t.category).filter(Boolean))];\n    const tabs = [{ id: \"all\", name: \"الكل\" }, ...uniqueCategories.map((c) => ({ id: c, name: c }))];\n\n    tabsContainer.innerHTML = tabs\n        .map(\n            (cat) => `\n        <button class=\"filter-tab ${cat.id === currentTalentCategory ? \"active\" : \"\"}\" data-category=\"${cat.id}\">\n            ${cat.name}\n        </button>\n    `\n        )\n        .join(\"\");\n}\n\nfunction initTalentFilters() {\n    const tabsContainer = document.getElementById(\"categoryTabs\");\n    if (!tabsContainer) return;\n\n    tabsContainer.addEventListener(\"click\", function (e) {\n        const tab = e.target.closest(\".filter-tab\");\n        if (!tab) return;\n\n        currentTalentCategory = tab.dataset.category;\n        fetchTalents();\n    });\n}\n\nfunction initTalentSearch() {\n    const searchInput = document.getElementById(\"talentSearchInput\");\n    if (!searchInput) return;\n\n    searchInput.addEventListener(\"input\", function () {\n        talentSearchQuery = this.value.trim().toLowerCase();\n        loadTalents();\n    });\n}\n\nfunction getFilteredTalents() {\n    if (!talentSearchQuery) return talentsData;\n    return talentsData.filter(\n        (t) =>\n            (t.name && t.name.toLowerCase().includes(talentSearchQuery)) ||\n            (t.bio && t.bio.toLowerCase().includes(talentSearchQuery)) ||\n            (t.city && t.city.toLowerCase().includes(talentSearchQuery))\n    );\n}\n\nfunction loadTalents() {\n    const grid = document.getElementById(\"talentsGrid\");\n    const emptyState = document.getElementById(\"talentsEmptyState\");\n    if (!grid) return;\n\n    const filtered = getFilteredTalents();\n\n    if (filtered.length === 0) {\n        grid.innerHTML = \"\";\n        if (emptyState) emptyState.style.display = \"block\";\n        return;\n    }\n    if (emptyState) emptyState.style.display = \"none\";\n\n    grid.innerHTML = filtered\n        .map(\n            (t) => `\n        <div class=\"talent-card\" data-talent-id=\"${t.$id}\">\n            <div class=\"talent-avatar\">\n                ${t.avatar ? `<img src=\"${t.avatar}\" alt=\"${t.name}\">` : `<span>${(t.name || \"؟\").charAt(0)}</span>`}\n            </div>\n            <div class=\"talent-info\">\n                <h3>${t.name} ${t.verified ? `<span class=\"verified-badge\" title=\"موهوب موثّق\">✔</span>` : \"\"}</h3>\n                <p class=\"talent-category\">${t.category || \"\"}${t.city ? \" - \" + t.city : \"\"}</p>\n                <p class=\"talent-bio\">${t.bio || \"\"}</p>\n                <div class=\"talent-rating\">\n                    ⭐ ${t.rating ? t.rating.toFixed(1) : \"0.0\"}\n                    <span class=\"reviews-count\">(${t.reviews_count || 0} تقييم)</span>\n                </div>\n                ${t.projects_completed ? `<div class=\"talent-projects\">${t.projects_completed} مشروع منجز</div>` : \"\"}\n                ${t.portfolio ? `<a href=\"${t.portfolio}\" target=\"_blank\" class=\"portfolio-link\">معرض الأعمال</a>` : \"\"}\n            </div>\n            <div class=\"talent-actions\" id=\"talentActions-${t.$id}\"></div>\n        </div>\n    `\n        )\n        .join(\"\");\n\n    if (typeof refreshTalentActionsVisibility === \"function\") {\n        refreshTalentActionsVisibility();\n    }\n}<\/script>\n<script>/**\n * talent-roles.js\n * التحكم في صلاحيات صفحة \"المواهب\" حسب دور المستخدم\n * المواهب هي صفوف من كولكشن \"users\" حيث type = \"talent\" - مفيش كولكشن منفصل\n * الأدوار الفعلية: 'talent' | 'client' | 'admin'\n *\n * القرار المعتمد:\n * - client: يتصفح ويشوف بروفايلات المواهب بس (بدون أي أزرار إدارة)\n * - talent: يعدّل بروفايله هو بس (زر \"تعديل بروفايلي\" أعلى الصفحة يظهر له فقط)\n * - admin: صلاحية كاملة - توثيق / تعليق / حذف أي حساب موهوب\n *\n * يعتمد على window.AppwriteHelper (js/appwrite-helper.js) - لازم يتحمّل قبل talents.js وقبل الملف ده\n */\n\nconst USERS_COLLECTION_ID = \"users\";\n\nlet currentUserRole = null;\nlet currentUserAccountId = null;\n\n/**\n * يرجع دور المستخدم الحالي: 'client' | 'talent' | 'admin' | null (زائر)\n */\nasync function getCurrentUserRole() {\n    try {\n        const user = await window.AppwriteHelper.getCurrentAccount();\n        currentUserAccountId = user.$id;\n\n        const result = await window.AppwriteHelper.listDocuments(\n            USERS_COLLECTION_ID,\n            [window.AppwriteHelper.Query.equal(\"accountId\", user.$id)]\n        );\n\n        currentUserRole = result.documents.length > 0 ? (result.documents[0].type || \"client\") : \"client\";\n        return currentUserRole;\n    } catch (err) {\n        currentUserRole = null;\n        currentUserAccountId = null;\n        return null;\n    }\n}\n\nfunction applyRoleVisibility(role) {\n    const elements = document.querySelectorAll(\"[data-role-visible]\");\n    elements.forEach((el) => {\n        const allowedRoles = el.getAttribute(\"data-role-visible\")\n            .split(\",\")\n            .map((r) => r.trim());\n        const isAllowed = role && allowedRoles.includes(role);\n        el.style.display = isAllowed ? \"\" : \"none\";\n    });\n}\n\n/**\n * حقن أزرار الإدارة المناسبة داخل كل بطاقة موهوب\n */\nfunction refreshTalentActionsVisibility() {\n    if (typeof talentsData === \"undefined\") return;\n\n    talentsData.forEach((t) => {\n        const actionsContainer = document.getElementById(`talentActions-${t.$id}`);\n        if (!actionsContainer) return;\n\n        const isOwner = currentUserRole === \"talent\" && t.accountId === currentUserAccountId;\n\n        if (currentUserRole === \"admin\") {\n            actionsContainer.innerHTML = `\n                <button class=\"btn-icon\" onclick=\"toggleVerifyTalent('${t.$id}')\" title=\"${t.verified ? \"إلغاء التوثيق\" : \"توثيق الحساب\"}\">\n                    ${t.verified ? \"إلغاء التوثيق\" : \"توثيق\"}\n                </button>\n                <button class=\"btn-icon\" onclick=\"toggleSuspendTalent('${t.$id}')\" title=\"${t.status === \"suspended\" ? \"تفعيل الحساب\" : \"تعليق الحساب\"}\">\n                    ${t.status === \"suspended\" ? \"تفعيل\" : \"تعليق\"}\n                </button>\n                <button class=\"btn-icon btn-danger\" onclick=\"deleteTalent('${t.$id}')\" title=\"حذف الحساب\">\n                    حذف\n                </button>\n            `;\n        } else if (isOwner) {\n            actionsContainer.innerHTML = `<span class=\"own-profile-badge\">هذا بروفايلك</span>`;\n        } else {\n            actionsContainer.innerHTML = \"\";\n        }\n    });\n}\n\n/**\n * توثيق / إلغاء توثيق حساب موهوب - أدمن فقط\n */\nasync function toggleVerifyTalent(talentDocId) {\n    if (currentUserRole !== \"admin\") return;\n\n    const talent = talentsData.find((t) => t.$id === talentDocId);\n    if (!talent) return;\n\n    const newValue = !talent.verified;\n\n    try {\n        await window.AppwriteHelper.updateDocument(USERS_COLLECTION_ID, talentDocId, { verified: newValue });\n        talent.verified = newValue;\n        loadTalents();\n        window.showToast && window.showToast(newValue ? \"تم توثيق الحساب\" : \"تم إلغاء التوثيق\", \"success\");\n    } catch (err) {\n        console.error(\"فشل تحديث حالة التوثيق:\", err);\n        window.showToast && window.showToast(\"حصل خطأ أثناء تحديث التوثيق\", \"error\");\n    }\n}\n\n/**\n * تعليق / تفعيل حساب موهوب - أدمن فقط\n */\nasync function toggleSuspendTalent(talentDocId) {\n    if (currentUserRole !== \"admin\") return;\n\n    const talent = talentsData.find((t) => t.$id === talentDocId);\n    if (!talent) return;\n\n    const newStatus = talent.status === \"suspended\" ? \"active\" : \"suspended\";\n\n    try {\n        await window.AppwriteHelper.updateDocument(USERS_COLLECTION_ID, talentDocId, { status: newStatus });\n        talent.status = newStatus;\n        fetchTalents(); // لو معلّق هيختفي تلقائيًا لأن fetchTalents بيجيب status=active بس\n        window.showToast && window.showToast(\n            newStatus === \"suspended\" ? \"تم تعليق الحساب\" : \"تم تفعيل الحساب\",\n            \"success\"\n        );\n    } catch (err) {\n        console.error(\"فشل تحديث حالة الحساب:\", err);\n        window.showToast && window.showToast(\"حصل خطأ أثناء تحديث حالة الحساب\", \"error\");\n    }\n}\n\n/**\n * حذف حساب موهوب - أدمن فقط\n * ملاحظة: ده بيحذف مستند users بالكامل (الحساب نفسه). لو عايز تلغي صفة الموهوب بس\n * من غير حذف الحساب، حدّث type لحاجة تانية بدل الحذف الكامل - قولّي لو محتاجها.\n */\nasync function deleteTalent(talentDocId) {\n    if (currentUserRole !== \"admin\") return;\n\n    const confirmed = confirm(\"هل أنت متأكد من حذف حساب هذا الموهوب؟ لا يمكن التراجع عن هذا الإجراء.\");\n    if (!confirmed) return;\n\n    try {\n        await window.AppwriteHelper.deleteDocument(USERS_COLLECTION_ID, talentDocId);\n        talentsData = talentsData.filter((t) => t.$id !== talentDocId);\n        loadTalents();\n        window.showToast && window.showToast(\"تم حذف حساب الموهوب\", \"success\");\n    } catch (err) {\n        console.error(\"فشل حذف حساب الموهوب:\", err);\n        window.showToast && window.showToast(\"حصل خطأ أثناء الحذف\", \"error\");\n    }\n}\n\nasync function initTalentRoles() {\n    await getCurrentUserRole();\n    applyRoleVisibility(currentUserRole);\n    refreshTalentActionsVisibility();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", initTalentRoles);<\/script>\n<script>\n        // Load footer component\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "photography-talents": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>مواهب التصوير والفيديو - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* Talents List Page Styles */\n\n.talents-header {\n    padding: var(--spacing-2xl) 0 var(--spacing-xl);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.08) 0%, rgba(161, 124, 26, 0.08) 100%);\n    border-bottom: 1px solid var(--border-color);\n}\n\n.header-with-back {\n    display: flex;\n    flex-direction: column;\n    gap: var(--spacing-xl);\n}\n\n.btn-back {\n    display: inline-flex;\n    align-items: center;\n    gap: 0.5rem;\n    padding: 0.625rem 1rem;\n    background: var(--surface-color);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    color: var(--text-secondary);\n    font-size: 0.9rem;\n    font-weight: 600;\n    cursor: pointer;\n    transition: var(--transition-base);\n    text-decoration: none;\n    width: fit-content;\n}\n\n.btn-back:hover {\n    border-color: var(--primary-color);\n    color: var(--primary-color);\n    background: rgba(33, 56, 81, 0.05);\n    transform: translateX(4px);\n}\n\n.btn-back svg {\n    width: 20px;\n    height: 20px;\n    flex-shrink: 0;\n}\n\n.header-content {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-xl);\n}\n\n.category-badge {\n    width: 90px;\n    height: 90px;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    border-radius: var(--radius-2xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2.75rem;\n    box-shadow: var(--shadow-xl);\n    flex-shrink: 0;\n    position: relative;\n}\n\n.category-badge::before {\n    content: '';\n    position: absolute;\n    inset: -4px;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    border-radius: var(--radius-2xl);\n    opacity: 0.2;\n    z-index: -1;\n}\n\n.header-text {\n    flex: 1;\n}\n\n.page-title {\n    font-size: 2rem;\n    font-weight: 800;\n    color: var(--text-primary);\n    margin-bottom: 0.5rem;\n    line-height: 1.2;\n}\n\n.page-subtitle {\n    font-size: 1rem;\n    color: var(--text-secondary);\n    font-weight: 500;\n}\n\n/* Filters Section */\n.filters-section {\n    padding: var(--spacing-lg) 0;\n    background: var(--surface-color);\n    border-bottom: 1px solid var(--border-color);\n    position: sticky;\n    top: 70px;\n    z-index: 10;\n}\n\n.filters-bar {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-md);\n    flex-wrap: wrap;\n}\n\n.search-filter {\n    flex: 1;\n    min-width: 250px;\n    position: relative;\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-sm);\n    padding: 0.75rem 1rem;\n    background: var(--bg-color);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    transition: var(--transition-base);\n}\n\n.search-filter:focus-within {\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n.search-filter svg {\n    color: var(--text-secondary);\n    flex-shrink: 0;\n}\n\n.search-filter input {\n    flex: 1;\n    border: none;\n    background: transparent;\n    font-size: 0.95rem;\n    outline: none;\n}\n\n.filter-group {\n    display: flex;\n    align-items: center;\n}\n\n.filter-select {\n    padding: 0.75rem 1rem;\n    border: 2px solid var(--border-color);\n    background: var(--surface-color);\n    border-radius: var(--radius-lg);\n    font-size: 0.9rem;\n    font-weight: 600;\n    cursor: pointer;\n    transition: var(--transition-base);\n    outline: none;\n    min-width: 150px;\n    color: var(--text-primary);\n}\n\n.filter-select:hover {\n    border-color: var(--primary-color);\n}\n\n.filter-select:focus {\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n/* Talents Section */\n.talents-section {\n    padding: var(--spacing-2xl) 0;\n    background: var(--bg-color);\n    min-height: 60vh;\n}\n\n.talents-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n    gap: var(--spacing-lg);\n}\n\n.talent-card {\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    padding: var(--spacing-lg);\n    box-shadow: var(--shadow-sm);\n    transition: var(--transition-base);\n    cursor: pointer;\n    text-decoration: none;\n    color: inherit;\n    display: block;\n}\n\n.talent-card:hover {\n    transform: translateY(-4px);\n    box-shadow: var(--shadow-lg);\n}\n\n.talent-header {\n    display: flex;\n    align-items: flex-start;\n    gap: var(--spacing-md);\n    margin-bottom: var(--spacing-md);\n}\n\n.talent-avatar {\n    width: 60px;\n    height: 60px;\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    border-radius: var(--radius-full);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 1.8rem;\n    flex-shrink: 0;\n    position: relative;\n}\n\n.verified-badge {\n    position: absolute;\n    bottom: -2px;\n    right: -2px;\n    width: 20px;\n    height: 20px;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    border-radius: var(--radius-full);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border: 2px solid var(--surface-color);\n}\n\n.verified-badge svg {\n    width: 12px;\n    height: 12px;\n    color: white;\n}\n\n.talent-info {\n    flex: 1;\n}\n\n.talent-name {\n    font-size: 1.1rem;\n    font-weight: 700;\n    color: var(--text-primary);\n    margin-bottom: 0.25rem;\n}\n\n.talent-title {\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n    margin-bottom: 0.5rem;\n}\n\n.talent-rating {\n    display: flex;\n    align-items: center;\n    gap: 0.25rem;\n    font-size: 0.85rem;\n    color: #f59e0b;\n}\n\n.talent-bio {\n    font-size: 0.9rem;\n    color: var(--text-secondary);\n    line-height: 1.6;\n    margin-bottom: var(--spacing-md);\n    display: -webkit-box;\n    -webkit-line-clamp: 2;\n    -webkit-box-orient: vertical;\n    overflow: hidden;\n}\n\n.talent-stats {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-md);\n    padding-top: var(--spacing-md);\n    border-top: 1px solid var(--border-color);\n}\n\n.talent-stat {\n    display: flex;\n    align-items: center;\n    gap: 0.4rem;\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n}\n\n.talent-stat svg {\n    width: 16px;\n    height: 16px;\n    color: var(--primary-color);\n}\n\n.talent-stat strong {\n    color: var(--text-primary);\n    font-weight: 600;\n}\n\n.talent-actions {\n    margin-top: var(--spacing-md);\n    padding-top: var(--spacing-md);\n    border-top: 1px solid var(--border-color);\n}\n\n.btn-block {\n    width: 100%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 0.5rem;\n    padding: 0.875rem 1.25rem;\n    font-size: 0.95rem;\n    font-weight: 600;\n    text-decoration: none;\n    transition: var(--transition-base);\n}\n\n.btn-block svg {\n    flex-shrink: 0;\n}\n\n/* Responsive */\n@media (max-width: 1024px) {\n    .talents-grid {\n        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));\n    }\n}\n\n@media (max-width: 768px) {\n    .talents-header {\n        padding: var(--spacing-xl) 0 var(--spacing-lg);\n    }\n    \n    .filters-bar {\n        flex-direction: column;\n        align-items: stretch;\n        gap: var(--spacing-sm);\n    }\n    \n    .search-filter {\n        min-width: 100%;\n    }\n    \n    .filter-group {\n        width: 100%;\n    }\n    \n    .filter-select {\n        width: 100%;\n    }\n    \n    .talents-grid {\n        grid-template-columns: 1fr;\n    }\n    \n    .header-content {\n        gap: var(--spacing-lg);\n    }\n    \n    .category-badge {\n        width \/script>\n</body>\n</html>", "workshops": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>الورش واللقاءات - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* ==================== Workshops Page Styles ==================== */\n\n/* Workshop Categories Section */\n.workshop-categories-section {\n    padding: var(--spacing-2xl) 0;\n    background: var(--bg-color);\n    min-height: 60vh;\n}\n\n.categories-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n    gap: var(--spacing-xl);\n    max-width: 1200px;\n    margin: 0 auto;\n}\n\n.category-card {\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    padding: var(--spacing-xl);\n    text-align: center;\n    transition: var(--transition-base);\n    text-decoration: none;\n    color: inherit;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: var(--spacing-md);\n    box-shadow: var(--shadow-md);\n    border: 2px solid transparent;\n}\n\n.category-card:hover {\n    transform: translateY(-6px);\n    box-shadow: var(--shadow-xl);\n    border-color: var(--primary-color);\n}\n\n.category-icon {\n    width: 80px;\n    height: 80px;\n    backgrou >\n\n<input data-ar=\"ابحث عن ورشة...\" data-en=\"Search workshops...\" id=\"searchInput\" placeholder=\"ابحث عن ورشة...\" type=\"text\"/>\n\n\n\n\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script><\/script>\n<script>/**\n * workshop-roles.js\n * إدارة عرض/إخفاء عناصر صفحة \"الورش\" حسب دور المستخدم\n * الأدوار الفعلية (من حقل type في كولكشن users): 'talent' | 'client' | 'admin'\n *\n * يعتمد على window.AppwriteHelper (js/appwrite-helper.js) - لازم يتحمّل قبل الملف ده\n */\n\nconst WORKSHOPS_COLLECTION_ID = \"workshops\";\nconst USERS_COLLECTION_ID = \"users\";\n\nlet currentUserRole = null;\nlet currentUserAccountId = null;\n\n/**\n * يرجع دور المستخدم الحالي: 'client' | 'talent' | 'admin' | null (زائر غير مسجل)\n * الربط بين account.$id ومستند users بيتم عبر حقل accountId\n */\nasync function getCurrentUserRole() {\n    try {\n        const user = await window.AppwriteHelper.getCurrentAccount();\n        currentUserAccountId = user.$id;\n\n        const result = await window.AppwriteHelper.listDocuments(\n            USERS_COLLECTION_ID,\n            [window.AppwriteHelper.Query.equal(\"accountId\", user.$id)]\n        );\n\n        currentUserRole = result.documents.length > 0 ? (result.documents[0].type || \"client\") : \"client\";\n        return currentUserRole;\n    } catch (err) {\n        currentUserRole = null;\n        currentUserAccountId = null;\n        return null; // زائر غير مسجل دخول\n    }\n}\n\n/**\n * يطبّق الصلاحيات على عناصر الصفحة اعتمادًا على data-role-visible\n * مثال: <button data-role-visible=\"talent,admin\">إضافة ورشة</button>\n */\nfunction applyRoleVisibility(role) {\n    const elements = document.querySelectorAll(\"[data-role-visible]\");\n    elements.forEach((el) => {\n        const allowedRoles = el.getAttribute(\"data-role-visible\")\n            .split(\",\")\n            .map((r) => r.trim());\n        const isAllowed = role && allowedRoles.includes(role);\n        el.style.display = isAllowed ? \"\" : \"none\";\n    });\n}\n\n/**\n * يجلب الورش حسب الدور:\n * - client (وأي زائر): الورش المتاحة فقط (status = 'available')\n * - talent: الورش المتاحة + ورشه هو (instructor_id بتاعه)\n * - admin: كل الورش بدون فلترة\n */\nasync function fetchWorkshopsForRole(role, accountId) {\n    const Query = window.AppwriteHelper.Query;\n    let queries = [];\n\n    if (role === \"talent\" && accountId) {\n        queries = [\n            Query.or([\n                Query.equal(\"status\", \"available\"),\n                Query.equal(\"instructor_id\", accountId),\n            ]),\n        ];\n    } else if (role === \"admin\") {\n        queries = []; // بدون فلترة\n    } else {\n        // client أو زائر غير مسجل\n        queries = [Query.equal(\"status\", \"available\")];\n    }\n\n    const response = await window.AppwriteHelper.listDocuments(WORKSHOPS_COLLECTION_ID, queries);\n    return response.documents;\n}\n\n/**\n * إضافة ورشة جديدة - talent أو admin فقط\n */\nasync function createWorkshop(workshopData) {\n    const role = await getCurrentUserRole();\n    if (role !== \"talent\" && role !== \"admin\") {\n        throw new Error(\"ليس لديك صلاحية لإضافة ورشة\");\n    }\n\n    return window.AppwriteHelper.createDocument(WORKSHOPS_COLLECTION_ID, {\n        ...workshopData,\n        instructor_id: currentUserAccountId,\n        seats_available: workshopData.seats,\n        status: role === \"admin\" ? \"available\" : \"pending_review\",\n    });\n}\n\n/**\n * دالة تشغيل رئيسية: تستدعى عند تحميل صفحة workshops.html\n */\nasync function initWorkshopsPage() {\n    const role = await getCurrentUserRole();\n    applyRoleVisibility(role);\n\n    const workshops = await fetchWorkshopsForRole(role, currentUserAccountId);\n    renderWorkshops(workshops, role, currentUserAccountId);\n}\n\n/**\n * دالة عرض الورش في الصفحة - عدّلها حسب تصميم categoriesGrid عندك\n */\nfunction renderWorkshops(workshops, role, currentUserAccountId) {\n    const grid = document.getElementById(\"categoriesGrid\");\n    if (!grid) return;\n\n    grid.innerHTML = workshops\n        .map((w) => {\n            const isOwner = role === \"talent\" && w.instructor_id === currentUserAccountId;\n            const adminControls =\n                role === \"admin\" || isOwner\n                    ? `<div class=\"workshop-admin-actions\">\n                         <button onclick=\"editWorkshop('${w.$id}')\">تعديل</button>\n                         ${role === \"admin\" ? `<button onclick=\"deleteWorkshop('${w.$id}')\">حذف</button>` : \"\"}\n                       </div>`\n                    : \"\";\n            const startDate = new Date(w.start_date).toLocaleDateString(\"ar\");\n            return `\n              <div class=\"workshop-card\" data-status=\"${w.status}\">\n                <h3>${w.title}</h3>\n                <p>المستوى: ${w.level} | النوع: ${w.type}</p>\n                <p>السعر: ${w.price} ر.ع | المقاعد المتاحة: ${w.seats_available}/${w.seats}</p>\n                <p>تاريخ البدء: ${startDate}</p>\n                ${w.status === \"pending_review\" ? `<span class=\"badge-pending\">قيد المراجعة</span>` : \"\"}\n                ${adminControls}\n              </div>\n            `;\n        })\n        .join(\"\");\n}\n\n/**\n * حذف ورشة - أدمن فقط (استدعيها من زر \"حذف\" في renderWorkshops)\n */\nasync function deleteWorkshop(workshopId) {\n    if (currentUserRole !== \"admin\") return;\n    const confirmed = confirm(\"هل تريد حذف هذه الورشة؟\");\n    if (!confirmed) return;\n\n    try {\n        await window.AppwriteHelper.deleteDocument(WORKSHOPS_COLLECTION_ID, workshopId);\n        initWorkshopsPage();\n    } catch (err) {\n        console.error(\"فشل حذف الورشة:\", err);\n    }\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", initWorkshopsPage);<\/script>\n<script>\n        // Load footer component\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>", "workshops-list": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>قائمة الورش - صيت</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* Workshops List Page Styles */\n\n.workshops-header {\n    padding: var(--spacing-2xl) 0 var(--spacing-xl);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.08) 0%, rgba(161, 124, 26, 0.08) 100%);\n    border-bottom: 1px solid var(--border-color);\n}\n\n.header-with-back {\n    display: flex;\n    flex-direction: column;\n    gap: var(--spacing-xl);\n}\n\n.btn-back {\n    display: inline-flex;\n    align-items: center;\n    gap: 0.5rem;\n    padding: 0.625rem 1rem;\n    background: var(--surface-color);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    color: var(--text-secondary);\n    font-size: 0.9rem;\n    font-weight: 600;\n    cursor: pointer;\n    transition: var(--transition-base);\n    text-decoration: none;\n    width: fit-content;\n}\n\n.btn-back:hover {\n    border-color: var(--primary-color);\n    color: var(--primary-color);\n    background: rgba(33, 56, 81, 0.05);\n    transform: translateX(4px);\n}\n\n.btn-back svg {\n    width: 20px;\n    height: 20px;\n    flex-shrink: 0;\n}\n\n.header-content {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-xl);\n}\n\n.category-badge {\n    width: 90px;\n    height: 90px;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    border-radius: var(--radius-2xl);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    box-shadow: var(--shadow-xl);\n    flex-shrink: 0;\n    position: relative;\n    color: white;\n}\n\n.category-badge svg {\n    width: 48px;\n    height: 48px;\n}\n\n.category-badge::before {\n    content: '';\n    position: absolute;\n    inset: -4px;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    border-radius: var(--radius-2xl);\n    opacity: 0.2;\n    z-index: -1;\n}\n\n.header-text {\n    flex: 1;\n}\n\n.page-title {\n    font-size: 2rem;\n    font-weight: 800;\n    color: var(--text-primary);\n    margin-bottom: 0.5rem;\n    line-height: 1.2;\n}\n\n.page-subtitle {\n    font-size: 1rem;\n    color: var(--text-secondary);\n    font-weight: 500;\n}\n\n/* Filters Section */\n.filters-section {\n    padding: var(--spacing-lg) 0;\n    background: var(--surface-color);\n    border-bottom: 1px solid var(--border-color);\n    position: sticky;\n    top: 70px;\n    z-index: 10;\n}\n\n.filters-bar {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-md);\n    flex-wrap: wrap;\n}\n\n.search-filter {\n    flex: 1;\n    min-width: 250px;\n    position: relative;\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-sm);\n    padding: 0.75rem 1rem;\n    background: var(--bg-color);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    transition: var(--transition-base);\n}\n\n.search-filter:focus-within {\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n.search-filter svg {\n    color: var(--text-secondary);\n    flex-shrink: 0;\n}\n\n.search-filter input {\n    flex: 1;\n    border: none;\n    background: transparent;\n    font-size: 0.95rem;\n    outline: none;\n}\n\n.filter-group {\n    display: flex;\n    align-items: center;\n}\n\n.filter-select {\n    padding: 0.75rem 1rem;\n    border: 2px solid var(--border-color);\n    background: var(--surface-color);\n    border-radius: var(--radius-lg);\n    font-size: 0.9rem;\n    font-weight: 600;\n    cursor: pointer;\n    transition: var(--transition-base);\n    outline: none;\n    min-width: 150px;\n    color: var(--text-primary);\n}\n\n.filter-select:hover {\n    border-color: var(--primary-color);\n}\n\n.filter-select:focus {\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n/* Workshops Section */\n.workshops-section {\n    padding: var(--spacing-2xl) 0;\n    background: var(--bg-color);\n    min-height: 60vh;\n}\n\n.workshops-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));\n    gap: var(--spacing-xl);\n}\n\n.workshop-card {\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    overflow: hidden;\n    box-shadow: var(--shadow-sm);\n    transition: var(--transition-base);\n    border: 2px solid transparent;\n    display: flex;\n    flex-direction: column;\n}\n\n.workshop-card:hover {\n    transform: translateY(-4px);\n    box-shadow: var(--shadow-lg);\n    border-color: var(--primary-color);\n}\n\n.workshop-image {\n    width: 100%;\n    height: 200px;\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    position: relative;\n}\n\n.workshop-icon {\n    color: var(--primary-color);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n}\n\n.workshop-icon svg {\n    width: 64px;\n    height: 64px;\n}\n\n.workshop-badge {\n    position: absolute;\n    top: var(--spacing-md);\n    right: var(--spacing-md);\n    padding: 0.375rem 0.75rem;\n    background: var(--surface-color);\n    border-radius: var(--radius-full);\n    font-size: 0.75rem;\n    font-weight: 700;\n    box-shadow: var(--shadow-sm);\n}\n\n.workshop-badge.free {\n    color: #10b981;\n    background: rgba(16, 185, 129, 0.1);\n}\n\n.workshop-badge.paid {\n    color: var(--primary-color);\n    background: rgba(33, 56, 81, 0.1);\n}\n\n.workshop-content {\n    padding: var(--spacing-lg);\n    display: flex;\n    flex-direction: column;\n    gap: var(--spacing-md);\n    flex: 1;\n}\n\n.workshop-title {\n    font-size: 1.15rem;\n    font-weight: 700;\n    color: var(--text-primary);\n    margin: 0;\n    line-height: 1.4;\n}\n\n.workshop-description {\n    font-size: 0.9rem;\n    color: var(--text-secondary);\n    line-height: 1.6;\n    display: -webkit-box;\n    -webkit-line-clamp: 2;\n    -webkit-box-orient: vertical;\n    overflow: hidden;\n}\n\n.workshop-meta {\n    display: flex;\n    flex-direction: column;\n    gap: 0.5rem;\n    padding-top: var(--spacing-sm);\n    border-top: 1px solid var(--border-color);\n}\n\n.workshop-meta-item {\n    display: flex;\n    align-ite
