= new window.Appwrite.Client()\n                .setEndpoint(APPWRITE_ENDPOINT)\n                .setProject(APPWRITE_PROJECT_ID);\n\n            account = new window.Appwrite.Account(client);\n            databases = new window.Appwrite.Databases(client);\n            Query = window.Appwrite.Query;\n            initialized = true;\n            console.log('✅ Appwrite initialized successfully');\n        } catch (error) {\n            console.error('❌ AppwriteHelper init failed:', error);\n            initialized = false;\n            throw error;\n        }\n    }\n\n    async function createAccount({ email, password, name, role, prefs = {} }) {\n        try {\n            await init();\n\n            // تحقق من صحة المدخلات\n            if (!email || !password || !name) {\n                throw new Error('البريد الإلكتروني وكلمة المرور والاسم مطلوبة');\n            }\n\n            // ✅ نتأكد الأول إنه مفيش session قديمة نشطة (من تجربة سابقة مثلاً)\n            // لأن Appwrite بيرفض إنشاء session جديدة لو فيه واحدة شغالة بالفعل\n            try {\n                await account.deleteSession('current');\n                console.log('🗑️ تم حذف session قديمة كانت نشطة');\n            } catch (sessionCleanupError) {\n                // طبيعي جدًا إنها تفشل لو مفيش session أصلاً - نتجاهلها\n            }\n\n            console.log('جاري إنشاء حساب Appwrite...', { email, name });\n            // ✅ استخدام ID.unique() بدلاً من النص الحرفي 'unique()'\n            const user = await account.create(window.Appwrite.ID.unique(), email, password, name);\n\n            console.log('✅ تم إنشاء الحساب بنجاح:', user.$id);\n\n            // ✅ لازم نسجّل دخول (نعمل session) قبل أي عملية تانية زي updatePrefs\n            // لأن account.create() بينشئ الحساب بس من غير ما يسجّل دخول تلقائيًا\n            if (typeof account.createEmailPasswordSession === 'function') {\n                await account.createEmailPasswordSession(email, password);\n            } else {\n                await account.createEmailSession(email, password);\n            }\n            console.log('✅ تم تسجيل الدخول بعد إنشاء الحساب');\n\n            // تحديث التفضيلات\n            await account.updatePrefs({ role, ...prefs });\n            console.log('✅ تم تحديث التفضيلات');\n\n            return user;\n        } catch (error) {\n            console.error('❌ خطأ في إنشاء الحساب:', error);\n            throw new Error(`فشل إنشاء الحساب: ${error.message}`);\n        }\n    }\n\n    async function createSession(email, password) {\n        try {\n            await init();\n            console.log('جاري تسجيل الدخول...', email);\n            // ✅ createEmailSession قديمة/متوقفة في إصدارات SDK الأحدث، استخدم الاسم الجديد\n            if (typeof account.createEmailPasswordSession === 'function') {\n                await account.createEmailPasswordSession(email, password);\n            } else {\n                await account.createEmailSession(email, password);\n            }\n            const user = await account.get();\n            console.log('✅ تم تسجيل الدخول بنجاح');\n            return user;\n        } catch (error) {\n            console.error('❌ خطأ في تسجيل الدخول:', error);\n            throw new Error(`فشل تسجيل الدخول: ${error.message}`);\n        }\n    }\n\n    async function logout() {\n        await init();\n        try {\n            await account.deleteSession('current');\n        } catch (error) {\n            console.warn('Appwrite logout failed:', error);\n        }\n    }\n\n    async function getCurrentAccount() {\n        await init();\n        return account.get();\n    }\n\n    async function updatePrefs(prefs) {\n        await init();\n        return account.updatePrefs(prefs);\n    }\n\n    // Database operations\n    async function createDocument(collectionId, data) {\n        try {\n            await init();\n            console.log(`جاري حفظ document في ${collectionId}...`);\n            const doc = await databases.createDocument(APPWRITE_DATABASE_ID, collectionId, window.Appwrite.ID.unique(), data);\n            console.log(`✅ تم حفظ المستند بنجاح: ${doc.$id}`);\n            return doc;\n        } catch (error) {\n            console.error(`❌ خطأ في حفظ المستند في ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function getDocument(collectionId, documentId) {\n        try {\n            await init();\n            return await databases.getDocument(APPWRITE_DATABASE_ID, collectionId, documentId);\n        } catch (error) {\n            console.error(`❌ خطأ في الحصول على المستند من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function updateDocument(collectionId, documentId, data) {\n        try {\n            await init();\n            console.log(`جاري تحديث المستند في ${collectionId}...`);\n            const doc = await databases.updateDocument(APPWRITE_DATABASE_ID, collectionId, documentId, data);\n            console.log(`✅ تم تحديث المستند بنجاح`);\n            return doc;\n        } catch (error) {\n            console.error(`❌ خطأ في تحديث المستند في ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function deleteDocument(collectionId, documentId) {\n        try {\n            await init();\n            await databases.deleteDocument(APPWRITE_DATABASE_ID, collectionId, documentId);\n            console.log(`✅ تم حذف المستند بنجاح`);\n        } catch (error) {\n            console.error(`❌ خطأ في حذف المستند من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function listDocuments(collectionId, queries = []) {\n        try {\n            await init();\n            return await databases.listDocuments(APPWRITE_DATABASE_ID, collectionId, queries);\n        } catch (error) {\n            console.error(`❌ خطأ في جلب المستندات من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    window.AppwriteHelper = {\n        init,\n        createAccount,\n        createSession,\n        logout,\n        getCurrentAccount,\n        updatePrefs,\n        createDocument,\n        getDocument,\n        updateDocument,\n        deleteDocument,\n        listDocuments,\n        get Query() {\n            return Query;\n        },\n        APPWRITE_ENDPOINT,\n        APPWRITE_PROJECT_ID,\n        APPWRITE_DATABASE_ID,\n        isReady: () => initialized\n    };\n})(window);<\/script>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script>// Auth functionality\n// Appwrite هو مصدر الحقيقة الأساسي دلوقتي لتسجيل الدخول والتسجيل.\n// localStorage بقى مجرد fallback لحالة عدم توفر Appwrite (تطوير/اختبار أوفلاين) - مفيهوش كلمات سر حقيقية بعد كده.\ndocument.addEventListener('DOMContentLoaded', () => {\n    initializeAccountTypeSelection();\n    initializeFileUploads();\n    initializeLoginForm();\n    initializeRegisterForm();\n});\n\n// Account Type Selection\nfunction initializeAccountTypeSelection() {\n    const accountTypeCards = document.querySelectorAll('.account-type-card');\n    const talentInfo = document.getElementById('talentInfo');\n    let selectedType = null;\n\n    accountTypeCards.forEach(card => {\n        card.addEventListener('click', function() {\n            accountTypeCards.forEach(c => c.classList.remove('active'));\n            this.classList.add('active');\n            selectedType = this.dataset.type;\n\n            if (talentInfo) {\n                if (selectedType === 'talent') {\n                    talentInfo.classList.remove('hidden');\n                    talentInfo.querySelectorAll('select[name=\"category\"]').forEach(field => {\n                        field.setAttribute('required', 'required');\n                    });\n                } else {\n                    talentInfo.classList.add('hidden');\n                    talentInfo.querySelectorAll('select[name=\"category\"]').forEach(field => {\n                        field.removeAttribute('required');\n                    });\n                }\n            }\n        });\n    });\n}\n\n// File Upload Handlers\nfunction initializeFileUploads() {\n    const cvFile = document.getElementById('cvFile');\n    const photoFile = document.getElementById('photoFile');\n    const cvFileName = document.getElementById('cvFileName');\n    const photoFileName = document.getElementById('photoFileName');\n\n    if (cvFile) {\n        cvFile.addEventListener('change', function() {\n            if (this.files && this.files[0]) {\n                cvFileName.textContent = '✓ ' + this.files[0].name;\n            } else {\n                cvFileName.textContent = '';\n            }\n        });\n    }\n\n    if (photoFile) {\n        photoFile.addEventListener('change', function() {\n            if (this.files && this.files[0]) {\n                photoFileName.textContent = '✓ ' + this.files[0].name;\n            } else {\n                photoFileName.textContent = '';\n            }\n        });\n    }\n}\n\n// localStorage دلوقتي بقى fallback بس (دليل أوفلاين) - مفيهوش كلمات سر حقيقية\nfunction getStoredUsers() {\n    try {\n        return JSON.parse(localStorage.getItem('site_users') || '[]');\n    } catch (error) {\n        return [];\n    }\n}\n\nfunction setStoredUsers(users) {\n    localStorage.setItem('site_users', JSON.stringify(users));\n}\n\nfunction normalizeUserRole(role) {\n    const normalized = (role || 'client').toString().trim().toLowerCase();\n    if (['admin', 'administrator', 'superadmin'].includes(normalized)) return 'admin';\n    if (['talent', 'موهوب', 'freelancer'].includes(normalized)) return 'talent';\n    if (['client', 'beneficiary', 'customer', 'مستفيد'].includes(normalized)) return 'client';\n    return 'client';\n}\n\nfunction buildSessionUserPayload(sourceUser = {}, fallbackUser = null) {\n    if (typeof window.createSessionUser === 'function') {\n        return window.createSessionUser(sourceUser, fallbackUser);\n    }\n\n    const baseUser = fallbackUser || {};\n    const firstName = sourceUser.firstName || sourceUser.name?.split(' ')[0] || baseUser.firstName || '';\n    const lastName = sourceUser.lastName || (sourceUser.name ? sourceUser.name.split(' ').slice(1).join(' ') : '') || baseUser.lastName || '';\n\n    return {\n        id: sourceUser.id || baseUser.id || '',\n        firstName,\n        lastName,\n        email: sourceUser.email || baseUser.email || '',\n        role: normalizeUserRole(sourceUser.role || baseUser.role || ''),\n        phone: sourceUser.phone || baseUser.phone || '',\n        category: sourceUser.category || baseUser.category || '',\n        bio: sourceUser.bio || baseUser.bio || '',\n        experience: sourceUser.experience ?? baseUser.experience ?? '',\n        city: sourceUser.city || baseUser.city || '',\n        portfolio: sourceUser.portfolio || baseUser.portfolio || '',\n        registeredAt: sourceUser.registeredAt || baseUser.registeredAt || '',\n        avatar: sourceUser.avatar || baseUser.avatar || '',\n        profileId: sourceUser.profileId || baseUser.profileId || null,\n        sessionSource: sourceUser.sessionSource || baseUser.sessionSource || '',\n        isDefaultProfile: false\n    };\n}\n\nfunction getCurrentUser() {\n    try {\n        const currentUser = JSON.parse(localStorage.getItem('site_current_user') || 'null');\n        if (currentUser) return currentUser;\n\n        const sessionData = JSON.parse(localStorage.getItem('site_session') || 'null');\n        return sessionData?.user || null;\n    } catch (error) {\n        return null;\n    }\n}\n\nfunction setCurrentUser(user) {\n    const normalizedUser = user ? buildSessionUserPayload(user, getCurrentUser()) : null;\n    localStorage.setItem('site_current_user', JSON.stringify(normalizedUser));\n    localStorage.setItem('site_session', JSON.stringify({\n        isLoggedIn: !!normalizedUser,\n        user: normalizedUser,\n        loggedInAt: new Date().toISOString(),\n        source: normalizedUser?.sessionSource || 'default'\n    }));\n\n    if (typeof window.setSiteCurrentUser === 'function') {\n        window.setSiteCurrentUser(normalizedUser);\n    }\n}\n\nfunction getDefaultRedirect(role) {\n    const normalizedRole = (role || '').toString().trim().toLowerCase();\n    if (normalizedRole === 'admin') return 'admin.html';\n    if (normalizedRole === 'talent') return 'dashboard.html';\n    return 'beneficiary.html';\n}\n\n/**\n * تسجيل الدخول عبر Appwrite.\n * - لو AppwriteHelper مش متاح خالص (السكريبت مش متحمّل مثلاً): بيرجع null بهدوء (يسمح بالـ fallback المحلي).\n * - لو Appwrite متاح لكن البريد/الباسورد غلط أو أي خطأ فعلي: بيرمي (throw) الخطأ عشان الكولر يفرّق\n *   بين \"Appwrite مش شغال\" و\"بيانات الدخول غلط\".\n */\nasync function loginWithAppwrite(email, password) {\n    if (!window.AppwriteHelper) return null;\n\n    const user = await window.AppwriteHelper.createSession(email, password);\n\n    // نجيب بروفايل المستخدم من كولكشن users عبر accountId\n    let profile = null;\n    try {\n        const userProfiles = await window.AppwriteHelper.listDocuments('users', [\n            window.AppwriteHelper.Query.equal('accountId', user.$id)\n        ]);\n        if (userProfiles.documents && userProfiles.documents.length > 0) {\n            profile = userProfiles.documents[0];\n        }\n    } catch (profileError) {\n        console.warn('⚠️ تعذّر جلب بروفايل المستخدم من قاعدة البيانات:', profileError);\n    }\n\n    return buildSessionUserPayload({\n        id: user.$id,\n        name: user.name || '',\n        firstName: user.name ? user.name.split(' ')[0] : email.split('@')[0],\n        lastName: user.name ? user.name.split(' ').slice(1).join(' ') : '',\n        email: user.email,\n        role: profile?.type || user.prefs?.role || '',\n        phone: profile?.phone || user.prefs?.phone || '',\n        category: profile?.category || user.prefs?.category || '',\n        bio: profile?.bio || user.prefs?.bio || '',\n        experience: profile?.experience || user.prefs?.experience || '',\n        city: profile?.city || user.prefs?.city || '',\n        portfolio: profile?.portfolio || user.prefs?.portfolio || '',\n        registeredAt: user.prefs?.registeredAt || '',\n        avatar: profile?.avatar || (user.name ? user.name.charAt(0) : ''),\n        profileId: profile?.$id || null,\n        sessionSource: profile ? 'database' : 'appwrite-auth-only',\n        isDefaultProfile: false\n    }, getCurrentUser());\n}\n\n/**\n * إنشاء حساب عبر Appwrite (Auth + مستند بروفايل في كولكشن users).\n * ملاحظة: مفيش created_at/updated_at في الـ payload لأن كولكشن users معندوش الأعمدة دي -\n * Appwrite بيسجل $createdAt/$updatedAt تلقائيًا لوحده.\n */\nasync function signupWithAppwrite(user) {\n    if (!window.AppwriteHelper) {\n        console.warn('⚠️ AppwriteHelper غير متاح - سيتم الحفظ في localStorage فقط');\n        return null;\n    }\n\n    console.log('📝 جاري محاولة إنشاء حساب في Appwrite...');\n\n    const appwriteUser = await window.AppwriteHelper.createAccount({\n        email: user.email,\n        password: user.password,\n        name: `${user.firstName} ${user.lastName}`,\n        role: user.role,\n        prefs: {\n            phone: user.phone,\n            category: user.category,\n            bio: user.bio,\n            experience: user.experience,\n            city: user.city,\n            portfolio: user.portfolio,\n            registeredAt: user.registeredAt\n        }\n    });\n\n    console.log('✅ تم إنشاء الحساب في Appwrite:', appwriteUser.$id);\n\n    const userProfile = {\n        accountId: appwriteUser.$id,\n        name: `${user.firstName} ${user.lastName}`,\n        email: user.email,\n        phone: user.phone,\n        type: user.role,\n        category: user.category,\n        bio: user.bio,\n        experience: parseInt(user.experience) || 0,\n        city: user.city,\n        rating: 0.0,\n        reviews_count: 0,\n        projects_completed: 0,\n        avatar: (user.firstName || 'م').charAt(0),\n        portfolio: user.portfolio,\n        verified: false,\n        status: 'active',\n        // لا created_at ولا updated_at هنا - العمودين دول مش موجودين في كولكشن users\n    };\n\n    try {\n        const userDoc = await window.AppwriteHelper.createDocument('users', userProfile);\n        console.log('✅ تم إنشاء ملف المستخدم في قاعدة البيانات:', userDoc.$id);\n        return { ...appwriteUser, profile: userDoc };\n    } catch (dbError) {\n        console.error('❌ تم إنشاء الحساب لكن فشل حفظ بروفايله في قاعدة البيانات:', dbError);\n        // نرمي الخطأ بدل ما نبلعه - عشان المستخدم يعرف إن حسابه ناقص بروفايل ومحتاج تدخل يدوي\n        throw new Error(`تم إنشاء الحساب لكن فشل حفظ بيانات البروفايل: ${dbError.message}`);\n    }\n}\n\n// Login Form\nfunction initializeLoginForm() {\n    const loginForm = document.getElementById('loginForm');\n    const existingUser = getCurrentUser();\n    if (existingUser && loginForm) {\n        __setHref(getDefaultRedirect(existingUser.role));\n        return;\n    }\n\n    if (loginForm) {\n        loginForm.addEventListener('submit', async (e) => {\n            e.preventDefault();\n\n            const emailInput = loginForm.querySelector('input[type=\"email\"]');\n            const passwordInput = loginForm.querySelector('input[type=\"password\"]');\n            const email = emailInput ? emailInput.value.trim().toLowerCase() : '';\n            const password = passwordInput ? passwordInput.value.trim() : '';\n\n            if (!email || !password) {\n                window.showToast ? window.showToast('الرجاء إدخال البريد وكلمة المرور', 'error') : alert('الرجاء إدخال البريد وكلمة المرور');\n                return;\n            }\n\n            // 1) نجرب Appwrite الأول دايمًا - هو مصدر الحقيقة\n            let appwriteUser = null;\n            let appwriteReachable = true;\n            try {\n                appwriteUser = await loginWithAppwrite(email, password);\n                if (appwriteUser === null) appwriteReachable = false; // AppwriteHelper مش متاح خالص\n            } catch (err) {\n                console.warn('⚠️ فشل تسجيل الدخول عبر Appwrite:', err);\n                appwriteReachable = true; // Appwrite شغال لكن البيانات غلط أو حصل خطأ فعلي\n                appwriteUser = null;\n            }\n\n            if (appwriteUser) {\n                setCurrentUser(appwriteUser);\n                window.showToast ? window.showToast('تم تسجيل الدخول بنجاح', 'success') : alert('تم تسجيل الدخول بنجاح!');\n                setTimeout(() => {\n                    __setHref(getDefaultRedirect(appwriteUser.role));\n                }, 1000);\n                return;\n            }\n\n            if (appwriteReachable) {\n                // Appwrite شغال لكن البريد/الباسورد غلط - منرجعش لـ localStorage عشان منضللش المستخدم\n                window.showToast ? window.showToast('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error') : alert('البريد الإلكتروني أو كلمة المرور غير صحيحة');\n                return;\n            }\n\n            // 2) fallback: Appwrite مش متاح خالص (مثلاً السكريبت مش متحمّل) - نستخدم localStorage كخطة بديلة للتطوير فقط\n            const users = getStoredUsers();\n            const localUser = users.find(u => u.email === email);\n            if (!localUser || (localUser.password && localUser.password !== password)) {\n                window.showToast ? window.showToast('المستخدم غير موجود أو كلمة المرور غير صحيحة', 'error') : alert('المستخدم غير موجود أو كلمة المرور غير صحيحة');\n                return;\n            }\n\n            setCurrentUser(localUser);\n            window.showToast ? window.showToast('تم تسجيل الدخول (وضع محلي - Appwrite غير متاح)', 'success') : alert('تم تسجيل الدخول بنجاح!');\n            setTimeout(() => {\n                __setHref(getDefaultRedirect(localUser.role));\n            }, 1000);\n        });\n    }\n}\n\n// Register Form\nfunction initializeRegisterForm() {\n    const registerForm = document.getElementById('registerForm');\n    const existingUser = getCurrentUser();\n    if (existingUser && registerForm) {\n        __setHref(getDefaultRedirect(existingUser.role));\n        return;\n    }\n\n    if (registerForm) {\n        registerForm.addEventListener('submit', async (e) => {\n            e.preventDefault();\n\n            const selectedCard = document.querySelector('.account-type-card.active');\n            if (!selectedCard) {\n                window.showToast ? window.showToast('الرجاء اختيار نوع الحساب', 'error') : alert('الرجاء اختيار نوع الحساب');\n                return;\n            }\n\n            const accountType = selectedCard.dataset.type;\n            const formData = new FormData(registerForm);\n            formData.append('accountType', accountType);\n\n            const password = (formData.get('password') || '').toString();\n            const confirmPassword = (formData.get('confirmPassword') || '').toString();\n\n            if (password.length < 8) {\n                window.showToast ? window.showToast('كلمة المرور يجب أن تكون 8 أحرف على الأقل', 'error') : alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');\n                return;\n            }\n\n            if (password !== confirmPassword) {\n                window.showToast ? window.showToast('كلمة المرور غير متطابقة', 'error') : alert('كلمة المرور غير متطابقة');\n                return;\n            }\n\n            const newUser = {\n                id: `u_${Date.now()}`,\n                firstName: formData.get('firstName') || '',\n                lastName: formData.get('lastName') || '',\n                email: (formData.get('email') || '').trim().toLowerCase(),\n                phone: formData.get('phone') || '',\n                password: password, // بتتشال قبل ما نخزّن في localStorage لو Appwrite نجح - بص تحت\n                role: accountType,\n                category: formData.get('category') || '',\n                bio: formData.get('bio') || '',\n                experience: formData.get('experience') || '',\n                city: formData.get('city') || '',\n                portfolio: formData.get('portfolio') || '',\n                registeredAt: new Date().toISOString(),\n                avatar: (formData.get('firstName') || 'م').charAt(0)\n            };\n\n            let appwriteUser = null;\n            let appwriteError = null;\n            try {\n                appwriteUser = await signupWithAppwrite(newUser);\n            } catch (err) {\n                appwriteError = err;\n                console.error('❌ خطأ في إنشاء حساب Appwrite:', err);\n            }\n\n            if (appwriteUser) {\n                // نجح Appwrite بالكامل - هو مصدر الحقيقة، منخزّنش الباسورد الحقيقي محليًا\n                newUser.id = appwriteUser.$id;\n                const localCacheUser = { ...newUser };\n                delete localCacheUser.password; // ما نخزنش كلمة سر حقيقية في localStorage\n\n                const users = getStoredUsers();\n                const existingIndex = users.findIndex(u => u.email === newUser.email);\n                if (existingIndex >= 0) {\n                    users[existingIndex] = localCacheUser;\n                } else {\n                    users.push(localCacheUser);\n                }\n                setStoredUsers(users);\n\n                const sessionUser = buildSessionUserPayload({\n                    id: appwriteUser.$id,\n                    firstName: newUser.firstName,\n                    lastName: newUser.lastName,\n                    email: newUser.email,\n                    role: newUser.role,\n                    phone: newUser.phone,\n                    category: newUser.category,\n                    bio: newUser.bio,\n                    experience: newUser.experience,\n                    city: newUser.city,\n                    portfolio: newUser.portfolio,\n                    registeredAt: newUser.registeredAt,\n                    avatar: newUser.avatar,\n                    profileId: appwriteUser.profile?.$id || null,\n                    sessionSource: 'database'\n                });\n                setCurrentUser(sessionUser);\n            } else {\n                // فشل Appwrite بالكامل (مش متاح أو حصل خطأ) - fallback كامل لـ localStorage للتطوير فقط\n                window.showToast\n                    ? window.showToast(\n                          appwriteError\n                              ? `⚠️ فشل إنشاء الحساب على Appwrite: ${appwriteError.message}`\n                              : '⚠️ Appwrite غير متاح - تم الحفظ محليًا فقط (وضع تطوير)',\n                          'error'\n                      )\n                    : alert('⚠️ فشل إنشاء الحساب على Appwrite. افتح Console (F12) لترى التفاصيل.');\n\n                const users = getStoredUsers();\n                const existing = users.find(u => u.email === newUser.email);\n                if (existing) {\n                    window.showToast ? window.showToast('هذا البريد مستخدم بالفعل', 'error') : alert('هذا البريد مستخدم بالفعل');\n                    return;\n                }\n                users.push(newUser); // هنا فقط بيتخزن الباسورد محليًا - لأن مفيش Appwrite أصلاً يتحقق منها\n                setStoredUsers(users);\n                setCurrentUser(newUser);\n            }\n\n            const message = accountType === 'talent'\n                ? 'تم إنشاء حساب الموهوب بنجاح! ستتم مراجعة بياناتك قريباً.'\n                : 'تم إنشاء الحساب بنجاح!';\n\n            window.showToast ? window.showToast(message, 'success') : alert(message);\n\n            setTimeout(() => {\n                __setHref(getDefaultRedirect(accountType));\n            }, 2000);\n        });\n    }\n}<\/script>\n<script>\n        // Load footer safely\n        document.addEventListener('DOMContentLoaded', () => {\n            fetch('components/footer.html')\n                .then(response => {\n                    if (!response.ok) throw new Error('Failed to load footer');\n                    return response.text();\n                })\n                .then(data => {\n                    const footer = document.getElementById('footer-container');\n                    if (footer) footer.innerHTML = data;\n                })\n                .catch(error => {\n                    console.warn('Footer loading error:', error);\n                    // Continue without footer\n                });\n        });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "register": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>إنشاء حساب - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* Auth Pa h-form {\n    margin-bottom: 1.75rem;\n}\n\n.form-row {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 1rem;\n}\n\n.form-group {\n    margin-bottom: 1.25rem;\n}\n\n.form-group label {\n    display: block;\n    margin-bottom: 0.5rem;\n    font-weight: 600;\n    color: var(--text-primary);\n    font-size: 0.85rem;\n}\n\n.form-group input,\n.form-group select {\n    width: 100%;\n    padding: 0.85rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    font-size: 0.9rem;\n    transition: var(--transition-base);\n    background: var(--bg-color);\n    font-family: 'Tajawal', sans-serif;\n}\n\n.form-group input:focus,\n.form-group select:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 4px rgba(33, 56, 81, 0.1);\n    background: white;\n}\n\n.form-group input::placeholder {\n    color: #9ca3af;\n    font-size: 0.85rem;\n}\n\n/* Account Type Selection */\n.account-type-section {\n    margin-bottom: 2rem;\n}\n\n.section-label {\n    display: block;\n    font-weight: 700;\n    color: var(--text-primary);\n    font-size: 0.9rem;\n    margin-bottom: 1rem;\n    text-align: center;\n}\n\n.account-type-cards {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 1rem;\n    margin-bottom: 1.5rem;\n}\n\n.account-type-card {\n    padding: 1.5rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    text-align: center;\n    cursor: pointer;\n    transition: all 0.3s ease;\n    background: var(--bg-color);\n}\n\n.account-type-card:hover {\n    border-color: var(--primary-color);\n    transform: translateY(-2px);\n    box-shadow: 0 4px 12px rgba(33, 56, 81, 0.15);\n}\n\n.account-type-card.active {\n    border-color: var(--primary-color);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    box-shadow: 0 4px 12px rgba(33, 56, 81, 0.2);\n}\n\n.account-type-icon {\n    width: 50px;\n    height: 50px;\n    margin: 0 auto 0.75rem;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-full);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    color: var(--primary-color);\n    transition: all 0.3s ease;\n}\n\n.account-type-card.active .account-type-icon {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    color: white;\n}\n\n.account-type-card h3 {\n    font-size: 1rem;\n    font-weight: 700;\n    color: var(--text-primary);\n    margin-bottom: 0.25rem;\n}\n\n.account-type-card p {\n    font-size: 0.8rem;\n    color: var(--text-secondary);\n    margin: 0;\n}\n\n/* Form Sections */\n.form-section {\n    transition: all 0.3s ease;\n}\n\n.form-section.hidden {\n    display: none;\n}\n\n.section-divider {\n    text-align: center;\n    margin: 2rem 0 1.5rem;\n    position: relative;\n}\n\n.section-divider::before {\n    content: '';\n    position: absolute;\n    top: 50%;\n    left: 0;\n    right: 0;\n    height: 1px;\n    background: var(--border-color);\n}\n\n.section-divider span {\n    position: relative;\n    background: var(--surface-color);\n    padding: 0 1rem;\n    font-weight: 700;\n    color: var(--primary-color);\n    font-size: 0.85rem;\n}\n\n/* File Upload */\n.file-upload-area {\n    margin-top: 0.5rem;\n}\n\n.file-upload-label {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 0.5rem;\n    padding: 1.5rem;\n    border: 2px dashed var(--border-color);\n    border-radius: var(--radius-lg);\n    cursor: pointer;\n    transition: var(--transition-base);\n    background: var(--bg-color);\n    color: var(--text-secondary);\n}\n\n.file-upload-label:hover {\n    border-color: var(--primary-color);\n    background: rgba(33, 56, 81, 0.05);\n    color: var(--primary-color);\n}\n\n.file-upload-label svg {\n    color: var(--primary-color);\n}\n\n.file-upload-label span {\n    font-size: 0.85rem;\n    font-weight: 500;\n}\n\n.file-name {\n    margin-top: 0.5rem;\n    font-size: 0.8rem;\n    color: var(--text-secondary);\n    text-align: center;\n}\n\n.file-name:not(:empty) {\n    padding: 0.5rem;\n    background: rgba(33, 56, 81, 0.1);\n    border-radius: var(--radius-md);\n    color: var(--primary-color);\n}\n\n/* Textarea */\ntextarea {\n    width: 100%;\n    padding: 0.85rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    font-size: 0.9rem;\n    font-family: 'Tajawal', sans-serif;\n    resize: vertical;\n    min-height: 80px;\n    transition: var(--transition-base);\n    background: var(--bg-color);\n}\n\ntextarea:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 4px rgba(33, 56, 81, 0.1);\n    background: white;\n}\n\ntextarea::placeholder {\n    color: #9ca3af;\n    font-size: 0.85rem;\n}\n\n.form-options {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 1.75rem;\n    flex-wrap: wrap;\n    gap: 0.75rem;\n}\n\n.checkbox-label {\n    display: flex;\n    align-items: center;\n    gap: 0.5rem;\n    cursor: pointer;\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n}\n\n.checkbox-label input {\n    cursor: pointer;\n    width: 16px;\n    height: 16px;\n    accent-color: var(--primary-color);\n}\n\n.checkbox-label span {\n    user-select: none;\n}\n\n.link {\n    color: var(--primary-color);\n    font-weight: 600;\n    transition: var(--transition-fast);\n    text-decoration: none;\n    font-size: 0.85rem;\n}\n\n.link:hover {\n    color: var(--secondary-color);\n    text-decoration: underline;\n}\n\n.btn-block {\n    width: 100%;\n    padding: 0.95rem;\n    font-size: 0.95rem;\n    font-weight: 700;\n    border-radius: var(--radius-lg);\n    box-shadow: 0 4px 12px rgba(33, 56, 81, 0.3);\n    transition: all 0.3s ease;\n}\n\n.btn-block:hover {\n    transform: translateY(-2px);\n    box-shadow: 0 6px 20px rgba(33, 56, 81, 0.4);\n}\n\n.btn-block:active {\n    transform: translateY(0);\n}\n\n.auth-footer {\n    text-align: center;\n    padding-top: 1.75rem;\n    border-top: 2px solid var(--border-color);\n    color: var(--text-secondary);\n    font-size: 0.9rem;\n}\n\n.auth-footer p {\n    margin: 0;\n}\n\n/* Responsive Design */\n@media (max-width: 768px) {\n    .auth-container {\n        max-width: 100%;\n    }\n    \n    .auth-card {\n        padding: 2rem 1.75rem;\n    }\n    \n    .auth-logo h1 {\n        font-size: 2rem;\n    }\n    \n    .auth-header h2 {\n        font-size: 1.35rem;\n    }\n    \n    .form-row {\n        grid-template-columns: 1fr;\n        gap: 0;\n    }\n    \n    .account-type-cards {\n        grid-template-columns: 1fr;\n    }\n}\n\n@media (max-width: 480px) {\n    .auth-page {\n        padding: var(--spacing-md);\n    }\n    \n    .auth-card {\n        padding: 1.75rem 1.25rem;\n    }\n    \n    .auth-logo h1 {\n        font-size: 1.75rem;\n    }\n    \n    .auth-header h2 {\n        font-size: 1.25rem;\n    }\n    \n    .auth-header p {\n        font-size: 0.85rem;\n    }\n    \n    .form-group input,\n    .form-group select {\n        padding: 0.75rem 0.85rem;\n        font-size: 0.85rem;\n    }\n    \n    .form-options {\n        flex-direction: column;\n        align-items: flex-start;\n    }\n    \n    .btn-block {\n        padding: 0.85rem;\n        font-size: 0.9rem;\n    }\n    \n    .account-type-card {\n        padding: 1.25rem 0.85rem;\n    }\n    \n    .account-type-icon {\n        width: 45px;\n        height: 45px;\n    }\n    \n    .account-type-icon svg {\n        width: 28px;\n        height: 28px;\n    }\n}\n</style>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;display=swap\" rel=\"stylesheet\"/>\n</head>\n<body class=\"auth-page\">\n<div class=\"auth-container\">\n<div class=\"auth-card\">\n<a class=\"auth-back-link\" href=\"index.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<line x1=\"19\" x2=\"5\" y1=\"12\" y2=\"12\"></line>\n<polyline points=\"12 19 5 12 12 5\"></polyline>\n</svg>\n<span>العودة للرئيسية</span>\n</a>\n<div class=\"auth-header\">\n<a class=\"auth-logo\" href=\"index.html\"><h1>حاذق</h1></a>\n<h2>إنشاء حساب جديد</h2>\n<p>انضم إلى منصة حاذق وابدأ رحلتك</p>\n</div>\n<form class=\"auth-form\" id=\"registerForm\">\n<!-- Account Type Selection -->\n<div class=\"account-type-section\">\n<label class=\"section-label\">نوع الحساب</label>\n<div class=\"account-type-cards\">\n<div class=\"account-type-card\" data-type=\"client\">\n<div class=\"account-type-icon\">\n<svg fill=\"none\" height=\"32\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"32\">\n<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"12\" cy=\"7\" r=\"4\"></circle>\n</svg>\n</div>\n<h3>مستفيد</h3>\n<p>أبحث عن مواهب وخدمات</p>\n</div>\n<div class=\"account-type-card\" data-type=\"talent\">\n<div class=\"account-type-icon\">\n<svg fill=\"none\" height=\"32\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"32\">\n<polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"></polygon>\n</svg>\n</div>\n<h3>موهوب</h3>\n<p>أقدم خدماتي ومواهبي</p>\n</div>\n</div>\n</div>\n<!-- Basic Information (Always visible) -->\n<div class=\"form-section\" id=\"basicInfo\">\n<div class=\"form-row\">\n<div class=\"form-group\">\n<label for=\"firstName\">الاسم الأول</label>\n<input autocomplete=\"given-name\" id=\"firstName\" name=\"firstName\" placeholder=\"الاسم\" required=\"\" type=\"text\"/>\n</div>\n<div class=\"form-group\">\n<label for=\"lastName\">اسم العائلة</label>\n<input autocomplete=\"family-name\" id=\"lastName\" name=\"lastName\" placeholder=\"القبيلة\" required=\"\" type=\"text\"/>\n</div>\n</div>\n<div class=\"form-group\">\n<label for=\"registerEmail\">البريد الإلكتروني</label>\n<input autocomplete=\"email\" id=\"registerEmail\" name=\"email\" placeholder=\"example@gmail.com\" required=\"\" type=\"email\"/>\n</div>\n<div class=\"form-group\">\n<label for=\"phone\">رقم الهاتف</label>\n<input autocomplete=\"tel\" id=\"phone\" name=\"phone\" placeholder=\"+968 9X XXX XXX\" required=\"\" type=\"tel\"/>\n</div>\n<div class=\"form-row\">\n<div class=\"form-group\">\n<label for=\"registerPassword\">كلمة المرور</label>\n<input autocomplete=\"new-password\" id=\"registerPassword\" minlength=\"8\" name=\"password\" placeholder=\"8 أحرف على الأقل\" required=\"\" type=\"password\"/>\n</div>\n<div class=\"form-group\">\n<label for=\"confirmPassword\">تأكيد كلمة المرور</label>\n<input autocomplete=\"new-password\" id=\"confirmPassword\" minlength=\"8\" name=\"confirmPassword\" placeholder=\"8 أحرف على الأقل\" required=\"\" type=\"password\"/>\n</div>\n</div>\n</div>\n<!-- Talent Additional Information (Only for talents) -->\n<div class=\"form-section hidden\" id=\"talentInfo\">\n<div class=\"section-divider\">\n<span>معلومات الموهوب</span>\n</div>\n<div class=\"form-group\">\n<label for=\"category\">المجال</label>\n<select autocomplete=\"organization-title\" id=\"category\" name=\"category\" required=\"\">\n<option value=\"\">اختر مجالك</option>\n<option value=\"photography\">التصوير</option>\n<option value=\"design\">التصميم</option>\n<option value=\"writing\">الكتابة</option>\n<option value=\"programming\">البرمجة</option>\n<option value=\"marketing\">التسويق</option>\n<option value=\"video\">المونتاج والفيديو</option>\n<option value=\"voice\">التعليق الصوتي</option>\n<option value=\"translation\">الترجمة</option>\n</select>\n</div>\n<div class=\"form-group\">\n<label for=\"bio\">نبذة تعريفية</label>\n<textarea autocomplete=\"off\" id=\"bio\" name=\"bio\" placeholder=\"اكتب نبذة مختصرة عن خبراتك ومهاراتك...\" rows=\"3\"></textarea>\n</div>\n<div class=\"form-row\">\n<div class=\"form-group\">\n<label for=\"experience\">سنوات الخبرة</label>\n<input autocomplete=\"off\" id=\"experience\" min=\"0\" name=\"experience\" placeholder=\"مثال: 3\" type=\"number\"/>\n</div>\n<div class=\"form-group\">\n<label for=\"city\">المدينة</label>\n<input autocomplete=\"address-level2\" id=\"city\" name=\"city\" placeholder=\"مسقط\" type=\"text\"/>\n</div>\n</div>\n<div class=\"form-group\">\n<label for=\"portfolio\">رابط معرض الأعمال (اختياري)</label>\n<input autocomplete=\"url\" id=\"portfolio\" name=\"portfolio\" placeholder=\"https://...\" type=\"url\"/>\n</div>\n<div class=\"form-group\">\n<label>السيرة الذاتية (PDF)</label>\n<div class=\"file-upload-area\">\n<input accept=\".pdf\" hidden=\"\" id=\"cvFile\" name=\"cv\" type=\"file\"/>\n<label class=\"file-upload-label\" for=\"cvFile\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path>\n<polyline points=\"17 8 12 3 7 8\"></polyline>\n<line x1=\"12\" x2=\"12\" y1=\"3\" y2=\"15\"></line>\n</svg>\n<span>اضغط لرفع السيرة الذاتية</span>\n</label>\n<div class=\"file-name\" id=\"cvFileName\"></div>\n</div>\n</div>\n<div class=\"form-group\">\n<label>صورة شخصية</label>\n<div class=\"file-upload-area\">\n<input accept=\"image/*\" hidden=\"\" id=\"photoFile\" name=\"photo\" type=\"file\"/>\n<label class=\"file-upload-label\" for=\"photoFile\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<rect height=\"18\" rx=\"2\" ry=\"2\" width=\"18\" x=\"3\" y=\"3\"></rect>\n<circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"></circle>\n<polyline points=\"21 15 16 10 5 21\"></polyline>\n</svg>\n<span>اضغط لرفع صورة شخصية</span>\n</label>\n<div class=\"file-name\" id=\"photoFileName\"></div>\n</div>\n</div>\n</div>\n<div class=\"form-options\">\n<label class=\"checkbox-label\">\n<input required=\"\" type=\"checkbox\"/>\n<span>أوافق على <a class=\"link\" href=\"#\">الشروط والأحكام</a></span>\n</label>\n</div>\n<button class=\"btn btn-primary btn-block\" type=\"submit\">إنشاء الحساب</button>\n</form>\n<div class=\"auth-footer\">\n<p>لديك حساب بالفعل؟ <a class=\"link\" href=\"login.html\">تسجيل الدخول</a></p>\n</div>\n</div>\n</div>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script>/* Appwrite helper for authentication and profiles.\n * This file is a lightweight wrapper around the Appwrite JS SDK.\n * It falls back safely to localStorage when Appwrite is not available.\n */\n(function(window) {\n    const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';\n    const APPWRITE_PROJECT_ID = '6a01a17c0019070903f1';\n    const APPWRITE_DATABASE_ID = '6a01a20a0000dfd5ae2c';\n    \n    const SDK_URL = 'https://cdn.jsdelivr.net/npm/appwrite@14.0.1';\n\n    let initialized = false;\n    let client = null;\n    let account = null;\n    let databases = null;\n    let Query = null;\n\n    function loadSdk() {\n        return new Promise((resolve, reject) => {\n            // ✅ الاسم الصحيح للـ global هو Appwrite (بحرف A كابيتال) مش appwrite\n            if (window.Appwrite) {\n                return resolve();\n            }\n\n            const script = document.createElement('script');\n            script.src = SDK_URL;\n            script.onload = () => resolve();\n            script.onerror = () => reject(new Error('فشل تحميل Appwrite SDK'));\n            document.head.appendChild(script);\n        });\n    }\n\n    async function init() {\n        if (initialized) return;\n\n        try {\n            if (!window.Appwrite) {\n                await loadSdk();\n            }\n\n            // تأكد من تحميل الإصدار الجديد\n            if (!window.Appwrite || !window.Appwrite.Client) {\n                throw new Error('فشل تحميل مكتبة Appwrite');\n            }\n\n            client = new window.Appwrite.Client()\n                .setEndpoint(APPWRITE_ENDPOINT)\n                .setProject(APPWRITE_PROJECT_ID);\n\n            account = new window.Appwrite.Account(client);\n            databases = new window.Appwrite.Databases(client);\n            Query = window.Appwrite.Query;\n            initialized = true;\n            console.log('✅ Appwrite initialized successfully');\n        } catch (error) {\n            console.error('❌ AppwriteHelper init failed:', error);\n            initialized = false;\n            throw error;\n        }\n    }\n\n    async function createAccount({ email, password, name, role, prefs = {} }) {\n        try {\n            await init();\n\n            // تحقق من صحة المدخلات\n            if (!email || !password || !name) {\n                throw new Error('البريد الإلكتروني وكلمة المرور والاسم مطلوبة');\n            }\n\n            // ✅ نتأكد الأول إنه مفيش session قديمة نشطة (من تجربة سابقة مثلاً)\n            // لأن Appwrite بيرفض إنشاء session جديدة لو فيه واحدة شغالة بالفعل\n            try {\n                await account.deleteSession('current');\n                console.log('🗑️ تم حذف session قديمة كانت نشطة');\n            } catch (sessionCleanupError) {\n                // طبيعي جدًا إنها تفشل لو مفيش session أصلاً - نتجاهلها\n            }\n\n            console.log('جاري إنشاء حساب Appwrite...', { email, name });\n            // ✅ استخدام ID.unique() بدلاً من النص الحرفي 'unique()'\n            const user = await account.create(window.Appwrite.ID.unique(), email, password, name);\n\n            console.log('✅ تم إنشاء الحساب بنجاح:', user.$id);\n\n            // ✅ لازم نسجّل دخول (نعمل session) قبل أي عملية تانية زي updatePrefs\n            // لأن account.create() بينشئ الحساب بس من غير ما يسجّل دخول تلقائيًا\n            if (typeof account.createEmailPasswordSession === 'function') {\n                await account.createEmailPasswordSession(email, password);\n            } else {\n                await account.createEmailSession(email, password);\n            }\n            console.log('✅ تم تسجيل الدخول بعد إنشاء الحساب');\n\n            // تحديث التفضيلات\n            await account.updatePrefs({ role, ...prefs });\n            console.log('✅ تم تحديث التفضيلات');\n\n            return user;\n        } catch (error) {\n            console.error('❌ خطأ في إنشاء الحساب:', error);\n            throw new Error(`فشل إنشاء الحساب: ${error.message}`);\n        }\n    }\n\n    async function createSession(email, password) {\n        try {\n            await init();\n            console.log('جاري تسجيل الدخول...', email);\n            // ✅ createEmailSession قديمة/متوقفة في إصدارات SDK الأحدث، استخدم الاسم الجديد\n            if (typeof account.createEmailPasswordSession === 'function') {\n                await account.createEmailPasswordSession(email, password);\n            } else {\n                await account.createEmailSession(email, password);\n            }\n            const user = await account.get();\n            console.log('✅ تم تسجيل الدخول بنجاح');\n            return user;\n        } catch (error) {\n            console.error('❌ خطأ في تسجيل الدخول:', error);\n            throw new Error(`فشل تسجيل الدخول: ${error.message}`);\n        }\n    }\n\n    async function logout() {\n        await init();\n        try {\n            await account.deleteSession('current');\n        } catch (error) {\n            console.warn('Appwrite logout failed:', error);\n        }\n    }\n\n    async function getCurrentAccount() {\n        await init();\n        return account.get();\n    }\n\n    async function updatePrefs(prefs) {\n        await init();\n        return account.updatePrefs(prefs);\n    }\n\n    // Database operations\n    async function createDocument(collectionId, data) {\n        try {\n            await init();\n            console.log(`جاري حفظ document في ${collectionId}...`);\n            const doc = await databases.createDocument(APPWRITE_DATABASE_ID, collectionId, window.Appwrite.ID.unique(), data);\n            console.log(`✅ تم حفظ المستند بنجاح: ${doc.$id}`);\n            return doc;\n        } catch (error) {\n            console.error(`❌ خطأ في حفظ المستند في ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function getDocument(collectionId, documentId) {\n        try {\n            await init();\n            return await databases.getDocument(APPWRITE_DATABASE_ID, collectionId, documentId);\n        } catch (error) {\n            console.error(`❌ خطأ في الحصول على المستند من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function updateDocument(collectionId, documentId, data) {\n        try {\n            await init();\n            console.log(`جاري تحديث المستند في ${collectionId}...`);\n            const doc = await databases.updateDocument(APPWRITE_DATABASE_ID, collectionId, documentId, data);\n            console.log(`✅ تم تحديث المستند بنجاح`);\n            return doc;\n        } catch (error) {\n            console.error(`❌ خطأ في تحديث المستند في ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function deleteDocument(collectionId, documentId) {\n        try {\n            await init();\n            await databases.deleteDocument(APPWRITE_DATABASE_ID, collectionId, documentId);\n            console.log(`✅ تم حذف المستند بنجاح`);\n        } catch (error) {\n            console.error(`❌ خطأ في حذف المستند من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    async function listDocuments(collectionId, queries = []) {\n        try {\n            await init();\n            return await databases.listDocuments(APPWRITE_DATABASE_ID, collectionId, queries);\n        } catch (error) {\n            console.error(`❌ خطأ في جلب المستندات من ${collectionId}:`, error);\n            throw error;\n        }\n    }\n\n    window.AppwriteHelper = {\n        init,\n        createAccount,\n        createSession,\n        logout,\n        getCurrentAccount,\n        updatePrefs,\n        createDocument,\n        getDocument,\n        updateDocument,\n        deleteDocument,\n        listDocuments,\n        get Query() {\n            return Query;\n        },\n        APPWRITE_ENDPOINT,\n        APPWRITE_PROJECT_ID,\n        APPWRITE_DATABASE_ID,\n        isReady: () => initialized\n    };\n})(window);<\/script>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script>// Auth functionality\n// Appwrite هو مصدر الحقيقة الأساسي دلوقتي لتسجيل الدخول والتسجيل.\n// localStorage بقى مجرد fallback لحالة عدم توفر Appwrite (تطوير/اختبار أوفلاين) - مفيهوش كلمات سر حقيقية بعد كده.\ndocument.addEventListener('DOMContentLoaded', () => {\n    initializeAccountTypeSelection();\n    initializeFileUploads();\n    initializeLoginForm();\n    initializeRegisterForm();\n});\n\n// Account Type Selection\nfunction initializeAccountTypeSelection() {\n    const accountTypeCards = document.querySelectorAll('.account-type-card');\n    const talentInfo = document.getElementById('talentInfo');\n    let selectedType = null;\n\n    accountTypeCards.forEach(card => {\n        card.addEventListener('click', function() {\n            accountTypeCards.forEach(c => c.classList.remove('active'));\n            this.classList.add('active');\n            selectedType = this.dataset.type;\n\n            if (talentInfo) {\n                if (selectedType === 'talent') {\n                    talentInfo.classList.remove('hidden');\n                    talentInfo.querySelectorAll('select[name=\"category\"]').forEach(field => {\n                        field.setAttribute('required', 'required');\n                    });\n                } else {\n                    talentInfo.classList.add('hidden');\n                    talentInfo.querySelectorAll('select[name=\"category\"]').forEach(field => {\n                        field.removeAttribute('required');\n                    });\n                }\n            }\n        });\n    });\n}\n\n// File Upload Handlers\nfunction initializeFileUploads() {\n    const cvFile = document.getElementById('cvFile');\n    const photoFile = document.getElementById('photoFile');\n    const cvFileName = document.getElementById('cvFileName');\n    const photoFileName = document.getElementById('photoFileName');\n\n    if (cvFile) {\n        cvFile.addEventListener('change', function() {\n            if (this.files && this.files[0]) {\n                cvFileName.textContent = '✓ ' + this.files[0].name;\n            } else {\n                cvFileName.textContent = '';\n            }\n        });\n    }\n\n    if (photoFile) {\n        photoFile.addEventListener('change', function() {\n            if (this.files && this.files[0]) {\n                photoFileName.textContent = '✓ ' + this.files[0].name;\n            } else {\n                photoFileName.textContent = '';\n            }\n        });\n    }\n}\n\n// localStorage دلوقتي بقى fallback بس (دليل أوفلاين) - مفيهوش كلمات سر حقيقية\nfunction getStoredUsers() {\n    try {\n        return JSON.parse(localStorage.getItem('site_users') || '[]');\n    } catch (error) {\n        return [];\n    }\n}\n\nfunction setStoredUsers(users) {\n    localStorage.setItem('site_users', JSON.stringify(users));\n}\n\nfunction normalizeUserRole(role) {\n    const normalized = (role || 'client').toString().trim().toLowerCase();\n    if (['admin', 'administrator', 'superadmin'].includes(normalized)) return 'admin';\n    if (['talent', 'موهوب', 'freelancer'].includes(normalized)) return 'talent';\n    if (['client', 'beneficiary', 'customer', 'مستفيد'].includes(normalized)) return 'client';\n    return 'client';\n}\n\nfunction buildSessionUserPayload(sourceUser = {}, fallbackUser = null) {\n    if (typeof window.createSessionUser === 'function') {\n        return window.createSessionUser(sourceUser, fallbackUser);\n    }\n\n    const baseUser = fallbackUser || {};\n    const firstName = sourceUser.firstName || sourceUser.name?.split(' ')[0] || baseUser.firstName || '';\n    const lastName = sourceUser.lastName || (sourceUser.name ? sourceUser.name.split(' ').slice(1).join(' ') : '') || baseUser.lastName || '';\n\n    return {\n        id: sourceUser.id || baseUser.id || '',\n        firstName,\n        lastName,\n        email: sourceUser.email || baseUser.email || '',\n        role: normalizeUserRole(sourceUser.role || baseUser.role || ''),\n        phone: sourceUser.phone || baseUser.phone || '',\n        category: sourceUser.category || baseUser.category || '',\n        bio: sourceUser.bio || baseUser.bio || '',\n        experience: sourceUser.experience ?? baseUser.experience ?? '',\n        city: sourceUser.city || baseUser.city || '',\n        portfolio: sourceUser.portfolio || baseUser.portfolio || '',\n        registeredAt: sourceUser.registeredAt || baseUser.registeredAt || '',\n        avatar: sourceUser.avatar || baseUser.avatar || '',\n        profileId: sourceUser.profileId || baseUser.profileId || null,\n        sessionSource: sourceUser.sessionSource || baseUser.sessionSource || '',\n        isDefaultProfile: false\n    };\n}\n\nfunction getCurrentUser() {\n    try {\n        const currentUser = JSON.parse(localStorage.getItem('site_current_user') || 'null');\n        if (currentUser) return currentUser;\n\n        const sessionData = JSON.parse(localStorage.getItem('site_session') || 'null');\n        return sessionData?.user || null;\n    } catch (error) {\n        return null;\n    }\n}\n\nfunction setCurrentUser(user) {\n    const normalizedUser = user ? buildSessionUserPayload(user, getCurrentUser()) : null;\n    localStorage.setItem('site_current_user', JSON.stringify(normalizedUser));\n    localStorage.setItem('site_session', JSON.stringify({\n        isLoggedIn: !!normalizedUser,\n        user: normalizedUser,\n        loggedInAt: new Date().toISOString(),\n        source: normalizedUser?.sessionSource || 'default'\n    }));\n\n    if (typeof window.setSiteCurrentUser === 'function') {\n        window.setSiteCurrentUser(normalizedUser);\n    }\n}\n\nfunction getDefaultRedirect(role) {\n    const normalizedRole = (role || '').toString().trim().toLowerCase();\n    if (normalizedRole === 'admin') return 'admin.html';\n    if (normalizedRole === 'talent') return 'dashboard.html';\n    return 'beneficiary.html';\n}\n\n/**\n * تسجيل الدخول عبر Appwrite.\n * - لو AppwriteHelper مش متاح خالص (السكريبت مش متحمّل مثلاً): بيرجع null بهدوء (يسمح بالـ fallback المحلي).\n * - لو Appwrite متاح لكن البريد/الباسورد غلط أو أي خطأ فعلي: بيرمي (throw) الخطأ عشان الكولر يفرّق\n *   بين \"Appwrite مش شغال\" و\"بيانات الدخول غلط\".\n */\nasync function loginWithAppwrite(email, password) {\n    if (!window.AppwriteHelper) return null;\n\n    const user = await window.AppwriteHelper.createSession(email, password);\n\n    // نجيب بروفايل المستخدم من كولكشن users عبر accountId\n    let profile = null;\n    try {\n        const userProfiles = await window.AppwriteHelper.listDocuments('users', [\n            window.AppwriteHelper.Query.equal('accountId', user.$id)\n        ]);\n        if (userProfiles.documents && userProfiles.documents.length > 0) {\n            profile = userProfiles.documents[0];\n        }\n    } catch (profileError) {\n        console.warn('⚠️ تعذّر جلب بروفايل المستخدم من قاعدة البيانات:', profileError);\n    }\n\n    return buildSessionUserPayload({\n        id: user.$id,\n        name: user.name || '',\n        firstName: user.name ? user.name.split(' ')[0] : email.split('@')[0],\n        lastName: user.name ? user.name.split(' ').slice(1).join(' ') : '',\n        email: user.email,\n        role: profile?.type || user.prefs?.role || '',\n        phone: profile?.phone || user.prefs?.phone || '',\n        category: profile?.category || user.prefs?.category || '',\n        bio: profile?.bio || user.prefs?.bio || '',\n        experience: profile?.experience || user.prefs?.experience || '',\n        city: profile?.city || user.prefs?.city || '',\n        portfolio: profile?.portfolio || user.prefs?.portfolio || '',\n        registeredAt: user.prefs?.registeredAt || '',\n        avatar: profile?.avatar || (user.name ? user.name.charAt(0) : ''),\n        profileId: profile?.$id || null,\n        sessionSource: profile ? 'database' : 'appwrite-auth-only',\n        isDefaultProfile: false\n    }, getCurrentUser());\n}\n\n/**\n * إنشاء حساب عبر Appwrite (Auth + مستند بروفايل في كولكشن users).\n * ملاحظة: مفيش created_at/updated_at في الـ payload لأن كولكشن users معندوش الأعمدة دي -\n * Appwrite بيسجل $createdAt/$updatedAt تلقائيًا لوحده.\n */\nasync function signupWithAppwrite(user) {\n    if (!window.AppwriteHelper) {\n        console.warn('⚠️ AppwriteHelper غير متاح - سيتم الحفظ في localStorage فقط');\n        return null;\n    }\n\n    console.log('📝 جاري محاولة إنشاء حساب في Appwrite...');\n\n    const appwriteUser = await window.AppwriteHelper.createAccount({\n        email: user.email,\n        password: user.password,\n        name: `${user.firstName} ${user.lastName}`,\n        role: user.role,\n        prefs: {\n            phone: user.phone,\n            category: user.category,\n            bio: user.bio,\n            experience: user.experience,\n            city: user.city,\n            portfolio: user.portfolio,\n            registeredAt: user.registeredAt\n        }\n    });\n\n    console.log('✅ تم إنشاء الحساب في Appwrite:', appwriteUser.$id);\n\n    const userProfile = {\n        accountId: appwriteUser.$id,\n        name: `${user.firstName} ${user.lastName}`,\n        email: user.email,\n        phone: user.phone,\n        type: user.role,\n        category: user.category,\n        bio: user.bio,\n        experience: parseInt(user.experience) || 0,\n        city: user.city,\n        rating: 0.0,\n        reviews_count: 0,\n        projects_completed: 0,\n        avatar: (user.firstName || 'م').charAt(0),\n        portfolio: user.portfolio,\n        verified: false,\n        status: 'active',\n        // لا created_at ولا updated_at هنا - العمودين دول مش موجودين في كولكشن users\n    };\n\n    try {\n        const userDoc = await window.AppwriteHelper.createDocument('users', userProfile);\n        console.log('✅ تم إنشاء ملف المستخدم في قاعدة البيانات:', userDoc.$id);\n        return { ...appwriteUser, profile: userDoc };\n    } catch (dbError) {\n        console.error('❌ تم إنشاء الحساب لكن فشل حفظ بروفايله في قاعدة البيانات:', dbError);\n        // نرمي الخطأ بدل ما نبلعه - عشان المستخدم يعرف إن حسابه ناقص بروفايل ومحتاج تدخل يدوي\n        throw new Error(`تم إنشاء الحساب لكن فشل حفظ بيانات البروفايل: ${dbError.message}`);\n    }\n}\n\n// Login Form\nfunction initializeLoginForm() {\n    const loginForm = document.getElementById('loginForm');\n    const existingUser = getCurrentUser();\n    if (existingUser && loginForm) {\n        __setHref(getDefaultRedirect(existingUser.role));\n        return;\n    }\n\n    if (loginForm) {\n        loginForm.addEventListener('submit', async (e) => {\n            e.preventDefault();\n\n            const emailInput = loginForm.querySelector('input[type=\"email\"]');\n            const passwordInput = loginForm.querySelector('input[type=\"password\"]');\n            const email = emailInput ? emailInput.value.trim().toLowerCase() : '';\n            const password = passwordInput ? passwordInput.value.trim() : '';\n\n            if (!email || !password) {\n                window.showToast ? window.showToast('الرجاء إدخال البريد وكلمة المرور', 'error') : alert('الرجاء إدخال البريد وكلمة المرور');\n                return;\n            }\n\n            // 1) نجرب Appwrite الأول دايمًا - هو مصدر الحقيقة\n            let appwriteUser = null;\n            let appwriteReachable = true;\n            try {\n                appwriteUser = await loginWithAppwrite(email, password);\n                if (appwriteUser === null) appwriteReachable = false; // AppwriteHelper مش متاح خالص\n            } catch (err) {\n                console.warn('⚠️ فشل تسجيل الدخول عبر Appwrite:', err);\n                appwriteReachable = true; // Appwrite شغال لكن البيانات غلط أو حصل خطأ فعلي\n                appwriteUser = null;\n            }\n\n            if (appwriteUser) {\n                setCurrentUser(appwriteUser);\n                window.showToast ? window.showToast('تم تسجيل الدخول بنجاح', 'success') : alert('تم تسجيل الدخول بنجاح!');\n                setTimeout(() => {\n                    __setHref(getDefaultRedirect(appwriteUser.role));\n                }, 1000);\n                return;\n            }\n\n            if (appwriteReachable) {\n                // Appwrite شغال لكن البريد/الباسورد غلط - منرجعش لـ localStorage عشان منضللش المستخدم\n                window.showToast ? window.showToast('البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error') : alert('البريد الإلكتروني أو كلمة المرور غير صحيحة');\n                return;\n            }\n\n            // 2) fallback: Appwrite مش متاح خالص (مثلاً السكريبت مش متحمّل) - نستخدم localStorage كخطة بديلة للتطوير فقط\n            const users = getStoredUsers();\n            const localUser = users.find(u => u.email === email);\n            if (!localUser || (localUser.password && localUser.password !== password)) {\n                window.showToast ? window.showToast('المستخدم غير موجود أو كلمة المرور غير صحيحة', 'error') : alert('المستخدم غير موجود أو كلمة المرور غير صحيحة');\n                return;\n            }\n\n            setCurrentUser(localUser);\n            window.showToast ? window.showToast('تم تسجيل الدخول (وضع محلي - Appwrite غير متاح)', 'success') : alert('تم تسجيل الدخول بنجاح!');\n            setTimeout(() => {\n                __setHref(getDefaultRedirect(localUser.role));\n            }, 1000);\n        });\n    }\n}\n\n// Register Form\nfunction initializeRegisterForm() {\n    const registerForm = document.getElementById('registerForm');\n    const existingUser = getCurrentUser();\n    if (existingUser && registerForm) {\n        __setHref(getDefaultRedirect(existingUser.role));\n        return;\n    }\n\n    if (registerForm) {\n        registerForm.addEventListener('submit', async (e) => {\n            e.preventDefault();\n\n            const selectedCard = document.querySelector('.account-type-card.active');\n            if (!selectedCard) {\n                window.showToast ? window.showToast('الرجاء اختيار نوع الحساب', 'error') : alert('الرجاء اختيار نوع الحساب');\n                return;\n            }\n\n            const accountType = selectedCard.dataset.type;\n            const formData = new FormData(registerForm);\n            formData.append('accountType', accountType);\n\n            const password = (formData.get('password') || '').toString();\n            const confirmPassword = (formData.get('confirmPassword') || '').toString();\n\n            if (password.length < 8) {\n                window.showToast ? window.showToast('كلمة المرور يجب أن تكون 8 أحرف على الأقل', 'error') : alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');\n                return;\n            }\n\n            if (password !== confirmPassword) {\n                window.showToast ? window.showToast('كلمة المرور غير متطابقة', 'error') : alert('كلمة المرور غير متطابقة');\n                return;\n            }\n\n            const newUser = {\n                id: `u_${Date.now()}`,\n                firstName: formData.get('firstName') || '',\n                lastName: formData.get('lastName') || '',\n                email: (formData.get('email') || '').trim().toLowerCase(),\n                phone: formData.get('phone') || '',\n                password: password, // بتتشال قبل ما نخزّن في localStorage لو Appwrite نجح - بص تحت\n                role: accountType,\n                category: formData.get('category') || '',\n                bio: formData.get('bio') || '',\n                experience: formData.get('experience') || '',\n                city: formData.get('city') || '',\n                portfolio: formData.get('portfolio') || '',\n                registeredAt: new Date().toISOString(),\n                avatar: (formData.get('firstName') || 'م').charAt(0)\n            };\n\n            let appwriteUser = null;\n            let appwriteError = null;\n            try {\n                appwriteUser = await signupWithAppwrite(newUser);\n            } catch (err) {\n                appwriteError = err;\n                console.error('❌ خطأ في إنشاء حساب Appwrite:', err);\n            }\n\n            if (appwriteUser) {\n                // نجح Appwrite بالكامل - هو مصدر الحقيقة، منخزّنش الباسورد الحقيقي محليًا\n                newUser.id = appwriteUser.$id;\n                const localCacheUser = { ...newUser };\n                delete localCacheUser.password; // ما نخزنش كلمة سر حقيقية في localStorage\n\n                const users = getStoredUsers();\n                const existingIndex = users.findIndex(u => u.email === newUser.email);\n                if (existingIndex >= 0) {\n                    users[existingIndex] = localCacheUser;\n                } else {\n                    users.push(localCacheUser);\n                }\n                setStoredUsers(users);\n\n                const sessionUser = buildSessionUserPayload({\n                    id: appwriteUser.$id,\n                    firstName: newUser.firstName,\n                    lastName: newUser.lastName,\n                    email: newUser.email,\n                    role: newUser.role,\n                    phone: newUser.phone,\n                    category: newUser.category,\n                    bio: newUser.bio,\n                    experience: newUser.experience,\n                    city: newUser.city,\n                    portfolio: newUser.portfolio,\n                    registeredAt: newUser.registeredAt,\n                    avatar: newUser.avatar,\n                    profileId: appwriteUser.profile?.$id || null,\n                    sessionSource: 'database'\n                });\n                setCurrentUser(sessionUser);\n            } else {\n                // فشل Appwrite بالكامل (مش متاح أو حصل خطأ) - fallback كامل لـ localStorage للتطوير فقط\n                window.showToast\n                    ? window.showToast(\n                          appwriteError\n                              ? `⚠️ فشل إنشاء الحساب على Appwrite: ${appwriteError.message}`\n                              : '⚠️ Appwrite غير متاح - تم الحفظ محليًا فقط (وضع تطوير)',\n                          'error'\n                      )\n                    : alert('⚠️ فشل إنشاء الحساب على Appwrite. افتح Console (F12) لترى التفاصيل.');\n\n                const users = getStoredUsers();\n                const existing = users.find(u => u.email === newUser.email);\n                if (existing) {\n                    window.showToast ? window.showToast('هذا البريد مستخدم بالفعل', 'error') : alert('هذا البريد مستخدم بالفعل');\n                    return;\n                }\n                users.push(newUser); // هنا فقط بيتخزن الباسورد محليًا - لأن مفيش Appwrite أصلاً يتحقق منها\n                setStoredUsers(users);\n                setCurrentUser(newUser);\n            }\n\n            const message = accountType === 'talent'\n                ? 'تم إنشاء حساب الموهوب بنجاح! ستتم مراجعة بياناتك قريباً.'\n                : 'تم إنشاء الحساب بنجاح!';\n\n            window.showToast ? window.showToast(message, 'success') : alert(message);\n\n            setTimeout(() => {\n                __setHref(getDefaultRedirect(accountType));\n            }, 2000);\n        });\n    }\n}<\/script>\n<script>\n        // Load footer safely\n        document.addEventListener('DOMContentLoaded', () => {\n            fetch('components/footer.html')\n                .then(response => {\n                    if (!response.ok) throw new Error('Failed to load footer');\n                    return response.text();\n                })\n                .then(data => {\n                    const footer = document.getElementById('footer-container');\n                    if (footer) footer.innerHTML = data;\n                })\n                .catch(error => {\n                    console.warn('Footer loading error:', error);\n                    // Continue without footer\n                });\n        });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "forgot-password": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>نسيت كلمة المرور - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* Auth Pages Styles */\n.auth-page {\n    min-height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    padding: 3rem var(--spacing-xl);\n    position: relative;\n}\n\n.auth-page::before {\n    content: '';\n    position: fixed;\n    top: -50%;\n    right: -50%;\n    width: 100%;\n    height: 100%;\n    background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);\n    z-index: 0;\n}\n\n.auth-container {\n    width: 100%;\n    max-width: 680px;\n    position: relative;\n    z-index: 1;\n}\n\n.auth-card {\n    background: var(--surface-color);\n    border-radius: var(--radius-2xl);\n    padding: 2.5rem 3rem;\n    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);\n    backdrop-filter: blur(10px);\n    position: relative;\n}\n\n.auth-back-link {\n    display: inline-flex;\n    align-items: center;\n    gap: 0.5rem;\n    color: var(--text-secondary);\n    font-size: 0.9rem;\n    font-weight: 500;\n    margin-bottom: 1.5rem;\n    transition: var(--transition-base);\n    text-decoration: none;\n}\n\n.auth-back-link:hover {\n    color: var(--primary-color);\n    transform: translateX(4px);\n}\n\n.auth-back-link svg {\n    transition: var(--transition-base);\n}\n\n.auth-back-link:hover svg {\n    transform: translateX(3px);\n}\n\n.auth-header {\n    text-align: center;\n    margin-bottom: 2rem;\n}\n\n.auth-logo h1 {\n    font-size: 2.5rem;\n    font-weight: 900;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    background-clip: text;\n    margin-bottom: 0.75rem;\n    letter-spacing: -1px;\n}\n\n.auth-header h2 {\n    font-size: 1.5rem;\n    font-weight: 800;\n    margin-bottom: 0.4rem;\n    color: var(--text-primary);\n}\n\n.auth-header p {\n    color: var(--text-secondary);\n    font-size: 0.9rem;\n}\n\n.auth-form {\n    margin-bottom: 1.75rem;\n}\n\n.form-row {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 1rem;\n}\n\n.form-group {\n    margin-bottom: 1.25rem;\n}\n\n.form-group label {\n    display: block;\n    margin-bottom: 0.5rem;\n    font-weight: 600;\n    color: var(--text-primary);\n    font-size: 0.85rem;\n}\n\n.form-group input,\n.form-group select {\n    width: 100%;\n    padding: 0.85rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    font-size: 0.9rem;\n    transition: var(--transition-base);\n    background: var(--bg-color);\n    font-family: 'Tajawal', sans-serif;\n}\n\n.form-group input:focus,\n.form-group select:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 4px rgba(33, 56, 81, 0.1);\n    background: white;\n}\n\n.form-group input::placeholder {\n    color: #9ca3af;\n    font-size: 0.85rem;\n}\n\n/* Account Type Selection */\n.account-type-section {\n    margin-bottom: 2rem;\n}\n\n.section-label {\n    display: block;\n    font-weight: 700;\n    color: var(--text-primary);\n    font-size: 0.9rem;\n    margin-bottom: 1rem;\n    text-align: center;\n}\n\n.account-type-cards {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 1rem;\n    margin-bottom: 1.5rem;\n}\n\n.account-type-card {\n    padding: 1.5rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    text-align: center;\n    cursor: pointer;\n    transition: all 0.3s ease;\n    background: var(--bg-color);\n}\n\n.account-type-card:hover {\n    border-color: var(--primary-color);\n    transform: translateY(-2px);\n    box-shadow: 0 4px 12px rgba(33, 56, 81, 0.15);\n}\n\n.account-type-card.active {\n    border-color: var(--primary-color);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    box-shadow: 0 4px 12px rgba(33, 56, 81, 0.2);\n}\n\n.account-type-icon {\n    width: 50px;\n    height: 50px;\n    margin: 0 auto 0.75rem;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-full);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    color: var(--primary-color);\n    transition: all 0.3s ease;\n}\n\n.account-type-card.active .account-type-icon {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    color: white;\n}\n\n.account-type-card h3 {\n    font-size: 1rem;\n    font-weight: 700;\n    color: var(--text-primary);\n    margin-bottom: 0.25rem;\n}\n\n.account-type-card p {\n    font-size: 0.8rem;\n    color: var(--text-secondary);\n    margin: 0;\n}\n\n/* Form Sections */\n.form-section {\n    transition: all 0.3s ease;\n}\n\n.form-section.hidden {\n    display: none;\n}\n\n.section-divider {\n    text-align: center;\n    margin: 2rem 0 1.5rem;\n    position: relative;\n}\n\n.section-divider::before {\n    content: '';\n    position: absolute;\n    top: 50%;\n    left: 0;\n    right: 0;\n    height: 1px;\n    background: var(--border-color);\n}\n\n.section-divider span {\n    position: relative;\n    background: var(--surface-color);\n    padding: 0 1rem;\n    font-weight: 700;\n    color: var(--primary-color);\n    font-size: 0.85rem;\n}\n\n/* File Upload */\n.file-upload-area {\n    margin-top: 0.5rem;\n}\n\n.file-upload-label {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 0.5rem;\n    padding: 1.5rem;\n    border: 2px dashed var(--border-color);\n    border-radius: var(--radius-lg);\n    cursor: pointer;\n    transition: var(--transition-base);\n    background: var(--bg-color);\n    color: var(--text-secondary);\n}\n\n.file-upload-label:hover {\n    border-color: var(--primary-color);\n    background: rgba(33, 56, 81, 0.05);\n    color: var(--primary-color);\n}\n\n.file-upload-label svg {\n    color: var(--primary-color);\n}\n\n.file-upload-label span {\n    font-size: 0.85rem;\n    font-weight: 500;\n}\n\n.file-name {\n    margin-top: 0.5rem;\n    font-size: 0.8rem;\n    color: var(--text-secondary);\n    text-align: center;\n}\n\n.file-name:not(:empty) {\n    padding: 0.5rem;\n    background: rgba(33, 56, 81, 0.1);\n    border-radius: var(--radius-md);\n    color: var(--primary-color);\n}\n\n/* Textarea */\ntextarea {\n    width: 100%;\n    padding: 0.85rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    font-size: 0.9rem;\n    font-family: 'Tajawal', sans-serif;\n    resize: vertical;\n    min-height: 80px;\n    transition: var(--transition-base);\n    background: var(--bg-color);\n}\n\ntextarea:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 4px rgba(33, 56, 81, 0.1);\n    background: white;\n}\n\ntextarea::placeholder {\n    color: #9ca3af;\n    font-size: 0.85rem;\n}\n\n.form-options {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 1.75rem;\n    flex-wrap: wrap;\n    gap: 0.75rem;\n}\n\n.checkbox-label {\n    display: flex;\n    align-items: center;\n    gap: 0.5rem;\n    cursor: pointer;\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n}\n\n.checkbox-label input {\n    cursor: pointer;\n    width: 16px;\n    height: 16px;\n    accent-color: var(--primary-color);\n}\n\n.checkbox-label span {\n    user-select: none;\n}\n\n.link {\n    color: var(--primary-color);\n    font-weight: 600;\n    transition: var(--transition-fast);\n    text-decoration: none;\n    font-size: 0.85rem;\n}\n\n.link:hover {\n    color: var(--secondary-color);\n    text-decoration: underline;\n}\n\n.btn-block {\n    width: 100%;\n    padding: 0.95rem;\n    font-size: 0.95rem;\n    font-weight: 700;\n    border-radius: var(--radius-lg);\n    box-shadow: 0 4px 12px rgba(33, 56, 81, 0.3);\n    transition: all 0.3s ease;\n}\n\n.btn-block:hover {\n    transform: translateY(-2px);\n    box-shadow: 0 6px 20px rgba(33, 56, 81, 0.4);\n}\n\n.btn-block:active {\n    transform: translateY(0);\n}\n\n.auth-footer {\n    text-align
