ck: 'start'\n                });\n            }\n        }\n    });\n});\n\n// ==================== Search Functionality ====================\nconst searchInput = document.querySelector('.search-bar input');\nconst searchBtn = document.querySelector('.search-btn');\n\nif (searchBtn && searchInput) {\n    searchBtn.addEventListener('click', () => {\n        performSearch(searchInput.value);\n    });\n\n    searchInput.addEventListener('keypress', (e) => {\n        if (e.key === 'Enter') {\n            performSearch(searchInput.value);\n        }\n    });\n}\n\nfunction performSearch(query) {\n    if (query.trim()) {\n        console.log('Searching for:', query);\n        // Here you would implement actual search functionality\n        // For now, we'll just redirect to discover page\n        __setHref(`discover.html?search=${encodeURIComponent(query)}`);\n    }\n}\n\n// ==================== Toast Notifications ====================\nfunction showToast(message, type = 'info') {\n    // Remove existing toast if any\n    const existingToast = document.querySelector('.toast');\n    if (existingToast) {\n        existingToast.remove();\n    }\n\n    // Create toast element\n    const toast = document.createElement('div');\n    toast.className = `toast toast-${type}`;\n    toast.textContent = message;\n    \n    // Add styles\n    Object.assign(toast.style, {\n        position: 'fixed',\n        bottom: '20px',\n        right: '20px',\n        padding: '1rem 1.5rem',\n        background: type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#213851',\n        color: 'white',\n        borderRadius: '0.5rem',\n        boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)',\n        zIndex: '1000',\n        animation: 'slideIn 0.3s ease',\n        fontWeight: '500'\n    });\n\n    document.body.appendChild(toast);\n\n    // Remove after 3 seconds\n    setTimeout(() => {\n        toast.style.animation = 'slideOut 0.3s ease';\n        setTimeout(() => toast.remove(), 300);\n    }, 3000);\n}\n\n// Add animation styles\nconst style = document.createElement('style');\nstyle.textContent = `\n    @keyframes slideIn {\n        from {\n            transform: translateX(100%);\n            opacity: 0;\n        }\n        to {\n            transform: translateX(0);\n            opacity: 1;\n        }\n    }\n    \n    @keyframes slideOut {\n        from {\n            transform: translateX(0);\n            opacity: 1;\n        }\n        to {\n            transform: translateX(100%);\n            opacity: 0;\n        }\n    }\n`;\ndocument.head.appendChild(style);\n\n// ==================== Scroll to Top ====================\nlet scrollTopBtn = null;\n\nwindow.addEventListener('scroll', () => {\n    if (window.scrollY > 300) {\n        if (!scrollTopBtn) {\n            scrollTopBtn = document.createElement('button');\n            scrollTopBtn.innerHTML = '↑';\n            scrollTopBtn.className = 'scroll-top-btn';\n            Object.assign(scrollTopBtn.style, {\n                position: 'fixed',\n                bottom: '20px',\n                left: '20px',\n                width: '50px',\n                height: '50px',\n                borderRadius: '50%',\n                background: 'var(--primary-color)',\n                color: 'white',\n                border: 'none',\n                fontSize: '1.5rem',\n                cursor: 'pointer',\n                boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)',\n                zIndex: '100',\n                transition: 'all 0.3s ease'\n            });\n            \n            scrollTopBtn.addEventListener('click', () => {\n                window.scrollTo({\n                    top: 0,\n                    behavior: 'smooth'\n                });\n            });\n            \n            scrollTopBtn.addEventListener('mouseenter', () => {\n                scrollTopBtn.style.transform = 'translateY(-4px)';\n                scrollTopBtn.style.boxShadow = '0 10px 15px -3px rgba(0, 0, 0, 0.1)';\n            });\n            \n            scrollTopBtn.addEventListener('mouseleave', () => {\n                scrollTopBtn.style.transform = 'translateY(0)';\n                scrollTopBtn.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';\n            });\n            \n            document.body.appendChild(scrollTopBtn);\n        }\n    } else if (scrollTopBtn) {\n        scrollTopBtn.remove();\n        scrollTopBtn = null;\n    }\n});\n\n// ==================== Animation on Scroll ====================\nconst observerOptions = {\n    threshold: 0.1,\n    rootMargin: '0px 0px -50px 0px'\n};\n\nconst observer = new IntersectionObserver((entries) => {\n    entries.forEach(entry => {\n        if (entry.isIntersecting) {\n            entry.target.style.opacity = '1';\n            entry.target.style.transform = 'translateY(0)';\n        }\n    });\n}, observerOptions);\n\n// Observe elements with animation\ndocument.addEventListener('DOMContentLoaded', () => {\n    const animatedElements = document.querySelectorAll('.stat-card, .value-card, .category-card, .story-card');\n    \n    animatedElements.forEach(el => {\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(20px)';\n        el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';\n        observer.observe(el);\n    });\n});\n\n// ==================== Chat Icon Click ====================\nconst chatIcon = document.querySelector('.chat-icon');\nif (chatIcon) {\n    chatIcon.addEventListener('click', () => {\n        showToast('ميزة المحادثة قريباً', 'info');\n    });\n}\n\n// ==================== Utility Functions ====================\nfunction formatNumber(num) {\n    if (num >= 1000) {\n        return (num / 1000).toFixed(1) + 'k';\n    }\n    return num.toString();\n}\n\nfunction debounce(func, wait) {\n    let timeout;\n    return function executedFunction(...args) {\n        const later = () => {\n            clearTimeout(timeout);\n            func(...args);\n        };\n        clearTimeout(timeout);\n        timeout = setTimeout(later, wait);\n    };\n}\n\n// Export functions for use in other scripts\nwindow.showToast = showToast;\nwindow.formatNumber = formatNumber;\nwindow.debounce = debounce;\n\n// ==================== Language Toggle System ====================\ndocument.addEventListener('DOMContentLoaded', function() {\n    const langToggle = document.getElementById('langToggle');\n    const html = document.documentElement;\n    \n    // Get saved language or default to Arabic\n    let currentLang = localStorage.getItem('sayt_lang') || 'ar';\n    \n    // Apply saved language on page load\n    applyLanguage(currentLang);\n    \n    // Language toggle button click\n    if (langToggle) {\n        langToggle.addEventListener('click', function() {\n            currentLang = currentLang === 'ar' ? 'en' : 'ar';\n            localStorage.setItem('sayt_lang', currentLang);\n            applyLanguage(currentLang);\n        });\n    }\n    \n    function applyLanguage(lang) {\n        // Update HTML attributes\n        html.setAttribute('lang', lang);\n        html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');\n        \n        // Update button text\n        const langText = document.querySelector('.lang-text');\n        if (langText) {\n            langText.textContent = lang === 'ar' ? 'EN' : 'ع';\n        }\n        \n        // Update all elements with data-ar and data-en attributes\n        document.querySelectorAll('[data-ar][data-en]').forEach(element => {\n            const text = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');\n            if (text) {\n                // Check if it's an input placeholder\n                if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {\n                    element.placeholder = text;\n                } else if (element.tagName === 'OPTION') {\n                    element.textContent = text;\n                } else {\n                    element.textContent = text;\n                }\n            }\n        });\n        \n        // Trigger custom event for other scripts to listen to\n        window.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang } }));\n    }\n});\n\n// ==================== Update Notification & Cart Badges ====================\nfunction updateHeaderBadges() {\n    // Update notification badge\n    const notificationBadge = document.getElementById('headerNotificationBadge');\n    const unreadNotifications = parseInt(localStorage.getItem('unread_notifications') || '5');\n    \n    if (notificationBadge) {\n        if (unreadNotifications > 0) {\n            notificationBadge.textContent = unreadNotifications;\n            notificationBadge.style.display = 'block';\n        } else {\n            notificationBadge.style.display = 'none';\n        }\n    }\n    \n    // Update cart badge\n    const cartBadge = document.getElementById('headerCartBadge');\n    const cartItems = parseInt(localStorage.getItem('cart_items_count') || '3');\n    \n    if (cartBadge) {\n        if (cartItems > 0) {\n            cartBadge.textContent = cartItems;\n            cartBadge.style.display = 'block';\n        } else {\n            cartBadge.style.display = 'none';\n        }\n    }\n}\n\n// Update badges on page load\nwindow.addEventListener('load', updateHeaderBadges);\n\n// Update badges when storage changes (for multi-tab sync)\nwindow.addEventListener('storage', updateHeaderBadges);\n\nfunction initializeLogoutLinks() {\n    document.querySelectorAll('a').forEach(link => {\n        const label = link.textContent.trim().toLowerCase();\n        if (label.includes('تسجيل الخروج') || label.includes('logout')) {\n            link.addEventListener('click', () => {\n                clearSiteCurrentUser();\n            });\n        }\n    });\n}\n\nasync function getCurrentUserRole() {\n    const currentUser = await getSiteCurrentUserFromAppwrite();\n    return normalizeRole(currentUser?.role || 'guest');\n}\n\nasync function applyRoleBasedNavigation() {\n    const role = await getCurrentUserRole();\n    const allowedHrefs = new Set(getAllowedNavLinksByRole(role));\n    document.querySelectorAll('.nav-links a, .mobile-nav .nav-link').forEach(link => {\n        const href = link.getAttribute('href');\n        if (!href || href.startsWith('#')) return;\n        if (!allowedHrefs.has(href)) {\n            link.style.display = 'none';\n        } else {\n            link.style.display = '';\n        }\n    });\n}\n\n// ==================== Dark Mode Toggle ====================\nfunction initThemeToggle() {\n    const themeToggle = document.getElementById('themeToggle');\n    const sunIcon = themeToggle?.querySelector('.sun-icon');\n    const moonIcon = themeToggle?.querySelector('.moon-icon');\n    const logo = document.querySelector('.logo img');\n    \n    // Check for saved theme preference or default to 'light'\n    const currentTheme = localStorage.getItem('theme') || 'light';\n    document.documentElement.setAttribute('data-theme', currentTheme);\n    \n    // Update icon and logo based on current theme\n    if (currentTheme === 'dark') {\n        sunIcon.style.display = 'none';\n        moonIcon.style.display = 'block';\n        if (logo) logo.src = 'images/logo.png';\n    }\n    \n    themeToggle?.addEventListener('click', function() {\n        let theme = document.documentElement.getAttribute('data-theme');\n        \n        if (theme === 'light') {\n            document.documentElement.setAttribute('data-theme', 'dark');\n            localStorage.setItem('theme', 'dark');\n            sunIcon.style.display = 'none';\n            moonIcon.style.display = 'block';\n            if (logo) logo.src = 'images/logo.png';\n        } else {\n            document.documentElement.setAttribute('data-theme', 'light');\n            localStorage.setItem('theme', 'light');\n            sunIcon.style.display = 'block';\n            moonIcon.style.display = 'none';\n            if (logo) logo.src = 'images/logo.png';\n        }\n    });\n}\n\n// ==================== Scroll Animations ====================\nfunction initScrollAnimations() {\n    const observerOptions = {\n        threshold: 0.1,\n        rootMargin: '0px 0px -50px 0px'\n    };\n    \n    const observer = new IntersectionObserver((entries) => {\n        entries.forEach(entry => {\n            if (entry.isIntersecting) {\n                entry.target.classList.add('fade-in');\n                observer.unobserve(entry.target);\n            }\n        });\n    }, observerOptions);\n    \n    // Observe elements\n    document.querySelectorAll('.stat-card, .value-card, .category-card, .story-card').forEach(el => {\n        observer.observe(el);\n    });\n}\n\n// ==================== Smooth Scroll for Anchor Links ====================\nfunction initSmoothScroll() {\n    document.querySelectorAll('a[href^=\"#\"]').forEach(anchor => {\n        anchor.addEventListener('click', function (e) {\n            const href = this.getAttribute('href');\n            if (href !== '#' && href !== '') {\n                e.preventDefault();\n                const target = document.querySelector(href);\n                if (target) {\n                    target.scrollIntoView({\n                        behavior: 'smooth',\n                        block: 'start'\n                    });\n                }\n            }\n        });\n    });\n}\n\n// ==================== Initialize Logout Links ====================\nfunction initializeLogoutLinks() {\n    const logoutBtn = document.getElementById('logoutBtn');\n    const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');\n    \n    function handleLogout() {\n        clearSiteCurrentUser();\n        if (window.AppwriteHelper) {\n            window.AppwriteHelper.logout().catch(error => console.warn('Appwrite logout failed:', error));\n        }\n        showToast('تم تسجيل الخروج بنجاح', 'success');\n        setTimeout(() => {\n            __setHref('index.html');\n        }, 1500);\n    }\n    \n    if (logoutBtn) {\n        logoutBtn.addEventListener('click', handleLogout);\n    }\n    if (mobileLogoutBtn) {\n        mobileLogoutBtn.addEventListener('click', handleLogout);\n    }\n}\n\n// ==================== Initialize All ====================\ndocument.addEventListener('DOMContentLoaded', async function() {\n    seedDefaultData();\n    ensureHeaderUserMenu();\n    await redirectBasedOnPage();\n    await updateUserUI();\n    initializeLogoutLinks();\n    initThemeToggle();\n    initScrollAnimations();\n    initSmoothScroll();\n    await applyRoleBasedNavigation();\n});\n", "footer-loader.js": "// Footer Loader - Loads footer content directly\n(function() {\n    const footerHTML = `\n<!-- Footer -->\n<footer class=\"footer\">\n    <div class=\"container\">\n        <!-- Footer Top Row -->\n        <div class=\"footer-top\">\n            <div class=\"footer-logo-section\">\n                <div class=\"footer-logo\">\n                    <img src=\"images/logo.png\" alt=\"حاذق\" style=\"height: 35px; width: auto;\">\n                </div>\n                <p data-ar=\"منصة رقمية عمانية لتمكين المواهب وصناع المحتوى\" data-en=\"Omani digital platform to empower talents\">منصة رقمية عمانية لتمكين المواهب وصناع المحتوى</p>\n            </div>\n            \n            <div class=\"footer-contact-section\">\n                <div class=\"footer-contact-item\">\n                    <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                        <path d=\"M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z\"></path>\n                        <polyline points=\"22,6 12,13 2,6\"></polyline>\n                    </svg>\n                    <a href=\"mailto:info@sayt.om\">info@sayt.om</a>\n                </div>\n                <div class=\"footer-contact-item\">\n                    <svg >المجتمع</a>\n            </div>\n            <div class=\"footer-links-divider\">|</div>\n            <div class=\"footer-links-group\">\n                <a href=\"about.html\" data-ar=\"من نحن\" data-en=\"About\">من نحن</a>\n                <a href=\"contact.html\" data-ar=\"اتصل بنا\" data-en=\"Contact\">اتصل بنا</a>\n                <a href=\"faq.html\" data-ar=\"الأسئلة الشائعة\" data-en=\"FAQ\">الأسئلة الشائعة</a>\n                <a href=\"#\" data-ar=\"سياسة الخصوصية\" data-en=\"Privacy\">سياسة الخصوصية</a>\n                <a href=\"#\" data-ar=\"الشروط والأحكام\" data-en=\"Terms\">الشروط والأحكام</a>\n            </div>\n        </div>        \n        <!-- Footer Bottom -->\n        <div class=\"footer-bottom\">\n            <p data-ar=\"© 2026 منصة حاذق. جميع الحقوق محفوظة.\" data-en=\"© 2026 Sayt Platform. All rights reserved.\">© 2026 منصة حاذق. جميع الحقوق محفوظة.</p>\n        </div>\n    </div>\n</footer>\n`;\n\n    // Load footer on page load\n    document.addEventListener('DOMContentLoaded', function() {\n        const footerContainer = document.getElementById('footer-container');\n        if (footerContainer) {\n            footerContainer.innerHTML = footerHTML;\n        }\n    });\n})();\n"}}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('__data').textContent);
    const sharedCssUrls = {};
    for (const [name, content] of Object.entries(DATA.sharedCss)) {
      sharedCssUrls[name] = URL.createObjectURL(new Blob([content], {type:'text/css'}));
    }
    const sharedJsUrls = {};
    for (const [name, content] of Object.entries(DATA.sharedJs)) {
      sharedJsUrls[name] = URL.createObjectURL(new Blob([content], {type:'application/javascript'}));
    }
    let lastBlobUrl = null;
    const iframe = document.getElementById('viewport');
    const select = document.getElementById('pageSelect');
    const addr = document.getElementById('addr');

    function navigate(key, query) {
      let html = DATA.pages[key];
      if (!html) { key = '404'; html = DATA.pages['404']; }
      for (const [name, url] of Object.entries(sharedCssUrls)) {
        html = html.split('__SHARED_CSS_' + name + '__').join(url);
      }
      for (const [name, url] of Object.entries(sharedJsUrls)) {
        html = html.split('__SHARED_JS_' + name + '__').join(url);
      }
      const blob = new Blob([html], {type:'text/html'});
      const baseUrl = URL.createObjectURL(blob);
      const finalUrl = baseUrl + (query ? ('?' + query) : '');
      const prev = lastBlobUrl;
      lastBlobUrl = baseUrl;
      iframe.src = finalUrl;
      select.value = key;
      addr.textContent = key + '.html' + (query ? ('?' + query) : '');
      if (prev) setTimeout(() => URL.revokeObjectURL(prev), 1000);
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'navigate') {
        navigate(e.data.page, e.data.query || '');
      }
    });

    select.addEventListener('change', (e) => navigate(e.target.value, ''));
    document.getElementById('homeBtn').addEventListener('click', () => navigate('index', ''));

    navigate('index', '');
  </script>
