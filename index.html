">أسئلة وأجوبة</option>\n<option value=\"jobs\">فرص عمل</option>\n</select>\n<button class=\"btn btn-primary btn-sm\" data-ar=\"نشر\" data-en=\"Post\" id=\"postBtn\">نشر</button>\n</div>\n</div>\n<!-- Posts Feed -->\n<div class=\"posts-feed\" id=\"postsFeed\">\n<!-- Posts will be loaded here by JavaScript -->\n</div>\n</main>\n</div>\n</div>\n</section>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>\nconst COMMUNITY_DB_ID = \"YOUR_DATABASE_ID\";\nconst POSTS_COLLECTION_ID = \"community_posts\";\nconst USERS_COLLECTION_ID = \"users\";\n\nlet currentUserRole = null;\nlet currentUserId = null;\n\nasync function getCurrentUserRole() {\n    try {\n        const account = window.appwriteAccount;\n        const databases = window.appwriteDatabases;\n\n        const user = await account.get();\n        currentUserId = user.$id;\n\n        const userDoc = await databases.getDocument(\n            COMMUNITY_DB_ID,\n            USERS_COLLECTION_ID,\n            user.$id\n        );\n        currentUserRole = userDoc.role || \"beneficiary\";\n        return currentUserRole;\n    } catch (err) {\n        currentUserRole = null;\n        currentUserId = null;\n        return null;\n    }\n}\n\nfunction canManagePost(post) {\n    if (currentUserRole === \"admin\") return true;\n    if (currentUserId && post.userId && post.userId === currentUserId) return true;\n    return false;\n}\n\n\nfunction applyRoleVisibility(role) {\n    const elements = document.querySelectorAll(\"[data-role-visible]\");\n    elements.forEach((el) => {\n        const allowedRoles = el.getAttribute(\"data-role-visible\")\n            .split(\",\")\n            .map((r) => r.trim());\n        const isAllowed = role && allowedRoles.includes(role);\n        el.style.display = isAllowed ? \"\" : \"none\";\n    });\n}\n\nfunction togglePostMenu(postId) {\n    const post = postsData.find((p) => p.id === postId);\n    if (!post) return;\n\n    if (!canManagePost(post)) {\n        window.showToast(\"ليس لديك صلاحية لإدارة هذا المنشور\", \"info\");\n        return;\n    }\n\n    const confirmed = confirm(\"هل تريد حذف هذا المنشور؟\");\n    if (confirmed) {\n        deletePost(postId);\n    }\n}\n\n\nasync function deletePost(postId) {\n    const index = postsData.findIndex((p) => p.id === postId);\n    if (index === -1) return;\n\n    const post = postsData[index];\n    postsData.splice(index, 1);\n    loadPosts();\n    window.showToast(\"تم حذف المنشور\", \"success\");\n\n    try {\n        if (post.appwriteDocId && window.appwriteDatabases) {\n            await window.appwriteDatabases.deleteDocument(\n                COMMUNITY_DB_ID,\n                POSTS_COLLECTION_ID,\n                post.appwriteDocId\n            );\n        }\n    } catch (err) {\n        console.error(\"فشل حذف المنشور من Appwrite:\", err);\n        window.showToast(\"تم الحذف محليًا لكن حصل خطأ في المزامنة مع الخادم\", \"error\");\n    }\n}\n\n\nfunction refreshPostMenusVisibility() {\n    document.querySelectorAll(\".post-card\").forEach((card) => {\n        const postId = Number(card.dataset.postId);\n        const post = postsData.find((p) => p.id === postId);\n        const menuBtn = card.querySelector(\".post-menu-btn\");\n        if (!menuBtn || !post) return;\n        menuBtn.style.display = canManagePost(post) ? \"\" : \"none\";\n    });\n}\n\nasync function initCommunityRoles() {\n    await getCurrentUserRole();\n    applyRoleVisibility(currentUserRole);\n\n    \n    refreshPostMenusVisibility();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", initCommunityRoles);<\/script>\n<script>\n        // Load footer component\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(fun tent\">الانتقال إلى المحتوى الرئيسي</a>\n<!-- Header -->\n<div id=\"header-container\"></div>\n<!-- Page Header -->\n<section class=\"page-header\" id=\"main-content\">\n<div class=\"container\">\n<h1 class=\"page-title\" data-ar=\"من نحن\" data-en=\"About Us\">من نحن</h1>\n<p class=\"page-subtitle\" data-ar=\"تعرف على منصة حاذق ورؤيتنا لتمكين المواهب العمانية\" data-en=\"Learn about Sayt platform and our vision to empower Omani talents\">تعرف على منصة حاذق ورؤيتنا لتمكين المواهب العمانية</p>\n</div>\n</section>\n<!-- About Content -->\n<section class=\"about-section\">\n<div class=\"container\">\n<!-- Our Story -->\n<div class=\"content-block\">\n<div class=\"content-grid\">\n<div class=\"content-text\">\n<h2 data-ar=\"قصتنا\" data-en=\"Our Story\">قصتنا</h2>\n<p>منصة حاذق هي منصة رقمية عمانية تهدف إلى تنظيم وتمكين المواهب وصناع المحتوى في سلطنة عمان. انطلقت الفكرة من إيماننا العميق بأن عمان تزخر بالمواهب الإبداعية التي تحتاج إلى منصة احترافية تجمعها مع الفرص المناسبة.</p>\n<p>نسعى لبناء جسر رقمي يربط بين المواهب العمانية والعملاء المحتملين، مع توفير بيئة آمنة وموثوقة تضمن حقوق الجميع وتسهل عملية التواصل والتعاون.</p>\n</div>\n<div class=\"content-image\">\n<div class=\"image-placeholder\">\n<svg fill=\"none\" height=\"200\" stroke=\"currentColor\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"200\">\n<path d=\"M12 2L2 7l10 5 10-5-10-5z\"></path>\n<path d=\"M2 17l10 5 10-5\"></path>\n<path d=\"M2 12l10 5 10-5\"></path>\n</svg>\n</div>\n</div>\n</div>\n</div>\n<!-- Vision & Mission -->\n<div class=\"vision-mission\">\n<div class=\"vm-grid\">\n<div class=\"vm-card\">\n<div class=\"vm-icon\">\n<svg fill=\"none\" height=\"48\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"48\">\n<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"></path>\n<circle cx=\"12\" cy=\"12\" r=\"3\"></circle>\n</svg>\n</div>\n<h3 data-ar=\"رؤيتنا\" data-en=\"Our Vision\">رؤيتنا</h3>\n<p>أن نكون المنصة الرائدة في عمان لربط المواهب بالفرص، ونموذجاً يحتذى به في تمكين الإبداع المحلي وتحويله إلى قيمة اقتصادية مستدامة.</p>\n</div>\n<div class=\"vm-card\">\n<div class=\"vm-icon\">\n<svg fill=\"none\" height=\"48\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"48\">\n<path d=\"M12 2L2 7l10 5 10-5-10-5z\"></path>\n<path d=\"M2 17l10 5 10-5\"></path>\n<path d=\"M2 12l10 5 10-5\"></path>\n</svg>\n</div>\n<h3 data-ar=\"رسالتنا\" data-en=\"Our Mission\">رسالتنا</h3>\n<p>توفير منصة رقمية احترافية تجمع المواهب العمانية في مختلف المجالات الإبداعية، وتسهل وصولهم إلى الفرص والمشاريع، مع ضمان بيئة عمل آمنة وموثوقة.</p>\n</div>\n</div>\n</div>\n<!-- Our Values -->\n<div class=\"values-section\">\n<h2 class=\"section-title\" data-ar=\"قيمنا\" data-en=\"Our Values\">قيمنا</h2>\n<div class=\"values-grid\">\n<div class=\"value-item\">\n<div class=\"value-icon\">\n<svg fill=\"none\" height=\"40\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"40\">\n<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path>\n</svg>\n</div>\n<h4>الموثوقية</h4>\n<p>نبني الثقة من خلال الشفافية والمصداقية في جميع تعاملاتنا</p>\n</div>\n<div class=\"value-item\">\n<div class=\"value-icon\">\n<svg fill=\"none\" height=\"40\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"40\">\n<polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"></polygon>\n</svg>\n</div>\n<h4>الجودة</h4>\n<p>نسعى دائماً لتقديم أفضل تجربة للمواهب والعملاء</p>\n</div>\n<div class=\"value-item\">\n<div class=\"value-icon\">\n<svg fill=\"none\" height=\"40\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"40\">\n<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"9\" cy=\"7\" r=\"4\"></circle>\n<path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"></path>\n<path d=\"M16 3.13a4 4 0 0 1 0 7.75\"></path>\n</svg>\n</div>\n<h4>المجتمع</h4>\n<p>نؤمن بقوة المجتمع ونعمل على بناء شبكة داعمة للمواهب</p>\n</div>\n<div class=\"value-ite box=\"0 0 24 24\" width=\"20\">\n<circle cx=\"11\" cy=\"11\" r=\"8\"></circle>\n<path d=\"m21 21-4.35-4.35\"></path>\n</svg>\n</div>\n<!-- FAQ Categories -->\n<div class=\"faq-categories\">\n<button class=\"faq-category-btn active\" data-category=\"all\">الكل</button>\n<button class=\"faq-category-btn\" data-category=\"general\">عام</button>\n<button class=\"faq-category-btn\" data-category=\"account\">الحساب</button>\n<button class=\"faq-category-btn\" data-category=\"payment\">الدفع</button>\n<button class=\"faq-category-btn\" data-category=\"services\">الخدمات</button>\n</div>\n<!-- FAQ Items -->\n<div class=\"faq-container\">\n<!-- General Questions -->\n<div class=\"faq-category-section\" data-category=\"general\">\n<h2 class=\"faq-category-title\">أسئلة عامة</h2>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>ما هي منصة حاذق؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>منصة حاذق هي منصة رقمية عمانية تهدف إلى تنظيم وتمكين المواهب وصناع المحتوى في سلطنة عمان. نوفر بيئة احترافية تجمع المواهب مع الفرص والمشاريع المناسبة.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>من يمكنه الانضمام إلى المنصة؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>يمكن لأي موهوب عماني في مختلف المجالات الإبداعية الانضمام إلى المنصة، سواء كنت مصور، مصمم، كاتب، مونتير، أو أي مجال إبداعي آخر. كما يمكن للعملاء والشركات التسجيل للبحث عن المواهب.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>هل المنصة مجانية؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>التسجيل وإنشاء الملف الشخصي مجاني تماماً. نحصل على عمولة بسيطة من المشاريع المنجزة عبر المنصة لضمان استمرارية الخدمة وتطويرها.</p>\n</div>\n</div>\n</div>\n<!-- Account Questions -->\n<div class=\"faq-category-section\" data-category=\"account\">\n<h2 class=\"faq-category-title\">الحساب والتسجيل</h2>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>كيف أنشئ حساب جديد؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>اضغط على زر \"انضم كموهوب\" في الصفحة الرئيسية، ثم املأ البيانات المطلوبة. ستحتاج إلى بريد إلكتروني ورقم هاتف صالحين لإكمال التسجيل.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>نسيت كلمة المرور، ماذا أفعل؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>في صفحة تسجيل الدخول، اضغط على \"نسيت كلمة المرور؟\" وأدخل بريدك الإلكتروني. سنرسل لك رابط لإعادة تعيين كلمة المرور.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>كيف أحدث معلومات ملفي الشخصي؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>بعد تسجيل الدخول، اذهب إلى \"ملفي الشخصي\" ثم اضغط على \"تعديل الملف الشخصي\". يمكنك تحديث جميع معلوماتك وإضافة أعمالك.</p>\n</div>\n</div>\n</div>\n<!-- Payment Questions -->\n<div class=\"faq-category-section\" data-category=\"payment\">\n<h2 class=\"faq-category-title\">الدفع والفواتير</h2>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>ما هي طرق الدفع المتاحة؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>نوفر عدة طرق للدفع: البطاقات الائتمانية (Visa, Mastercard)، المحافظ الإلكترونية، والتحويل البنكي المحلي.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>كم نسبة العمولة التي تأخذها المنصة؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>نحصل على عمولة 10% من قيمة المشروع المنجز. هذه العمولة تشمل جميع خدمات المنصة والدعم الفني.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>متى أستلم أموالي بعد إنجاز المشروع؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>بعد تأكيد العميل على استلام العمل، يتم تحويل المبلغ إلى حسابك خلال 3-5 أيام عمل.</p>\n</div>\n</div>\n</div>\n<!-- Services Questions -->\n<div class=\"faq-category-section\" data-category=\"services\">\n<h2 class=\"faq-category-title\">الخدمات والمشاريع</h2>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>كيف أعرض خدماتي على المنصة؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>بعد إنشاء حسابك، اذهب إلى \"المتجر\" واضغط على \"إضافة خدمة جديدة\". أضف تفاصيل الخدمة، السعر، ومدة التنفيذ.</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>كيف أتواصل مع العملاء؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>نوفر نظام محادثات مباشر داخل المنصة. يمكنك التواصل مع العملاء بشكل آمن ومنظم من خلال صفحة \"المحادثات\".</p>\n</div>\n</div>\n<div class=\"faq-item\">\n<button class=\"faq-question\">\n<span>ماذا أفعل في حالة وجود مشكلة مع عميل؟</span>\n<svg class=\"faq-icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<polyline points=\"6 9 12 15 18 9\"></polyline>\n</svg>\n</button>\n<div class=\"faq-answer\">\n<p>يمكنك التواصل مع فريق الدعم الفني عبر صفحة \"اتصل بنا\" أو من خلال البريد الإلكتروني support@sayt.om. سنساعدك في حل المشكلة.</p>\n</div>\n</div>\n</div>\n</div>\n<!-- Still Have Questions -->\n<div class=\"faq-cta\">\n<h3>لم تجد إجابة لسؤالك؟</h3>\n<p>تواصل معنا وسنكون سعداء بمساعدتك</p>\n<a class=\"btn btn-primary\" href=\"contact.html\">تواصل معنا</a>\n</div>\n</div>\n</section>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>// FAQ Functionality\n\ndocument.addEventListener('DOMContentLoaded', function() {\n    initFAQ();\n});\n\nfunction initFAQ() {\n    // FAQ Accordion\n    const faqQuestions = document.querySelectorAll('.faq-question');\n    \n    faqQuestions.forEach(question => {\n        question.addEventListener('click', function() {\n            const faqItem = this.parentElement;\n            const isActive = faqItem.classList.contains('active');\n            \n            // Close all other items\n            document.querySelectorAll('.faq-item').forEach(item => {\n                item.classList.remove('active');\n            });\n            \n            // Toggle current item\n            if (!isActive) {\n                faqItem.classList.add('active');\n            }\n        });\n    });\n\n    // Category Filter\n    const categoryBtns = document.querySelectorAll('.faq-category-btn');\n    const categorySections = document.querySelectorAll('.faq-category-section');\n    \n    categoryBtns.forEach(btn => {\n        btn.addEventListener('click', function() {\n            const category = this.getAttribute('data-category');\n            \n            // Update active button\n            categoryBtns.forEach(b => b.classList.remove('active'));\n            this.classList.add('active');\n            \n            // Filter sections\n            if (category === 'all') {\n                categorySections.forEach(section => {\n                    section.style.display = 'block';\n                });\n            } else {\n                categorySections.forEach(section => {\n                    if (section.getAttribute('data-category') === category) {\n                        section.style.display = 'block';\n                    } else {\n                        section.style.display = 'none';\n                    }\n                });\n            }\n        });\n    });\n\n    // Search Functionality\n    const searchInput = document.getElementById('faqSearch');\n    \n    searchInput?.addEventListener('input', function() {\n        const searchTerm = this.value.toLowerCase();\n        const faqItems = document.querySelectorAll('.faq-item');\n        \n        faqItems.forEach(item => {\n            const question = item.querySelector('.faq-question span').textContent.toLowerCase();\n            const answer = item.querySelector('.faq-answer').textContent.toLowerCase();\n            \n            if (question.includes(searchTerm) || answer.includes(searchTerm)) {\n                item.style.display = 'block';\n                \n                // Highlight search term\n                if (searchTerm) {\n                    item.classList.add('highlight');\n                } else {\n                    item.classList.remove('highlight');\n                }\n            } else {\n                item.style.display = 'none';\n            }\n        });\n        \n        // Show/hide category titles\n        categorySections.forEach(section => {\n            const visibleItems = section.querySelectorAll('.faq-item[style=\"display: block\"]');\n            if (visibleItems.length > 0) {\n                section.style.display = 'block';\n            } else {\n                section.style.display = 'none';\n            }\n        });\n    });\n}\n<\/script>\n<script>\n        // Load header and footer\n        fetch('components/header.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('header-container').innerHTML = data;\n            });\n\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "dashboard": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>لوحة التحكم - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* ==================== Dashboard Styles ==================== */\n\n.dashboard-wrapper {\n    padding: var(--spacing-xl) 0;\n    min-height: calc(100vh - 200px);\n}\n\n/* Welcome Section */\n.welcome-section {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: var(--spacing-xl);\n    padding: var(--spacing-lg);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.05) 0%, rgba(161, 124, 26, 0.05) 100%);\n    border-radius: var(--radius-xl);\n    border: 2px solid var(--border-color);\n}\n\n.welcome-content h1 {\n    font-size: 1.75rem;\n    font-weight: 800;\n    margin-bottom: 0.5rem;\n    color: var(--text-primary);\n}\n\n.welcome-content p {\n    color: var(--text-secondary);\n    font-size: 0.95rem;\n}\n\n.welcome-actions .btn {\n    font-size: 0.9rem;\n}\n\n/* Stats Grid */\n.stats-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n    gap: var(--spacing-md);\n    margin-bottom: var(--spacing-xl);\n}\n\n.stat-card {\n    background: var(--surface-color);\n    border-radius: var(--radius-lg);\n    padding: var(--spacing-md);\n    display: flex;\n    gap: var(--spacing-md);\n    box-shadow: var(--shadow-sm);\n    transition: var(--tran ition: relative;\n    aspect-ratio: 1;\n    border-radius: var(--radius-lg);\n    overflow: hidden;\n    cursor: pointer;\n    background: var(--bg-color);\n    transition: var(--transition-base);\n    border: 2px solid var(--border-color);\n}\n\n.portfolio-item:hover {\n    transform: scale(1.05);\n    box-shadow: var(--shadow-colored);\n    border-color: var(--primary-color);\n}\n\n.portfolio-placeholder {\n    width: 100%;\n    height: 100%;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 0.5rem;\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n}\n\n.portfolio-placeholder svg {\n    width: 32px;\n    height: 32px;\n    stroke: var(--primary-color);\n}\n\n.portfolio-placeholder span {\n    font-size: 0.8rem;\n    font-weight: 600;\n    color: var(--text-secondary);\n}\n\n.portfolio-item-actions {\n    position: absolute;\n    top: 0.5rem;\n    right: 0.5rem;\n    display: flex;\n    gap: 0.25rem;\n    opacity: 0;\n    transition: var(--transition-fast);\n}\n\n.portfolio-item:hover .portfolio-item-actions {\n    opacity: 1;\n}\n\n.item-action-btn {\n    width: 28px;\n    height: 28px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--surface-color);\n    border-radius: var(--radius-md);\n    box-shadow: var(--shadow-md);\n    transition: var(--transition-fast);\n    border: none;\n    cursor: pointer;\n}\n\n.item-action-btn:hover {\n    transform: scale(1.1);\n}\n\n.item-action-btn.edit {\n    color: var(--primary-color);\n}\n\n.item-action-btn.delete {\n    color: #dc2626;\n}\n\n.item-action-btn svg {\n    width: 14px;\n    height: 14px;\n}\n\n/* Products Grid */\n.products-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));\n    gap: var(--spacing-md);\n}\n\n.product-item {\n    background: var(--bg-color);\n    border-radius: var(--radius-lg);\n    padding: h === 0) {\n        productsGrid.innerHTML = `\n            <div class=\"empty-state\" style=\"grid-column: 1 / -1;\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                    <circle cx=\"9\" cy=\"21\" r=\"1\"></circle>\n                    <circle cx=\"20\" cy=\"21\" r=\"1\"></circle>\n                    <path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path>\n                </svg>\n                <h3 data-ar=\"لا توجد منتجات بعد\" data-en=\"No products yet\">لا توجد منتجات بعد</h3>\n                <p data-ar=\"أضف منتجاتك للبيع في المتجر\" data-en=\"Add your products to sell in the store\">أضف منتجاتك للبيع في المتجر</p>\n            </div>\n        `;\n        return;\n    }\n    \n    productsGrid.innerHTML = dashboardData.products.map(product => `\n        <div class=\"product-item\" data-id=\"${product.id}\">\n            <div class=\"product-image\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                    <circle cx=\"9\" cy=\"21\" r=\"1\"></circle>\n                    <circle cx=\"20\" cy=\"21\" r=\"1\"></circle>\n                    <path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path>\n                </svg>\n            </div>\n            <div class=\"product-info\">\n                <h4>${product.title}</h4>\n                <div class=\"product-price\">${product.price}</div>\n                <span class=\"product-status ${product.status}\">${product.statusText}</span>\n            </div>\n        </div>\n    `).join('');\n}\n\n// ==================== Load Workshops ====================\nfunction loadWorkshops() {\n    const workshopsList = document.getElementById('workshopsList');\n    \n    if (!workshopsList) return;\n    \n    if (dashboardData.workshops.length === 0) {\n        workshopsList.innerHTML = `\n            <div class=\"empty-state\">\n ion editPortfolioItem(id) {\n    const item = dashboardData.portfolio.find(p => p.id === id);\n    if (item) {\n        showToast(`تعديل: ${item.title}`, 'info');\n        // Here you would open a modal or navigate to edit page\n    }\n}\n\nfunction deletePortfolioItem(id) {\n    if (confirm('هل أنت متأكد من حذف هذا العمل؟')) {\n        dashboardData.portfolio = dashboardData.portfolio.filter(p => p.id !== id);\n        loadPortfolio();\n        showToast('تم حذف العمل بنجاح', 'success');\n    }\n}\n\n// ==================== Add Work Button ====================\ndocument.addEventListener('DOMContentLoaded', function() {\n    const addWorkBtn = document.getElementById('addWorkBtn');\n    const addProductBtn = document.getElementById('addProductBtn');\n    \n    if (addWorkBtn) {\n        addWorkBtn.addEventListener('click', function() {\n            showToast('ميزة إضافة عمل قريباً', 'info');\n            // Here you would open a modal to add new work\n        });\n    }\n    \n    if (addProductBtn) {\n        addProductBtn.addEventListener('click', function() {\n            showToast('ميزة إضافة منتج قريباً', 'info');\n            // Here you would open a modal to add new product\n        });\n    }\n    \n    // Load all data\n    loadPortfolio();\n    loadProducts();\n    loadWorkshops();\n    \n    // Update language when changed\n    window.addEventListener('languageChanged', function(e) {\n        const lang = e.detail.lang;\n        updateDashboardLanguage(lang);\n    });\n});\n\n// ==================== Update Dashboard Language ====================\nfunction updateDashboardLanguage(lang) {\n    // Update product status text\n    const productStatuses = document.querySelectorAll('.product-status');\n    productStatuses.forEach(status => {\n        if (status.classList.contains('active')) {\n            status.textContent = lang === 'ar' ? 'نشط' : 'Active';\n        } else if (status.classList.contains('draft')) {\n            status.textContent = lang === 'ar' ? 'مسودة' : 'Draft';\n        }\n    });\n    \n    // Update empty states\n    const emptyStates = document.querySelectorAll('.empty-state');\n    emptyStates.forEach(state => {\n        const h3 = state.querySelector('h3');\n        const p = state.querySelector('p');\n        if (h3 && h3.hasAttribute('data-ar') && h3.hasAttribute('data-en')) {\n            h3.textContent = lang === 'ar' ? h3.getAttribute('data-ar') : h3.getAttribute('data-en');\n        }\n        if (p && p.hasAttribute('data-ar') && p.hasAttribute('data-en')) {\n            p.textContent = lang === 'ar' ? p.getAttribute('data-ar') : p.getAttribute('data-en');\n        }\n    });\n}\n\n// ==================== Stats Animation ====================\nfunction animateStats() {\n    const statNumbers = document.querySelectorAll('.stat-number');\n    \n    statNumbers.forEach(stat => {\n        const target = parseInt(stat.textContent.replace(/,/g, ''));\n        if (isNaN(target)) return;\n        \n        let current = 0;\n        const increment = target / 50;\n        const timer = setInterval(() => {\n            current += increment;\n            if (current >= target) {\n                stat.textContent = target.toLocaleString();\n                clearInterval(timer);\n            } else {\n                stat.textContent = Math.floor(current).toLocaleString();\n            }\n        }, 20);\n    });\n}\n\n// Animate stats on page load\nwindow.addEventListener('load', () => {\n    setTimeout(animateStats, 300);\n});\n<\/script>\n<script>\n        // Load footer component\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "profile": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>الملف الشخصي - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* ==================== Profile Page Styles ==================== */\n\n/* Profile Hero Section */\n.profile-hero {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    padding: var(--spacing-xl) 0 var(--spacing-lg);\n    position: relative;\n    overflow: hidden;\n}\n\n.profile-hero::before {\n    content: '';\n    position: absolute;\n    top: 0;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    background: url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' rror);\n            throw error;\n        }\n    }\n\n    window.AppwriteHelper = {\n        init,\n        createAccount,\n        createSession,\n        logout,\n        getCurrentAccount,\n        updatePrefs,\n        createDocument,\n        getDocument,\n        updateDocument,\n        deleteDocument,\n        listDocuments,\n        get Query() {\n            return Query;\n        },\n        APPWRITE_ENDPOINT,\n        APPWRITE_PROJECT_ID,\n        APPWRITE_DATABASE_ID,\n        isReady: () => initialized\n    };\n})(window);<\/script>\n<script>\n        // Load profile data from Appwrite\n        async function loadProfileData() {\n            try {\n                // Get user ID from URL parameters\n                const urlParams = new URLSearchParams(window.location.search);\n                const userId = urlParams.get('id');\n                \n                let profileData = null;\n                let isOwnProfile = false;\n                \n                if (userId && window.AppwriteHelper) {\n                    // Load specific user's profile\n                    const userDoc = await window.AppwriteHelper.getDocument('users', userId);\n                    if (userDoc) {\n                        profileData = userDoc;\n                    }\n                } else {\n                    // Load current user's profile\n                    const currentUser = await window.getSiteCurrentUserFromAppwrite();\n                    if (currentUser && currentUser.profileId) {\n                        const userDoc = await window.AppwriteHelper.getDocument('users', currentUser.profileId);\n                        if (userDoc) {\n                            profileData = userDoc;\n                            isOwnProfile = true;\n                        }\n                    }\n                }\n                \n                if (profileData) {\n                    // Update profile information\n                    document.getElementById('profile ink.href = `https://wa.me/${profileData.phone.replace(/\\D/g, '')}`;\n                        }\n                    }\n                    \n                    // Update verified badge\n                    const verifiedBadge = document.querySelector('.verified-badge-large');\n                    if (verifiedBadge) {\n                        verifiedBadge.style.display = profileData.verified ? 'block' : 'none';\n                    }\n                    \n                    // Load additional data based on user type\n                    if (profileData.type === 'talent') {\n                        await loadTalentData(profileData.$id);\n                    }\n                    \n                    // Load reviews\n                    if (profileData.reviews_count > 0) {\n                        await loadReviews(profileData.$id);\n                    }\n                    \n                    // Update action buttons based on whether it's own profile\n                    updateActionButtons(isOwnProfile, profileData);\n                    \n                } else {\n                    console.warn('No profile data found');\n                    // Show default data or redirect to login\n                    __setHref('login.html');\n                }\n                \n            } catch (error) {\n                console.error('Error loading profile data:', error);\n                // Fallback to default data\n            }\n        }\n        \n        async function loadTalentData(userId) {\n            try {\n                if (!window.AppwriteHelper) return;\n                \n                // Load products/services offered by this talent\n                const products = await window.AppwriteHelper.listDocuments('products', [\n                    window.AppwriteHelper.Query.equal('seller_id', userId)\n                ]);\n                \n                // Load workshops conducted by this talent\n                const workshops = await window.App                 </div>\n                                <p>${workshop.description}</p>\n                                <div class=\"experience-meta\">\n                                    <span>المستوى: ${workshop.level === 'beginner' ? 'مبتدئ' : workshop.level === 'intermediate' ? 'متوسط' : 'متقدم'}</span>\n                                    <span>المدة: ${workshop.duration} ${workshop.duration_unit}</span>\n                                </div>\n                            </div>\n                        `).join('');\n                    }\n                }\n                \n            } catch (error) {\n                console.error('Error loading talent data:', error);\n            }\n        }\n        \n        function updateActionButtons(isOwnProfile, profileData) {\n            const chatBtn = document.getElementById('chatBtn');\n            const requestBtn = document.getElementById('requestBtn');\n            const favoriteBtn = document.getElementById('favoriteBtn');\n            \n            if (isOwnProfile) {\n                // Hide action buttons for own profile\n                if (chatBtn) chatBtn.style.display = 'none';\n                if (requestBtn) requestBtn.style.display = 'none';\n                if (favoriteBtn) favoriteBtn.style.display = 'none';\n                \n                // Add edit profile button\n                const actionsContainer = document.querySelector('.profile-quick-actions');\n                if (actionsContainer) {\n                    const editBtn = document.createElement('button');\n                    editBtn.className = 'btn btn-secondary btn-icon-text';\n                    editBtn.innerHTML = `\n                        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                            <path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"></path>\n                            <path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"></path>\n                        </svg>\n                        <span data-ar=\"تعديل الملف\" data-en=\"Edit Profile\">تعديل الملف</span>\n                    `;\n                    editBtn.addEventListener('click', () => {\n                        __setHref('my-profile.html');\n                    });\n                    actionsContainer.appendChild(editBtn);\n                }\n            } else {\n                // Show action buttons for other profiles\n                if (chatBtn) chatBtn.style.display = 'inline-flex';\n                if (requestBtn) requestBtn.style.display = 'inline-flex';\n                if (favoriteBtn) favoriteBtn.style.display = 'inline-flex';\n            }\n        }\n        \n        function updateStarsDisplay(elementId, rating) {\n            const starsContainer = document.getElementById(elementId);\n            if (!starsContainer) return;\n            \n            starsContainer.innerHTML = generateStars(rating);\n        }\n        \n        async function loadPortfolio(portfolioUrl) {\n            const portfolioGrid = document.getElementById('portfolioGrid');\n            if (!portfolioGrid) return;\n            \n            // For now, show a placeholder. In real implementation, you'd load actual portfolio items\n            portfolioGrid.innerHTML = `\n                <div class=\"portfolio-item\">\n                    <img src=\"${portfolioUrl}\" alt=\"Portfolio item\" onerror=\"this.style.display='none'\">\n                    <div class=\"portfolio-overlay\">\n                        <h4>عمل فني</h4>\n                        <p>وصف العمل</p>\n                    </div>\n                </div>\n            `;\n        }\n        \n        function generateStars(rating) {\n            const fullStars = Math.floor(rating);\n            const hasHalfStar = rating % 1 !== 0;\n            const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);\n            \n            return `\n                ${'★'.repeat(fullStars)}\n                ${hasHalfStar ? '☆' : ''}\n                ${'☆'.repeat(emptyStars)}\n            `;\n        }\n        \n        async function loadReviews(userId) {\n            try {\n                if (!window.AppwriteHelper) return;\n                \n                const reviews = await window.AppwriteHelper.listDocuments('reviews', [\n                    window.AppwriteHelper.Query.equal('reviewed_user_id', userId)\n                ]);\n                \n                const reviewsContainer = document.getElementById('reviewsList');\n                if (!reviewsContainer || !reviews.documents) return;\n                \n                reviewsContainer.innerHTML = reviews.documents.map(review => `\n                    <div class=\"review-item\">\n                        <div class=\"review-header\">\n                            <div class=\"reviewer-info\">\n                                <div class=\"reviewer-avatar\">${review.reviewer_name?.charAt(0) || 'م'}</div>\n                                <div class=\"reviewer-details\">\n                                    <h4>${review.reviewer_name || 'مستخدم'}</h4>\n                                    <div class=\"review-stars\">${generateStars(review.rating)}</div>\n                                </div>\n                            </div>\n                            <span class=\"review-date\">${new Date(review.created_at).toLocaleDateString('ar-SA')}</span>\n                        </div>\n                        <p class=\"review-comment\">${review.comment || 'لا يوجد تعليق'}</p>\n                        ${review.project_title ? `<div class=\"review-project\">المشروع: ${review.project_title}</div>` : ''}\n                    </div>\n                `).join('');\n                \n            } catch (error) {\n                console.error('Error loading reviews:', error);\n            }\n        }\n        \n        // Initialize collapsible sections\n        document.addEventListener('DOMContentLoaded', function() {\n            // Load profile data\n            loadProfileData();\n            \n            // Initialize collapsible sections\n            const toggles = document.querySelectorAll('.section-toggle');\n            toggles.forEach(toggle => {\n                toggle.addEventListener('click', function() {\n                    const section = this.dataset.section;\n                    const content = document.getElementById(`${section}-content`);\n                    const icon = this.querySelector('.toggle-icon');\n                    \n                    if (content && icon) {\n                        content.classList.toggle('active');\n                        icon.classList.toggle('rotated');\n                    }\n                });\n            });\n            \n            // Initialize portfolio filters\n            const filterBtns = document.querySelectorAll('.filter-btn');\n            filterBtns.forEach(btn => {\n                btn.addEventListener('click', function() {\n                    filterBtns.forEach(b => b.classList.remove('active'));\n                    this.classList.add('active');\n                    // Implement filtering logic here\n                });\n            });\n            \n            // Initialize action buttons\n            const chatBtn = document.getElementById('chatBtn');\n            const requestBtn = document.getElementById('requestBtn');\n            const favoriteBtn = document.getElementById('favoriteBtn');\n            const shareBtn = document.getElementById('shareBtn');\n            \n            if (chatBtn) {\n                chatBtn.addEventListener('click', function() {\n                    // Implement chat functionality\n                    window.showToast('ميزة المحادثة قريباً', 'info');\n                });\n            }\n            \n            if (requestBtn) {\n                requestBtn.addEventListener('click', function() {\n                    // Implement request functionality\n                    window.showToast('ميزة إرسال الطلبات قريباً', 'info');\n                });\n            }\n            \n            if (favoriteBtn) {\n                favoriteBtn.addEventListener('click', function() {\n                    this.classList.toggle('active');\n                    window.showToast('تم إضافة للمفضلة', 'success');\n                });\n            }\n            \n            if (shareBtn) {\n                shareBtn.addEventListener('click', function() {\n                    if (navigator.share) {\n                        navigator.share({\n                            title: document.title,\n                            url: window.location.href\n                        });\n                    } else {\n                        // Fallback: copy to clipboard\n                        navigator.clipboard.writeText(window.location.href);\n                        window.showToast('تم نسخ الرابط', 'success');\n                    }\n                });\n            }\n        });\n        \n        // Load header and footer\n        fetch('components/header.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('header-container').innerHTML = data;\n            });\n\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>// Profile Page JavaScript\n\nconst profileData = {\n    name: 'المستخدم',\n    category: 'مستخدم',\n    city: 'غير محدد',\n    rating: 4.8,\n    reviewsCount: 45,\n    bio: 'هذا الملف الشخصي يتم تحديثه تلقائياً بناءً على بيانات الجلسة الحالية.',\n    yearsExperience: '0+',\n    workType: 'عميل',\n    completedProjects: 0,\n    portfolio: [\n        { id: 1, type: 'photo', title: 'تصوير حفل زفاف', image: '📷' },\n        { id: 2, type: 'photo', title: 'تصوير منتجات', image: '📸' },\n        { id: 3, type: 'video', title: 'فيديو ترويجي', image: '🎥' },\n        { id: 4, type: 'photo', title: 'تصوير طبيعة', image: '🌄' },\n        { id: 5, type: 'photo', title: 'تصوير بورتريه', image: '👤' },\n        { id: 6, type: 'video', title: 'فيديو إعلاني', image: '📹' }\n    ],\n    experience: [\n        {\n            title: 'مصور رئيسي - شركة الإبداع',\n            period: '2020 - الآن',\n            description: 'إدارة فريق التصوير وتنفيذ مشاريع تصوير كبرى للشركات والمؤسسات'\n        },\n        {\n            title: 'مصور مستقل',\n            period: '2018 - 2020',\n            description: 'تصوير المناسبات والفعاليات الخاصة والعامة'\n        }\n    ],\n    reviews: [\n        {\n            name: 'محمد الشكيلي',\n            rating: 5,\n            date: 'منذ أسبوع',\n            text: 'مصور محترف جداً، التزام بالمواعيد وجودة عمل ممتازة. أنصح بالتعامل معه'\n        },\n        {\n            name: 'فاطمة البلوشية',\n            rating: 5,\n            date: 'منذ أسبوعين',\n            text: 'تجربة رائعة، الصور جاءت أفضل من المتوقع. شكراً على الاحترافية'\n        },\n        {\n            name: 'سالم الحارثي',\n            rating: 4,\n            date: 'منذ شهر',\n            text: 'عمل جيد وأسعار مناسبة. سأتعامل معه مرة أخرى بإذن الله'\n        }\n    ]\n};\n\n// Initialize page\ndocument.addEventListener('DOMContentLoaded', async function() {\n    await loadCurrentUserProfile();\n    loadProfileData();\n    initializePortfolio();\n    initializeReviews();\n    initializeButtons();\n});\n\nfunction formatCategory(category) {\n    const normalized = (category || '').toString().trim().toLowerCase();\n    if (['photography', 'تصوير', 'photo'].includes(normalized)) return 'التصوير';\n    if (['design', 'تصميم'].includes(normalized)) return 'التصميم';\n    if (['writing', 'كتابة'].includes(normalized)) return 'الكتابة';\n    if (['programming', 'برمجة'].includes(normalized)) return 'البرمجة';\n    return category || 'مستخدم';\n}\n\nasync function loadCurrentUserProfile() {\n    try {\n        const user = typeof window.getSiteCurrentUserFromAppwrite === 'function'\n            ? await window.getSiteCurrentUserFromAppwrite()\n            : null;\n\n        const currentUser = user || JSON.parse(localStorage.getItem('site_current_user') || 'null');\n\n        if (currentUser) {\n            profileData.name = `${currentUser.firstName || ''} ${currentUser.lastName || ''}`.trim() || currentUser.name || 'المستخدم';\n            profileData.category = formatCategory(currentUser.category || currentUser.role);\n            profileData.city = currentUser.city || 'غير محدد';\n            profileData.bio = currentUser.bio || 'هذا الملف الشخصي يتم تحديثه تلقائياً بناءً على بيانات الجلسة الحالية.';\n            profileData.yearsExperience = currentUser.experience ? `${currentUser.experience}+` : '0+';\n            profileData.workType = currentUser.role === 'talent' ? 'فرد' : currentUser.role === 'admin' ? 'مشرف' : 'عميل';\n            profileData.completedProjects = currentUser.role === 'talent' ? 24 : 0;\n\n            const avatarElement = document.getElementById('profileAvatar');\n            if (avatarElement) {\n                avatarElement.textContent = currentUser.avatar || profileData.name.charAt(0) || '👤';\n            }\n        }\n    } catch (error) {\n        console.warn('لم يتم جلب بيانات المستخدم من الجلسة:', error);\n    }\n}\n\n// Load profile data\nfunction loadProfileData() {\n    // Load basic info\n    document.getElementById('profileName').textContent = profileData.name;\n    document.getElementById('profileCategory').textContent = profileData.category;\n    document.getElementById('profileCity').textContent = profileData.city;\n    document.getElementById('profileRating').textContent = profileData.rating;\n    document.getElementById('reviewsCount').textContent = profileData.reviewsCount;\n    \n    // Load stars\n    const starsContainer = document.getElementById('profileStars');\n    starsContainer.innerHTML = generateStars(profileData.rating);\n    \n    const reviewStarsLarge = document.getElementById('reviewStarsLarge');\n    reviewStarsLarge.innerHTML = generateStars(profileData.rating);\n    \n    // Load about section\n    document.getElementById('profileBio').textContent = profileData.bio;\n    document.getElementById('yearsExperience').textContent = profileData.yearsExperience;\n    document.getElementById('completedProjects').textContent = profileData.completedProjects;\n    \n    // Load experience\n    loadExperience();\n}\n\n// Generate stars HTML\nfunction generateStars(rating) {\n    let starsHTML = '';\n    const fullStars = Math.floor(rating);\n    const hasHalfStar = rating % 1 !== 0;\n    \n    for (let i = 0; i < fullStars; i++) {\n        starsHTML += '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"></polygon></svg>';\n    }\n    \n    if (hasHalfStar) {\n        starsHTML += '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\"0.5\"><polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"></polygon></svg>';\n    }\n    \n    const emptyStars = 5 - Math.ceil(rating);\n    for (let i = 0; i < emptyStars; i++) {\n        starsHTML += '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\"0.3\"><polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"></polygon></svg>';\n    }\n    \n    return starsHTML;\n}\n\n// Initialize portfolio\nfunction initializePortfolio() {\n    const portfolioGrid = document.getElementById('portfolioGrid');\n    \n    if (profileData.portfolio.length === 0) {\n        portfolioGrid.innerHTML = '<p style=\"text-align: center; color: var(--text-secondary); padding: 2rem;\">لا توجد أعمال معروضة حالياً</p>';\n        return;\n    }\n    \n    portfolioGrid.innerHTML = profileData.portfolio.map(item => `\n        <div class=\"portfolio-item\" data-type=\"${item.type}\" data-id=\"${item.id}\">\n            <div class=\"portfolio-placeholder\">${item.image}</div>\n        </div>\n    `).join('');\n    \n    // Add click event to portfolio items\n    document.querySelectorAll('.portfolio-item').forEach(item => {\n        item.addEventListener('click', function() {\n            const id = this.dataset.id;\n            openPortfolioModal(id);\n        });\n    });\n    \n    // Portfolio filters\n    const filterBtns = document.querySelectorAll('.filter-btn');\n    filterBtns.forEach(btn => {\n        btn.addEventListener('click', function() {\n            filterBtns.forEach(b => b.classList.remove('active'));\n            this.classList.add('active');\n            \n            const filter = this.dataset.filter;\n            filterPortfolio(filter);\n        });\n    });\n}\n\n// Filter portfolio\nfunction filterPortfolio(filter) {\n    const items = document.querySelectorAll('.portfolio-item');\n    \n    items.forEach(item => {\n        if (filter === 'all' || item.dataset.type === filter) {\n            item.style.display = 'block';\n        } else {\n            item.style.display = 'none';\n        }\n    });\n}\n\n// Open portfolio modal\nfunction openPortfolioModal(id) {\n    const item = profileData.portfolio.find(p => p.id == id);\n    if (!item) return;\n    \n    const modal = document.getElementById('portfolioModal');\n    const modalContent = document.getElementById('portfolioModalContent');\n    \n    modalContent.innerHTML = `\n        <div style=\"text-align: center;\">\n            <div style=\"font-size: 8rem; margin-bottom: 1rem;\">${item.image}</div>\n            <h3 style=\"font-size: 1.5rem; margin-bottom: 0.5rem;\">${item.title}</h3>\n            <span style=\"color: var(--text-secondary);\">${item.type === 'photo' ? 'صورة' : 'فيديو'}</span>\n        </div>\n    `;\n    \n    modal.classList.add('active');\n}\n\n// Close portfolio modal\ndocument.getElementById('closePortfolioModal')?.addEventListener('click', function() {\n    document.getElementById('portfolioModal').classList.remove('active');\n});\n\n// Close modal on overlay click\ndocument.querySelector('.modal-overlay')?.addEventListener('click', function() {\n    document.getElementById('portfolioModal').classList.remove('active');\n});\n\n// Load experience\nfunction loadExperience() {\n    const experienceList = document.getElementById('experienceList');\n    \n    if (profileData.experience.length === 0) {\n        experienceList.innerHTML = '<p style=\"text-align: center; color: var(--text-secondary); padding: 2rem;\">لا توجد خبرات مضافة حالياً</p>';\n        return;\n    }\n    \n    experienceList.innerHTML = profileData.experience.map(exp => `\n        <div class=\"experience-item\">\n            <h4>${exp.title}</h4>\n            <div class=\"experience-meta\">\n                <span>\n                    <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"display: inline; vertical-align: middle;\">\n                        <circle cx=\"12\" cy=\"12\" r=\"10\"></circle>\n                        <polyline points=\"12 6 12 12 16 14\"></polyline>\n                    </svg>\n                    ${exp.period}\n                </span>\n            </div>\n            <p>${exp.description}</p>\n        </div>\n    `).join('');\n}\n\n// Initialize reviews\nfunction initializeReviews() {\n    const reviewsList = document.getElementById('reviewsList');\n    \n    if (profileData.reviews.length === 0) {\n        reviewsList.innerHTML = '<p style=\"text-align: center; color: var(--text-secondary); padding: 2rem;\">لا توجد تقييمات حالياً</p>';\n        return;\n    }\n    \n    reviewsList.innerHTML = profileData.reviews.map(review => `\n        <div class=\"review-item\">\n            <div class=\"review-header\">\n                <div class=\"reviewer-info\">\n                    <div class=\"reviewer-avatar\">👤</div>\n                    <div>\n                        <div class=\"reviewer-name\">${review.name}</div>\n                        <div class=\"review-date\">${review.date}</div>\n                    </div>\n                </div>\n                <div class=\"review-rating\">\n                    ${generateStars(review.rating)}\n                </div>\n            </div>\n            <p class=\"review-text\">${review.text}</p>\n        </div>\n    `).join('');\n}\n\n// Initialize buttons\nfunction initializeButtons() {\n    // Chat button\n    document.getElementById('chatBtn')?.addEventListener('click', function() {\n        __setHref('chat.html');\n    });\n    \n    // Request button\n    document.getElementById('requestBtn')?.addEventListener('click', function() {\n        __setHref('request.html');\n    });\n    \n    // Favorite button\n    let isFavorite = false;\n    document.getElementById('favoriteBtn')?.addEventListener('click', function() {\n        isFavorite = !isFavorite;\n        const svg = this.querySelector('svg path');\n        if (isFavorite) {\n            svg.setAttribute('fill', 'currentColor');\n            this.style.color = '#ef4444';\n        } else {\n            svg.setAttribute('fill', 'none');\n            this.style.color = '';\n        }\n    });\n    \n    // Share button\n    document.getElementById('shareBtn')?.addEventListener('click', function() {\n        if (navigator.share) {\n            navigator.share({\n                title: profileData.name,\n                text: `تحقق من ملف ${profileData.name} على منصة صيت`,\n                url: window.location.href\n            });\n        } else {\n            // Fallback: copy to clipboard\n            navigator.clipboard.writeText(window.location.href);\n            alert('تم نسخ الرابط');\n        }\n    });\n}\n\n\n// Initialize collapsible sections\nfunction initializeCollapsibleSections() {\n    const collapsibleHeaders = document.querySelectorAll('.section-header-collapsible');\n    \n    collapsibleHeaders.forEach(header => {\n        header.addEventListener('click', function() {\n            const section = this.dataset.section;\n            const content = document.getElementById(`${section}-content`);\n            \n            // Toggle active class\n            this.classList.toggle('active');\n            content.classList.toggle('active');\n        });\n    });\n    \n    // Open first section by default\n    if (collapsibleHeaders.length > 0) {\n        collapsibleHeaders[0].classList.add('active');\n    }\n}\n\n\n// ==================== Setup Collapsible Sections ====================\nfunction setupCollapsibleSections() {\n    const toggleButtons = document.querySelectorAll('.section-toggle');\n    \n    toggleButtons.forEach(button => {\n        button.addEventListener('click', () => {\n            const section = button.closest('.collapsible-section');\n            const isActive = section.classList.contains('active');\n            \n            // Close all sections\n            document.querySelectorAll('.collapsible-section').forEach(s => {\n                s.classList.remove('active');\n            });\n            \n            // Open clicked section if it wasn't active\n            if (!isActive) {\n                section.classList.add('active');\n            }\n        });\n    });\n    \n    // Open first section by default\n    const firstSection = document.querySelector('.collapsible-section');\n    if (firstSection) {\n        firstSection.classList.add('active');\n    }\n}\n\n// Initialize collapsible sections on page load\nif (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', function() {\n        initializeCollapsibleSections();\n        setupCollapsibleSections();\n    });\n} else {\n    initializeCollapsibleSections();\n    setupCollapsibleSections();\n}<\/script>\n<script>\n        // Load footer component\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>", "my-profile": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initia
