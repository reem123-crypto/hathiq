e -->\n</div>\n<div class=\"cart-empty\" id=\"cartEmpty\" style=\"display: none;\">\n<svg fill=\"none\" height=\"80\" stroke=\"currentColor\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"80\">\n<circle cx=\"9\" cy=\"21\" r=\"1\"></circle>\n<circle cx=\"20\" cy=\"21\" r=\"1\"></circle>\n<path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path>\n</svg>\n<h3 data-ar=\"سلة التسوق فارغة\" data-en=\"Cart is Empty\">سلة التسوق فارغة</h3>\n<p data-ar=\"لم تقم بإضافة أي منتجات بعد\" data-en=\"You haven't added any items yet\">لم تقم بإضافة أي منتجات بعد</p>\n<a class=\"btn btn-primary\" data-ar=\"تصفح المتجر\" data-en=\"Browse Store\" href=\"store.html\">تصفح المتجر</a>\n</div>\n</div>\n<!-- Cart Summary -->\n<aside class=\"cart-summary\">\n<h3 data-ar=\"ملخص الطلب\" data-en=\"Order Summary\">ملخص الطلب</h3>\n<div class=\"summary-row\">\n<span data-ar=\"المجموع الفرعي\" data-en=\"Subtotal\">المجموع الفرعي</span>\n<span id=\"subtotal\">0 ر.ع</span>\n</div>\n<div class=\"summary-row\">\n<span data-ar=\"الضريبة (5%)\" data-en=\"Tax (5%)\">الضريبة (5%)</span>\n<span id=\"tax\">0 ر.ع</span>\n</div>\n<div class=\"summary-row\">\n<span data-ar=\"التوصيل\" data-en=\"Shipping\">التوصيل</span>\n<span id=\"shipping\">مجاني</span>\n</div>\n<div class=\"promo-code\">\n<input data-ar=\"كود الخصم\" data-en=\"Promo Code\" id=\"promoInput\" placeholder=\"كود الخصم\" type=\"text\"/>\n<button class=\"btn btn-outline btn-sm\" data-ar=\"تطبيق\" data-en=\"Apply\" id=\"applyPromoBtn\">تطبيق</button>\n</div>\n<div class=\"summary-row discount\" id=\"discountRow\" style=\"display: none;\">\n<span data-ar=\"الخصم\" data-en=\"Discount\">الخصم</span>\n<span id=\"discount\" style=\"color: var(--success-color);\">-0 ر.ع</span>\n</div>\n<div class=\"summary-divider\"></div>\n<div class=\"summary-row total\">\n<span data-ar=\"المجموع الكلي\" data-en=\"Total\">المجموع الكلي</span>\n<span id=\"total\">0 ر.ع</span>\n</div>\n<button class=\"btn btn-primary btn-block\" data-ar=\"إتمام الشراء\" data-en=\"Proceed to Checkout\" id=\"checkoutBtn\">إتمام الشراء</button>\n<div class=\"payment-methods\">\n<p data-ar=\"طرق الدفع المتاحة\" data-en=\"Payment Methods\">طرق الدفع المتاحة</p>\n<div class=\"payment-icons\">\n<div class=\"payment-icon\">💳</div>\n<div class=\"payment-icon\">🏦</div>\n<div class=\"payment-icon\">📱</div>\n</div>\n</div>\n<div class=\"security-badge\">\n<svg fill=\"none\" height=\"16\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"16\">\n<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path>\n</svg>\n<span data-ar=\"عملية دفع آمنة ومشفرة\" data-en=\"Secure &amp; Encrypted Payment\">عملية دفع آمنة ومشفرة</span>\n</div>\n</aside>\n</div>\n<!-- Recommended Products -->\n<div class=\"recommended-section\">\n<h2 data-ar=\"قد يعجبك أيضاً\" data-en=\"You May Also Like\">قد يعجبك أيضاً</h2>\n<div class=\"recommended-grid\" id=\"recommendedProducts\">\n<!-- Recommended products will be loaded here -->\n</div>\n</div>\n</div>\n</div>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>// ==================== Cart Data ====================\nlet cartData = [\n    { id: 1, title: 'قالب تصميم احترافي', seller: 'أحمد المعمري', price: 50, quantity: 1, image: '🎨' },\n    { id: 2, title: 'كورس تطوير المواقع', seller: 'فاطمة الحارثية', price: 75, quantity: 2, image: '💻' },\n    { id: 3, title: 'حزمة أيقونات', seller: 'سالم البلوشي', price: 30, quantity: 1, image: '🎯' }\n];\n\nconst recommendedProducts = [\n    { id: 4, title: 'دورة التصوير', price: 60, image: '📸' },\n    { id: 5, title: 'قوالب فيديو', price: 45, image: '🎬' },\n    { id: 6, title: 'خطوط عربية', price: 25, image: '✍️' },\n    { id: 7, title: 'موسيقى خلفية', price: 35, image: '🎵' }\n];\n\n// ==================== Load Cart ====================\nfunction loadCart() {\n    const cartItems = document.getElementById('cartItems');\n    const cartEmpty = document.getElementById('cartEmpty');\n    const cartBadge = document.getElementById('cartBadge');\n    \n    if (!cartItems) return;\n    \n    if (cartData.length === 0) {\n        cartItems.style.display = 'none';\n        cartEmpty.style.display = 'block';\n        cartBadge.textContent = '0';\n        \n        // Save to localStorage for header badge\n        localStorage.setItem('cart_items_count', '0');\n        \n        updateSummary();\n        return;\n    }\n    \n    cartItems.style.display = 'flex';\n    cartEmpty.style.display = 'none';\n    cartBadge.textContent = cartData.length;\n    \n    // Save to localStorage for header badge\n    localStorage.setItem('cart_items_count', cartData.length);\n    \n    cartItems.innerHTML = cartData.map(item => `\n        <div class=\"cart-item\" data-id=\"${item.id}\">\n            <div class=\"item-image\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                    <circle cx=\"9\" cy=\"21\" r=\"1\"></circle>\n                    <circle cx=\"20\" cy=\"21\" r=\"1\"></circle>\n                    <path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path>\n                </svg>\n            </div>\n            <div class=\"item-details\">\n                <h3 class=\"item-title\">${item.title}</h3>\n                <div class=\"item-seller\">\n                    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                        <path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path>\n                        <circle cx=\"12\" cy=\"7\" r=\"4\"></circle>\n                    </svg>\n                    <span>${item.seller}</span>\n                </div>\n                <div class=\"item-price\">${item.price} ر.ع</div>\n            </div>\n            <div class=\"item-actions\">\n                <div class=\"quantity-control\">\n                    <button class=\"quantity-btn\" onclick=\"decreaseQuantity(${item.id})\">\n                        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                            <line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"></line>\n                        </svg>\n                    </button>\n                    <span class=\"quantity-value\">${item.quantity}</span>\n                    <button class=\"quantity-btn\" onclick=\"increaseQuantity(${item.id})\">\n                        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                            <line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"></line>\n                            <line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"></line>\n                        </svg>\n                    </button>\n                </div>\n                <button class=\"remove-btn\" onclick=\"removeItem(${item.id})\">\n                    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                        <polyline points=\"3 6 5 6 21 6\"></polyline>\n                        <path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"></path>\n                    </svg>\n                    <span data-ar=\"حذف\" data-en=\"Remove\">حذف</span>\n                </button>\n            </div>\n        </div>\n    `).join('');\n    \n    updateSummary();\n}\n\n// ==================== Cart Actions ====================\nfunction increaseQuantity(id) {\n    const item = cartData.find(i => i.id === id);\n    if (item) {\n        item.quantity++;\n        loadCart();\n    }\n}\n\nfunction decreaseQuantity(id) {\n    const item = cartData.find(i => i.id === id);\n    if (item && item.quantity > 1) {\n        item.quantity--;\n        loadCart();\n    }\n}\n\nfunction removeItem(id) {\n    if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {\n        cartData = cartData.filter(i => i.id !== id);\n        loadCart();\n        showToast('تم حذف المنتج من السلة', 'success');\n    }\n}\n\n// ==================== Update Summary ====================\nfunction updateSummary() {\n    const subtotal = cartData.reduce((sum, item) => sum + (item.price * item.quantity), 0);\n    const tax = subtotal * 0.05;\n    const discount = parseFloat(localStorage.getItem('cart_discount') || 0);\n    const total = subtotal + tax - discount;\n    \n    document.getElementById('subtotal').textContent = `${subtotal.toFixed(2)} ر.ع`;\n    document.getElementById('tax').textContent = `${tax.toFixed(2)} ر.ع`;\n    document.getElementById('total').textContent = `${total.toFixed(2)} ر.ع`;\n    \n    if (discount > 0) {\n        document.getElementById('discountRow').style.display = 'flex';\n        document.getElementById('discount').textContent = `-${discount.toFixed(2)} ر.ع`;\n    } else {\n        document.getElementById('discountRow').style.display = 'none';\n    }\n}\n\n// ==================== Promo Code ====================\nconst promoCodes = {\n    'SAYT10': 10,\n    'WELCOME': 15,\n    'SAVE20': 20\n};\n\ndocument.addEventListener('DOMContentLoaded', function() {\n    const applyPromoBtn = document.getElementById('applyPromoBtn');\n    const promoInput = document.getElementById('promoInput');\n    \n    if (applyPromoBtn) {\n        applyPromoBtn.addEventListener('click', function() {\n            const code = promoInput.value.toUpperCase().trim();\n            \n            if (promoCodes[code]) {\n                const discount = promoCodes[code];\n                localStorage.setItem('cart_discount', discount);\n                updateSummary();\n                showToast(`تم تطبيق كود الخصم! خصم ${discount} ر.ع`, 'success');\n                promoInput.value = '';\n            } else {\n                showToast('كود الخصم غير صحيح', 'error');\n            }\n        });\n    }\n    \n    // Clear cart\n    const clearCartBtn = document.getElementById('clearCartBtn');\n    if (clearCartBtn) {\n        clearCartBtn.addEventListener('click', function() {\n            if (confirm('هل أنت متأكد من إفراغ السلة؟')) {\n                cartData = [];\n                localStorage.removeItem('cart_discount');\n                loadCart();\n                showToast('تم إفراغ السلة', 'success');\n            }\n        });\n    }\n    \n    // Checkout\n    const checkoutBtn = document.getElementById('checkoutBtn');\n    if (checkoutBtn) {\n        checkoutBtn.addEventListener('click', function() {\n            if (cartData.length === 0) {\n                showToast('السلة فارغة', 'error');\n                return;\n            }\n            showToast('جاري تحويلك لصفحة الدفع...', 'info');\n            setTimeout(() => {\n                __setHref('checkout.html');\n            }, 1500);\n        });\n    }\n    \n    // Load cart and recommended\n    loadCart();\n    loadRecommended();\n});\n\n// ==================== Load Recommended ====================\nfunction loadRecommended() {\n    const grid = document.getElementById('recommendedProducts');\n    if (!grid) return;\n    \n    grid.innerHTML = recommendedProducts.map(product => `\n        <div class=\"recommended-item\">\n            <div class=\"recommended-image\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                    <circle cx=\"9\" cy=\"21\" r=\"1\"></circle>\n                    <circle cx=\"20\" cy=\"21\" r=\"1\"></circle>\n                    <path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path>\n                </svg>\n            </div>\n            <h4>${product.title}</h4>\n            <div class=\"price\">${product.price} ر.ع</div>\n            <button class=\"btn btn-outline btn-sm\" onclick=\"addToCart(${product.id})\">\n                <span data-ar=\"إضافة للسلة\" data-en=\"Add to Cart\">إضافة للسلة</span>\n            </button>\n        </div>\n    `).join('');\n}\n\nfunction addToCart(id) {\n    const product = recommendedProducts.find(p => p.id === id);\n    if (product) {\n        cartData.push({\n            ...product,\n            seller: 'بائع مميز',\n            quantity: 1\n        });\n        loadCart();\n        showToast('تمت الإضافة للسلة', 'success');\n    }\n}\n<\/script>\n<script>\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "chat": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>المحادثات - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* ==================== Chat Page Styles ==================== */\n\nbody {\n    background: var(--bg-color);\n}\n\n.chat-wrapper {\n    padding: var(--spacing-xl) 0;\n    min-height: calc(100vh - 70px);\n}\n\n.btn-back-rect {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--spacing-sm);\n    padding: 0.75rem 1.25rem;\n    background: var(--surface-color);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    color: var(--text-secondary);\n    font-size: 0.95rem;\n    font-weight: 600;\n    cursor: pointer;\n    transition: var(--transition-base);\n    text-decoration: none;\n    margin-bottom: var(--spacing-lg);\n}\n\n.btn-back-rect:hover {\n    border-color: var(--primary-color);\n    color: var(--primary-color);\n    background: rgba(33, 56, 81, 0.05);\n    transform: translateX(4px);\n}\n\n.btn-back-rect svg {\n    flex-shrink: 0;\n}\n\n.chat-container {\n    display: grid;\n    grid-template-columns: 380px 1fr;\n    height: 600px;\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    overflow: hidden;\n    box-shadow: var(--shadow-lg);\n}\n\n/* ==================== Sidebar ==================== */\n.chat-sidebar {\n    background: var(--surface-color);\n    border-left: 1px solid var(--border-color);\n    display: flex;\n    flex-direction: column;\n    height: 600px;\n}\n\n.chat-sidebar-header {\n    padding: var(--spacing-lg);\n    border-bottom: 1px solid var(--border-color);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    background: var(--surface-color);\n}\n\n.header-title {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-sm);\n}\n\n.header-title svg {\n    color: var(--primary-color);\n}\n\n.chat-sidebar-header h2 {\n    font-size: 1.35rem;\n    font-weight: 700;\n    color: var(--text-primary);\n}\n\n.chat-sidebar-header .btn-icon {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    border-radius: var(--radius-md);\n    color: var(--primary-color);\n    transition: var(--transition-base);\n}\n\n.chat-sidebar-header .btn-icon:hover {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    color: white;\n    transform: scale(1.05);\n}\n\n.chat-search {\n    padding: var(--spacing-md);\n    border-bottom: 1px solid var(--border-color);\n    position: relative;\n}\n\n.chat-search svg {\n    position: absolute;\n    right: var(--spacing-md);\n    top: 50%;\n    transform: translateY(-50%);\n    color: var(--text-secondary);\n    pointer-events: none;\n}\n\n.chat-search input {\n    width: 100%;\n    padding: 0.7rem 0.9rem 0.7rem 2.5rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-full);\n    font-size: 0.9rem;\n    background: var(--bg-color);\n    transition: var(--transition-base);\n}\n\n.chat-search input:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n.chat-list {\n    flex: 1;\n    overflow-y: auto;\n}\n\n.chat-item {\n    padding: var(--spacing-md);\n    border-bottom: 1px solid var(--border-color);\n    cursor: pointer;\n    transition: var(--transition-base);\n    display: flex;\n    gap: var(--spacing-sm);\n    align-items: center;\n}\n\n.chat-item:hover {\n    background: var(--bg-color);\n}\n\n.chat-item.active {\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    border-right: 3px solid var(--primary-color);\n}\n\n.chat-item-avatar {\n    width: 50px;\n    height: 50px;\n    border-radius: var(--radius-full);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    color: var(--primary-color);\n    position: relative;\n}\n\n.chat-item-avatar svg {\n    width: 24px;\n    height: 24px;\n}\n\n.chat-item-avatar .status-dot {\n    position: absolute;\n    bottom: 2px;\n    left: 2px;\n    width: 12px;\n    height: 12px;\n    background: var(--success-color);\n    border: 2px solid var(--surface-color);\n    border-radius: var(--radius-full);\n}\n\n.chat-item-info {\n    flex: 1;\n    min-width: 0;\n}\n\n.chat-item-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 0.25rem;\n}\n\n.chat-item-name {\n    font-weight: 600;\n    font-size: 0.95rem;\n    color: var(--text-primary);\n}\n\n.chat-item-time {\n    font-size: 0.75rem;\n    color: var(--text-secondary);\n}\n\n.chat-item-message {\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n}\n\n.chat-item-badge {\n    min-width: 20px;\n    height: 20px;\n    background: var(--primary-color);\n    color: white;\n    border-radius: var(--radius-full);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 0.7rem;\n    font-weight: 600;\n    padding: 0 0.4rem;\n}\n\n/* ==================== Main Chat Area ==================== */\n.chat-main {\n    display: flex;\n    flex-direction: column;\n    background: var(--surface-color);\n    height: 600px;\n}\n\n/* Empty State */\n.chat-empty {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    text-align: center;\n    padding: var(--spacing-2xl);\n}\n\n.empty-icon {\n    width: 120px;\n    height: 120px;\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    border-radius: var(--radius-full);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin-bottom: var(--spacing-lg);\n    color: var(--primary-color);\n}\n\n.chat-empty h3 {\n    font-size: 1.5rem;\n    font-weight: 700;\n    margin-bottom: var(--spacing-sm);\n    color: var(--text-primary);\n}\n\n.chat-empty p {\n    color: var(--text-secondary);\n    font-size: 0.95rem;\n}\n\n/* Chat Content */\n.chat-content {\n    display: flex;\n    flex-direction: column;\n    height: 600px;\n}\n\n.chat-header {\n    padding: var(--spacing-lg);\n    border-bottom: 1px solid var(--border-color);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    background: var(--surface-color);\n}\n\n.mobile-back-btn {\n    display: none;\n    padding: 0.5rem;\n    margin-left: var(--spacing-sm);\n    color: var(--text-secondary);\n    transition: var(--transition-fast);\n    border-radius: var(--radius-md);\n}\n\n.mobile-back-btn:hover {\n    background: var(--bg-color);\n    color: var(--primary-color);\n}\n\n.chat-user-info {\n    display: flex;\n    gap: var(--spacing-sm);\n    align-items: center;\n}\n\n.chat-avatar {\n    width: 50px;\n    height: 50px;\n    border-radius: var(--radius-full);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    color: var(--primary-color);\n}\n\n.user-details h3 {\n    font-size: 1rem;\n    font-weight: 600;\n    color: var(--text-primary);\n    margin-bottom: 0.2rem;\n}\n\n.chat-status {\n    font-size: 0.8rem;\n    color: var(--text-secondary);\n    display: flex;\n    align-items: center;\n    gap: 0.3rem;\n}\n\n.chat-status.online {\n    color: var(--success-color);\n}\n\n.chat-status.online::before {\n    content: '';\n    width: 8px;\n    height: 8px;\n    background: var(--success-color);\n    border-radius: var(--radius-full);\n    display: inline-block;\n}\n\n.chat-actions {\n    display: flex;\n    gap: var(--spacing-xs);\n}\n\n.chat-actions .btn-icon {\n    width: 36px;\n    height: 36px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: var(--text-secondary);\n    transition: var(--transition-base);\n    border-radius: var(--radius-md);\n}\n\n.chat-actions .btn-icon:hover {\n    background: var(--bg-color);\n    color: var(--primary-color);\n}\n\n/* Messages Area */\n.chat-messages {\n    flex: 1;\n    padding: var(--spacing-lg);\n    overflow-y: auto;\n    display: flex;\n    flex-direction: column;\n    gap: var(--spacing-md);\n    background: var(--bg-color);\n}\n\n.message {\n    max-width: 65%;\n    padding: 0.75rem 1rem;\n    border-radius: var(--radius-lg);\n    background: var(--surface-color);\n    box-shadow: var(--shadow-sm);\n    position: relative;\n    animation: messageSlide 0.3s ease;\n}\n\n@keyframes messageSlide {\n    from {\n        opacity: 0;\n        transform: translateY(10px);\n    }\n    to {\n        opacity: 1;\n        transform: translateY(0);\n    }\n}\n\n.message.received {\n    align-self: flex-start;\n    border-bottom-right-radius: 4px;\n}\n\n.message.sent {\n    align-self: flex-end;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    color: white;\n    border-bottom-left-radius: 4px;\n}\n\n.message-text {\n    font-size: 0.95rem;\n    line-height: 1.5;\n    margin-bottom: 0.3rem;\n}\n\n.message-time {\n    font-size: 0.7rem;\n    opacity: 0.7;\n    text-align: left;\n}\n\n.message.sent .message-time {\n    text-align: right;\n}\n\n.date-divider {\n    text-align: center;\n    margin: var(--spacing-md) 0;\n}\n\n.date-divider span {\n    background: var(--surface-color);\n    padding: 0.4rem 1rem;\n    border-radius: var(--radius-full);\n    font-size: 0.8rem;\n    color: var(--text-secondary);\n    box-shadow: var(--shadow-sm);\n}\n\n/* Input Area */\n.chat-input-area {\n    padding: var(--spacing-lg);\n    border-top: 1px solid var(--border-color);\n    display: flex;\n    gap: var(--spacing-sm);\n    align-items: center;\n    background: var(--surface-color);\n}\n\n.chat-input-area .btn-icon {\n    width: 40px;\n    height: 40px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: var(--text-secondary);\n    transition: var(--transition-base);\n    border-radius: var(--radius-md);\n}\n\n.chat-input-area .btn-icon:hover {\n    background: var(--bg-color);\n    color: var(--primary-color);\n}\n\n.chat-input-area input {\n    flex: 1;\n    padding: 0.875rem 1rem;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-full);\n    font-size: 0.95rem;\n    background: var(--bg-color);\n    transition: var(--transition-base);\n}\n\n.chat-input-area input:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n.btn-send {\n    width: 44px;\n    height: 44px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    color: white;\n    border-radius: var(--radius-full);\n    transition: var(--transition-base);\n    box-shadow: var(--shadow-colored);\n}\n\n.btn-send:hover {\n    transform: scale(1.05);\n    box-shadow: 0 8px 20px -5px rgba(33, 56, 81, 0.4);\n}\n\n.btn-send:active {\n    transform: scale(0.95);\n}\n\n/* ==================== Responsive ==================== */\n@media (max-width: 1024px) {\n    .chat-container {\n        grid-template-columns: 320px 1fr;\n    }\n}\n\n@media (max-width: 768px) {\n    .chat-wrapper {\n        padding: var(--spacing-md) 0;\n    }\n\n    .btn-back-rect {\n        width: 100%;\n        justify-content: center;\n    }\n\n    .chat-container {\n        grid-template-columns: 1fr;\n        height: 500px;\n    }\n    \n    .chat-sidebar {\n        display: flex;\n        height: 500px;\n    }\n    \n    .chat-sidebar.hidden {\n        display: none;\n    }\n    \n    .chat-content {\n        display: none;\n        height: 500px;\n    }\n    \n    .chat-content.active {\n        display: flex;\n    }\n    \n    .mobile-back-btn {\n        display: flex;\n    }\n    \n    .message {\n        max-width: 80%;\n    }\n}\n\n/* Scrollbar Styling */\n.chat-list::-webkit-scrollbar,\n.chat-messages::-webkit-scrollbar {\n    width: 6px;\n}\n\n.chat-list::-webkit-scrollbar-track,\n.chat-messages::-webkit-scrollbar-track {\n    background: transparent;\n}\n\n.chat-list::-webkit-scrollbar-thumb,\n.chat-messages::-webkit-scrollbar-thumb {\n    background: var(--border-color);\n    border-radius: var(--radius-full);\n}\n\n.chat-list::-webkit-scrollbar-thumb:hover,\n.chat-messages::-webkit-scrollbar-thumb:hover {\n    background: var(--text-secondary);\n}\n</style>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;display=swap\" rel=\"stylesheet\"/>\n</head>\n<body>\n<!-- Header -->\n<header class=\"header\">\n<div class=\"container\">\n<div class=\"header-content\">\n<div class=\"logo\">\n<a href=\"index.html\"><h1>حاذق</h1></a>\n</div>\n<nav class=\"header-nav\">\n<ul class=\"nav-links\">\n<li><a data-ar=\"الرئيسية\" data-en=\"Home\" href=\"index.html\">الرئيسية</a></li>\n<li><a data-ar=\"المواهب\" data-en=\"Talents\" href=\"talents.html\">المواهب</a></li>\n<li><a data-ar=\"المتجر\" data-en=\"Store\" href=\"store.html\">المتجر</a></li>\n<li><a data-ar=\"الورش\" data-en=\"Workshops\" href=\"workshops.html\">الورش</a></li>\n<li><a data-ar=\"المجتمع\" data-en=\"Community\" href=\"community.html\">المجتمع</a></li>\n</ul>\n</nav>\n<div class=\"header-actions\">\n<button class=\"lang-toggle\" id=\"langToggle\">\n<svg fill=\"none\" height=\"18\" نضم كموهوب\" data-en=\"Join\" href=\"register.html\">انضم كموهوب</a>\n</div>\n</div>\n<div class=\"chat-wrapper\">\n<div class=\"container\">\n<!-- Back Button -->\n<a class=\"btn-back-rect\" href=\"index.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M19 12H5M12 19l-7-7 7-7\"></path>\n</svg>\n<span data-ar=\"العودة للرئيسية\" data-en=\"Back to Home\">العودة للرئيسية</span>\n</a>\n<div class=\"chat-container\">\n<!-- Sidebar -->\n<aside class=\"chat-sidebar\">\n<div class=\"chat-sidebar-header\">\n<div class=\"header-title\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path>\n</svg>\n<h2 data-ar=\"المحادثات\" data-en=\"Messages\">المحادثات</h2>\n</div>\n<button class=\"btn-icon\" id=\"newChatBtn\" title=\"محادثة جديدة\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M12 5v14M5 12h14\"></path>\n</svg>\n</button>\n</div>\n<div class=\"chat-search\">\n<svg fill=\"none\" height=\"18\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"18\">\n<circle cx=\"11\" cy=\"11\" r=\"8\"></circle>\n<path d=\"m21 21-4.35-4.35\"></path>\n</svg>\n<input data-ar=\"بحث في المحادثات...\" data-en=\"Search messages...\" id=\"searchInput\" placeholder=\"بحث في المحادثات...\" type=\"text\"/>\n</div>\n<div class=\"chat-list\" id=\"chatList\">\n<!-- Chat items will be loaded here -->\n</div>\n</aside>\n<!-- Main Chat Area -->\n<main class=\"chat-main\">\n<!-- Empty State -->\n<div class=\"chat-empty\" id=\"chatEmpty\">\n<div class=\"empty-icon\">\n<svg fill=\"none\" height=\"80\" stroke=\"currentColor\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"80\">\n<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path>\n</svg>\n</div>\n<h3 data-ar=\"اختر محادثة للبدء\" data-en=\"Select a chat to start\">اختر محادثة للبدء</h3>\n<p data-ar=\"اختر محادثة من القائمة أو ابدأ محادثة جديدة\" data-en=\"Select a chat from the list or start a new conversation\">اختر محادثة من القائمة أو ابدأ محادثة جديدة</p>\n</div>\n<!-- Chat Content -->\n<div class=\"chat-content\" id=\"chatContent\" style=\"display: none;\">\n<div class=\"chat-header\">\n<button class=\"mobile-back-btn\" id=\"mobileBackBtn\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M19 12H5M12 19l-7-7 7-7\"></path>\n</svg>\n</button>\n<div class=\"chat-user-info\">\n<div class=\"chat-avatar\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"12\" cy=\"7\" r=\"4\"></circle>\n</svg>\n</div>\n<div class=\"user-details\">\n<h3 id=\"chatUserName\">أحمد المعمري</h3>\n<span class=\"chat-status online\" data-ar=\"متصل\" data-en=\"Online\">متصل</span>\n</div>\n</div>\n<div class=\"chat-actions\">\n<button class=\"btn-icon\" title=\"بحث\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<circle cx=\"11\" cy=\"11\" r=\"8\"></circle>\n<path d=\"m21 21-4.35-4.35\"></path>\n</svg>\n</button>\n<button class=\"btn-icon\" title=\"المزيد\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<circle cx=\"12\" cy=\"12\" r=\"1\"></circle>\n<circle cx=\"12\" cy=\"5\" r=\"1\"></circle>\n<circle cx=\"12\" cy=\"19\" r=\"1\"></circle>\n</svg>\n</button>\n</div>\n</div>\n<div class=\"chat-messages\" id=\"chatMessages\">\n<!-- Messages will be loaded here -->\n</div>\n<div class=\"chat-input-area\">\n<button class=\"btn-icon\" title=\"إرفاق ملف\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"></path>\n</svg>\n</button>\n<button class=\"btn-icon\" title=\"إضافة صورة\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<rect height=\"18\" rx=\"2\" ry=\"2\" width=\"18\" x=\"3\" y=\"3\"></rect>\n<circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"></circle>\n<polyline points=\"21 15 16 10 5 21\"></polyline>\n</svg>\n</button>\n<input data-ar=\"اكتب رسالتك...\" data-en=\"Type your message...\" id=\"messageInput\" placeholder=\"اكتب رسالتك...\" type=\"text\"/>\n<button class=\"btn-send\" id=\"sendBtn\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<line x1=\"22\" x2=\"11\" y1=\"2\" y2=\"13\"></line>\n<polygon points=\"22 2 15 22 11 13 2 9 22 2\"></polygon>\n</svg>\n</button>\n</div>\n</div>\n</main>\n</div>\n</div>\n</div>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>// ==================== Sample Chat Data ====================\nconst talentDirectory = [\n    { id: 101, name: 'سارة الزدجية', specialty: 'تصوير المناسبات والمنتجات', category: 'التصوير', online: true },\n    { id: 102, name: 'نواف الهنائي', specialty: 'تصميم الهوية البصرية', category: 'التصميم', online: true },\n    { id: 103, name: 'ريم السالمية', specialty: 'الكتابة الإبداعية والتسويق', category: 'الكتابة', online: false },\n    { id: 104, name: 'خالد القحطاني', specialty: 'المونتاج والتقنيات الحديثة', category: 'الفيديو', online: false }\n];\n\nconst chats = [\n    {\n        id: 1,\n        name: 'أحمد المعمري',\n        lastMessage: 'شكراً على التواصل، سأرسل لك التفاصيل قريباً',\n        time: '10:30',\n        unread: 2,\n        online: true,\n        recipientId: 101\n    },\n    {\n        id: 2,\n        name: 'فاطمة الحارثية',\n        lastMessage: 'متى يمكننا البدء بالمشروع؟',\n        time: '09:15',\n        unread: 0,\n        online: true,\n        recipientId: 102\n    },\n    {\n        id: 3,\n        name: 'سالم البلوشي',\n        lastMessage: 'تم إرسال الملفات المطلوبة',\n        time: 'أمس',\n        unread: 0,\n        online: false,\n        recipientId: 103\n    },\n    {\n        id: 4,\n        name: 'مريم الشحية',\n        lastMessage: 'هل يمكنك مراجعة التصميم؟',\n        time: 'أمس',\n        unread: 1,\n        online: false,\n        recipientId: 104\n    }\n];\n\nconst messagesByChat = {\n    1: [\n        { id: 1, text: 'مرحباً، كيف يمكنني مساعدتك؟', sent: false, time: '10:20' },\n        { id: 2, text: 'أريد الاستفسار عن خدمات التصوير الفوتوغرافي', sent: true, time: '10:22' },\n        { id: 3, text: 'بالتأكيد، أنا متخصص في التصوير الفوتوغرافي للمناسبات والمنتجات', sent: false, time: '10:25' },\n        { id: 4, text: 'رائع! ما هي الأسعار؟', sent: true, time: '10:28' },\n        { id: 5, text: 'شكراً على التواصل، سأرسل لك التفاصيل قريباً', sent: false, time: '10:30' }\n    ],\n    2: [\n        { id: 1, text: 'السلام عليكم', sent: false, time: '09:10' },\n        { id: 2, text: 'وعليكم السلام ورحمة الله', sent: true, time: '09:12' },\n        { id: 3, text: 'متى يمكننا البدء بالمشروع؟', sent: false, time: '09:15' }\n    ],\n    3: [\n        { id: 1, text: 'تم إرسال الملفات المطلوبة', sent: false, time: 'أمس 14:30' }\n    ],\n    4: [\n        { id: 1, text: 'هل يمكنك مراجعة التصميم؟', sent: false, time: 'أمس 16:45' }\n    ]\n};\n\n// ==================== DOM Elements ====================\nconst chatList = document.getElementById('chatList');\nconst chatMessages = document.getElementById('chatMessages');\nconst chatEmpty = document.getElementById('chatEmpty');\nconst chatContent = document.getElementById('chatContent');\nconst messageInput = document.getElementById('messageInput');\nconst sendBtn = document.getElementById('sendBtn');\nconst chatUserName = document.getElementById('chatUserName');\nconst mobileBackBtn = document.getElementById('mobileBackBtn');\nconst searchInput = document.getElementById('searchInput');\n\nlet currentChatId = null;\n\nfunction getSelectedTalentId() {\n    const params = new URLSearchParams(window.location.search);\n    const talentParam = params.get('user') || params.get('talent');\n    if (!talentParam) return null;\n    const parsed = Number(talentParam);\n    return Number.isFinite(parsed) ? parsed : null;\n}\n\nfunction getTalentById(id) {\n    return talentDirectory.find((talent) => talent.id === id) || null;\n}\n\nfunction ensureChatForTalent(talentId) {\n    const existingChat = chats.find((chat) => chat.recipientId === talentId);\n    if (existingChat) return existingChat;\n\n    const talent = getTalentById(talentId);\n    if (!talent) return null;\n\n    const newChat = {\n        id: Date.now(),\n        name: talent.name,\n        lastMessage: `أقدر أساعدك في ${talent.specialty}`,\n        time: 'الآن',\n        unread: 0,\n        online: talent.online,\n        recipientId: talent.id\n    };\n\n    chats.unshift(newChat);\n    messagesByChat[newChat.id] = [{ id: 1, text: `مرحباً، أنا ${talent.name}. أقدر أساعدك في ${talent.specialty}.`, sent: false, time: 'الآن' }];\n    return newChat;\n}\n\nfunction showEmptyState() {\n    const selectedTalentId = getSelectedTalentId();\n    const selectedTalent = selectedTalentId ? getTalentById(selectedTalentId) : null;\n    const emptyTitle = chatEmpty.querySelector('h3');\n    const emptyText = chatEmpty.querySelector('p');\n\n    if (selectedTalent) {\n        if (emptyTitle) emptyTitle.textContent = `ابدأ محادثة مع ${selectedTalent.name}`;\n        if (emptyText) emptyText.textContent = 'أرسل رسالتك الآن وسيبدأ التواصل مباشرة مع الموهوب.';\n    } else {\n        if (emptyTitle) emptyTitle.textContent = 'اختر محادثة للبدء';\n        if (emptyText) emptyText.textContent = 'اختر محادثة من القائمة أو ابدأ محادثة جديدة';\n    }\n\n    chatEmpty.style.display = 'flex';\n    chatContent.style.display = 'none';\n}\n\n// ==================== Render Functions ====================\nfunction renderChatList(filter = '') {\n    const normalizedFilter = filter.toLowerCase().trim();\n    const filteredChats = chats.filter((chat) => {\n        const combinedText = `${chat.name} ${chat.lastMessage}`.toLowerCase();\n        return combinedText.includes(normalizedFilter);\n    });\n\n    if (!chatList) return;\n\n    chatList.innerHTML = filteredChats.map((chat) => `\n        <div class=\"chat-item ${chat.id === currentChatId ? 'active' : ''}\" data-chat-id=\"${chat.id}\">\n            <div class=\"chat-item-avatar\">\n                <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                    <path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path>\n                    <circle cx=\"12\" cy=\"7\" r=\"4\"></circle>\n                </svg>\n                ${chat.online ? '<span class=\"status-dot\"></span>' : ''}\n            </div>\n            <div class=\"chat-item-info\">\n                <div class=\"chat-item-header\">\n                    <span class=\"chat-item-name\">${chat.name}</span>\n                    <span class=\"chat-item-time\">${chat.time}</span>\n                </div>\n                <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;\">\n                    <span class=\"chat-item-message\">${chat.lastMessage}</span>\n                    ${chat.unread > 0 ? `<span class=\"chat-item-badge\">${chat.unread}</span>` : ''}\n                </div>\n            </div>\n        </div>\n    `).join('');\n\n    document.querySelectorAll('.chat-item').forEach((item) => {\n        item.addEventListener('click', () => {\n            const chatId = parseInt(item.dataset.chatId, 10);\n            openChat(chatId);\n        });\n    });\n}\n\nfunction renderMessages(chatId) {\n    const messages = messagesByChat[chatId] || [];\n\n    if (messages.length === 0) {\n        chatMessages.innerHTML = '<div class=\"date-divider\"><span>لا توجد رسائل</span></div>';\n        return;\n    }\n\n    chatMessages.innerHTML = `\n        <div class=\"date-divider\"><span>اليوم</span></div>\n        ${messages.map((msg) => `\n            <div class=\"message ${msg.sent ? 'sent' : 'received'}\">\n                <div class=\"message-text\">${msg.text}</div>\n                <div class=\"message-time\">${msg.time}</div>\n            </div>\n        `).join('')}\n    `;\n\n    chatMessages.scrollTop = chatMessages.scrollHeight;\n}\n\nfunction openChat(chatId) {\n    currentChatId = chatId;\n    const chat = chats.find((item) => item.id === chatId);\n\n    if (!chat) return;\n\n    chatEmpty.style.display = 'none';\n    chatContent.style.display = 'flex';\n    chatUserName.textContent = chat.name;\n\n    const statusElement = chatContent.querySelector('.chat-status');\n    if (statusElement) {\n        if (chat.online) {\n            statusElement.classList.add('online');\n            statusElement.textContent = 'متصل';\n            statusElement.setAttribute('data-ar', 'متصل');\n            statusElement.setAttribute('data-en', 'Online');\n        } else {\n            statusElement.classList.remove('online');\n            statusElement.textContent = 'غير متصل';\n            statusElement.setAttribute('data-ar', 'غير متصل');\n            statusElement.setAttribute('data-en', 'Offline');\n        }\n    }\n\n    chat.unread = 0;\n    renderMessages(chatId);\n    renderChatList();\n\n    if (window.innerWidth <= 768) {\n        document.querySelector('.chat-sidebar').classList.add('hidden');\n    }\n}\n\nfunction sendMessage() {\n    const text = messageInput.value.trim();\n\n    if (!text || !currentChatId) return;\n\n    const newMessage = {\n        id: Date.now(),\n        text: text,\n        sent: true,\n        time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })\n    };\n\n    if (!messagesByChat[currentChatId]) {\n        messagesByChat[currentChatId] = [];\n    }\n    messagesByChat[currentChatId].push(newMessage);\n\n    const chat = chats.find((item) => item.id === currentChatId);\n    if (chat) {\n        chat.lastMessage = text;\n        chat.time = 'الآن';\n    }\n\n    messageInput.value = '';\n    renderMessages(currentChatId);\n    renderChatList();\n\n    const chatReply = chat ? `شكراً على رسالتك، سأرد عليك خلال قليل.` : 'تم استلام رسالتك وسأرد عليك قريباً.';\n    window.setTimeout(() => {\n        if (!messagesByChat[currentChatId]) {\n            messagesByChat[currentChatId] = [];\n        }\n        messagesByChat[currentChatId].push({\n            id: Date.now() + 1,\n            text: chatReply,\n            sent: false,\n            time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })\n        });\n        if (chat) {\n            chat.lastMessage = chatReply;\n            chat.time = 'الآن';\n        }\n        renderMessages(currentChatId);\n        renderChatList();\n    }, 900);\n}\n\n// ==================== Event Listeners ====================\ndocument.addEventListener('DOMContentLoaded', () => {\n    renderChatList();\n\n    const selectedTalentId = getSelectedTalentId();\n    const initialChat = selectedTalentId ? ensureChatForTalent(selectedTalentId) : chats[0];\n\n    if (initialChat) {\n        openChat(initialChat.id);\n    } else {\n        showEmptyState();\n    }\n\n    if (sendBtn) {\n        sendBtn.addEventListener('click', sendMessage);\n    }\n\n    if (messageInput) {\n        messageInput.addEventListener('keypress', (e) => {\n            if (e.key === 'Enter') {\n                sendMessage();\n            }\n        });\n    }\n\n    if (mobileBackBtn) {\n        mobileBackBtn.addEventListener('click', () => {\n            chatContent.style.display = 'none';\n            chatContent.classList.remove('active');\n            document.querySelector('.chat-sidebar').classList.remove('hidden');\n            currentChatId = null;\n        });\n    }\n\n    if (searchInput) {\n        searchInput.addEventListener('input', (e) => {\n            renderChatList(e.target.value);\n        });\n    }\n\n    const newChatBtn = document.getElementById('newChatBtn');\n    if (newChatBtn) {\n        newChatBtn.addEventListener('click', () => {\n            const nextTalent = talentDirectory[0];\n            const newChat = ensureChatForTalent(nextTalent.id);\n            if (newChat) {\n                openChat(newChat.id);\n            }\n        });\n    }\n});\n\nwindow.addEventListener('resize', () => {\n    if (window.innerWidth > 768) {\n        document.querySelector('.chat-sidebar').classList.remove('hidden');\n        if (currentChatId) {\n            chatContent.style.display = 'flex';\n        }\n    }\n});\n<\/script>\n<script>\n        // Load footer component\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "notifications": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>الإشعارات - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* ==================== Notifications Page Styles ==================== */\n\n.notifications-wrapper {\n    padding: var(--spacing-xl) 0;\n    min-height: calc(100vh - 200px);\n}\n\n.notification-badge {\n    position: absolute;\n    top: -4px;\n    right: -4px;\n    background: var(--error-color);\n    color: white;\n    font-size: 0.65rem;\n    font-weight: 700;\n    padding: 0.125rem 0.375rem;\n    border-radius: var(--radius-full);\n    min-width: 18px;\n    text-align: center;\n}\n\n.notifications-container {\n    max-width: 800px;\n    margin: var(--spacing-xl) auto 0;\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    box-shadow: var(--shadow-sm);\n    border: 2px solid var(--border-color);\n    overflow: hidden;\n}\n\n/* Notifications Header */\n.notifications-header {\n    padding: var(--spacing-lg);\n    border-bottom: 2px solid var(--border-color);\n    background: var(--bg-color);\n}\n\n.filter-tabs {\n    display: flex;\n    gap: var(--spacing-xs);\n    margin-bottom: var(--spacing-md);\n    overflow-x: auto;\n    padding-bottom: var(--spacing-xs);\n}\n\n.filter-tab {\n    padding: var(--spacing-sm) var(--spacing-md);\n    background: transparent;\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-full);\n    font-size: 0.9rem;\n    font-weight: 500;\n    color: var(--text-secondary);\n    cursor: pointer;\n    transition: var(--transition-base);\n    white-space: nowrap;\n}\n\n.filter-tab:hover {\n    border-color: var(--primary-color);\n    color: var(--primary-color);\n}\n\n.filter-tab.active {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    border-color: transparent;\n    color: white;\n}\n\n.header-actions {\n    display: flex;\n    gap: var(--spacing-sm);\n    flex-wrap: wrap;\n}\n\n/* Notifications List */\n.notifications-list {\n    max-height: 600px;\n    overflow-y: auto;\n}\n\n.notification-item {\n    display: flex;\n    gap: var(--spacing-md);\n    padding: var(--spacing-md) var(--spacing-lg);\n    border-bottom: 1px solid var(--border-color);\n    transition: var(--transition-fast);\n    cursor: pointer;\n    position: relative;\n}\n\n.notification-item:hover {\n    background: var(--bg-color);\n}\n\n.notification-item.unread {\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.03) 0%, rgba(161, 124, 26, 0.03) 100%);\n}\n\n.notification-item.unread::before {\n    content: '';\n    position: absolute;\n    right: 0;\n    top: 0;\n    bottom: 0;\n    width: 4px;\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n}\n\n.notification-icon {\n    width: 48px;\n    height: 48px;\n    border-radius: var(--radius-full);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n}\n\n.notification-icon.message {\n    background: rgba(33, 56, 81, 0.1);\n    color: #213851;\n}\n\n.notification-icon.order {\n    background: rgba(161, 124, 26, 0.1);\n    color: #ec4899;\n}\n\n.notification-icon.system {\n    background: rgba(245, 158, 11, 0.1);\n    color: #f59e0b;\n}\n\n.notification-icon.success {\n    background: rgba(16, 185, 129, 0.1);\n    color: #10b981;\n}\n\n.notification-icon svg {\n    width: 24px;\n    height: 24px;\n}\n\n.notification-content {\n    flex: 1;\n    min-width: 0;\n}\n\n.notification-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    margin-bottom: 0.25rem;\n}\n\n.notification-title {\n    font-size: 0.95rem;\n    font-weight: 600;\n    color: var(--text-primary);\n}\n\n.notification-time {\n    font-size: 0.75rem;\n    color: var(--text-muted);\n    white-space: nowrap;\n}\n\n.notification-message {\n    font-size: 0.9rem;\n    color: var(--text-secondary);\n    line-height: 1.5;\n    margin-bottom: 0.5rem;\n}\n\n.notification-actions {\n    display: flex;\n    gap: var(--spacing-xs);\n    margin-top: var(--spacing-sm);\n}\n\n.notification-action-btn {\n    padding: 0.375rem 0.75rem;\n    font-size: 0.8rem;\n    font-weight: 500;\n    border-radius: var(--radius-md);\n    border: none;\n    cursor: pointer;\n    transition: var(--transition-fast);\n}\n\n.notification-action-btn.primary {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n    color: white;\n}\n\n.notification-action-btn.primary:hover {\n    transform: translateY(-1px);\n    box-shadow: var(--shadow-sm);\n}\n\n.notification-action-btn.secondary {\n    background: var(--bg-color);\n    color: var(--text-secondary);\n    border: 1px solid var(--border-color);\n}\n\n.notification-action-btn.secondary:hover {\n    background: var(--border-color);\n}\n\n.notification-delete {\n    width: 32px;\n    height: 32px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: var(--radius-md);\n    background: transparent;\n    border: none;\n    color: var(--text-muted);\n    cursor: pointer;\n    transition: var(--transition-fast);\n    flex-shrink: 0;\n}\n\n.notification-delete:hover {\n    background: rgba(239, 68, 68, 0.1);\n    color: var(--error-color);\n}\n\n.notification-delete svg {\n    width: 18px;\n    height: 18px;\n}\n\n/* Empty State */\n.notifications-empty {\n    text-align: center;\n    padding: var(--spacing-2xl);\n}\n\n.notifications-empty svg {\n    stroke: var(--text-muted);\n    margin: 0 auto var(--spacing-lg);\n}\n\n.notifications-empty h3 {\n    font-size: 1.5rem;\n    font-weight: 700;\n    margin-bottom: var(--spacing-sm);\n    color: var(--text-primary);\n}\n\n.notifications-empty p {\n    color: var(--text-secondary);\n}\n\n/* Responsive */\n@media (max-width: 768px) {\n    .notifications-container {\n        border-radius: 0;\n        border-left: none;\n        border-right: none;\n    }\n    \n    .notifications-header {\n        padding: var(--spacing-md);\n    }\n    \n    .header-actions {\n        flex-direction: column;\n    }\n    \n    .header-actions .btn {\n        width: 100%;\n    }\n    \n    .notification-item {\n        padding: var(--spacing-md);\n    }\n    \n    .notification-icon {\n        width: 40px;\n        height: 40px;\n    }\n    \n    .notification-icon svg {\n        width: 20px;\n        height: 20px;\n    }\n    \n    .notification-actions {\n        flex-direction: column;\n    }\n    \n    .notification-action-btn {\n        width: 100%;\n    }\n}\n</style>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;display=swap\" rel=\"stylesheet\"/>\n</head>\n<body>\n<!-- Header -->\n<header class=\"header\">\n<div class=\"container\">\n<div class=\"header-content\">\n<div class=\"logo\">\n<a href=\"index.html\"><h1>حاذق</h1></a>\n</div>\n<nav class=\"header-nav\">\n<ul class=\"nav-links\">\n<li><a data-ar=\"الرئيسية\" data-en=\"Home\" href=\"index.html\">الرئيسية</a></li>\n<li><a data-ar=\"المواهب\" data-en=\"Talents\" href=\"talents.html\">المواهب</a></li>\n<li><a data-ar=\"المتجر\" data-en=\"Store\" href=\"store.html\">المتجر</a></li>\n<li><a data-ar=\"الورش\" data-en=\"Workshops\" href=\"workshops.html\">الورش</a></li>\n<li><a data-ar=\"المجتمع\" data-en=\"Community\" href=\"community.html\">المجتمع</a></li>\n</ul>\n</nav>\n<div class=\"header-actions\">\n<button class=\"lang-toggle\" id=\"langToggle\">\n<svg fill=\"none\" height=\"18\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"18\">\n<circle cx=\"12\" cy=\"12\" r=\"10\"></circle>\n<line x1=\"2\" x2=\"22\" y1=\"12\" y2=\"12\"></line>\n<path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"></path>\n</svg>\n<span class=\"lang-text\">EN</span>\n</button>\n<a class=\"icon-btn active\" href=\"notifications.html\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"></path>\n<path d=\"M13.73 21a2 2 0 0 1-3.46 0\"></path>\n</svg>\n<span class=\"notification-badge\" id=\"notificationBadge\">5</span>\n</a>\n<a class=\"icon-btn\" href=\"chat.html\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path>\n</svg>\n</a>\n<a class=\"icon-btn\" href=\"dashboard.html\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path>\n<circle cx=\"12\" cy=\"7\" r=\"4\"></circle>\n</svg>\n</a>\n<button class=\"menu-btn\">\n<span></span>\n<span></span>\n<span></span>\n</button>\n</div>\n</div>\n</div>\n</header>\n<!-- Mobile Menu -->\n<div class=\"mobile-menu\">\n<div class=\"mobile-menu-header\">\n<h2 data-ar=\"القائمة\" data-en=\"Menu\">القائمة</h2>\n<button class=\"mobile-menu-close\">\n<svg fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"24\">\n<line x1=\"18\" x2=\"6\" y1=\"6\" y2=\"18\"></line>\n<line x1=\"6\" x2=\"18\" y1=\"6\" y2=\"18\"></line>\n</svg>\n</button>\n</div>\n<nav class=\"mobile-nav\">\n<a class=\"nav-link\" href=\"index.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"></path>\n</svg>\n<span data-ar=\"الرئيسية\" data-en=\"Home\">الرئيسية</span>\n</a>\n<a class=\"nav-link active\" href=\"notifications.html\">\n<svg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"></path>\n<path d=\"M13.73 21a2 2 0 0 1-3.46 0\"></path>\n</svg>\n<span data-ar=\"الإشعارات\" data-en=\"Notifications\">الإشعارات</span>\n</a>\n</nav>\n</div>\n<button class=\"btn-back-circle\" onclick=\"window.history.back()\">\n<svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\">\n<path d=\"M19 12H5M12 19l-7-7 7-7\"></path>\n</svg>\n</button>\n<!-- Notifications Content -->\n<div class=\"notifications-wrapper\">\n<div class=\"container\">\n<div class=\"page-header\">\n<h1 class=\"page-title\" data-ar=\"الإشعارات\" data-en=\"Notifications\">الإشعارات</h1>\n<p class=\"page-subtitle\" data-ar=\"تابع آخر التحديثات والأنشطة\" data-en=\"Stay updated with latest activities\">تابع آخر التحديثات والأنشطة</p>\n</div>\n<div class=\"notifications-container\">\n<!-- Notifications Header -->\n<div class=\"notifications-header\">\n<div class=\"filter-tabs\">\n<button class=\"filter-tab active\" data-ar=\"الكل\" data-en=\"All\" data-filter=\"all\">الكل</button>\n<button class=\"filter-tab\" data-ar=\"غير مقروءة\" data-en=\"Unread\" data-filter=\"unread\">غير مقروءة</button>\n<button class=\"filter-tab\" data-ar=\"رسائل\" data-en=\"Messages\" data-filter=\"messages\">رسائل</button>\n<button class=\"filter-tab\" data-ar=\"طلبات\" data-en=\"Orders\" data-filter=\"orders\">طلبات</button>\n<button class=\"filter-tab\" data-ar=\"النظام\" data-en=\"System\" data-filter=\"system\">النظام</button>\n</div>\n<div class=\"header-actions\">\n<button class=\"btn btn-text\" data-ar=\"تعليم الكل كمقروء\" data-en=\"Mark All as Read\" id=\"markAllReadBtn\">تعليم الكل كمقروء</button>\n<button class=\"btn btn-text\" data-ar=\"مسح الكل\" data-en=\"Clear All\" id=\"clearAllBtn\">مسح الكل</button>\n</div>\n</div>\n<!-- Notifications List -->\n<div class=\"notifications-list\" id=\"notificationsList\">\n<!-- Notifications will be loaded here -->\n</div>\n<!-- Empty State -->\n<div class=\"notifications-empty\" id=\"notificationsEmpty\" style=\"display: none;\">\n<svg fill=\"none\" height=\"80\" stroke=\"currentColor\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"80\">\n<path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"></path>\n<path d=\"M13.73 21a2 2 0 0 1-3.46 0\"></path>\n</svg>\n<h3 data-ar=\"لا توجد إشعارات\" data-en=\"No Notifications\">لا توجد إشعارات</h3>\n<p data-ar=\"ستظهر إشعاراتك هنا\" data-en=\"Your notifications will appear here\">ستظهر إشعاراتك هنا</p>\n</div>\n</div>\n</div>\n</div>\n<!-- Footer -->\n<div id=\"footer-container\"></div>\n<script src=\"__SHARED_JS_main.js__\"><\/script>\n<script src=\"__SHARED_JS_footer-loader.js__\"><\/script>\n<script>// ==================== Notifications Data ====================\nlet notificationsData = [\n    {\n        id: 1,\n        type: 'message',\n        title: 'رسالة جديدة',\n        message: 'أرسل لك فاطمة الحارثية رسالة جديدة',\n        time: 'منذ 5 دقائق',\n        unread: true,\n        actions: [\n            { text: 'عرض الرسالة', link: 'chat.html' }\n        ]\n    },\n    {\n        id: 2,\n        type: 'order',\n        title: 'طلب جديد',\n        message: 'لديك طلب جديد من سالم البلوشي لتصميم شعار',\n        time: 'منذ ساعة',\n        unread: true,\n        actions: [\n            { text: 'عرض الطلب', link: 'dashboard.html' },\n            { text: 'قبول', action: 'accept' }\n        ]\n    },\n    {\n        id: 3,\n        type: 'success',\n        title: 'تم إكمال الطلب',\n        message: 'تم إكمال طلبك من أحمد المعمري بنجاح',\n        time: 'منذ 3 ساعات',\n        unread: true,\n        actions: [\n            { text: 'تقييم', action: 'rate' }\n        ]\n    },\n    {\n        id: 4,\n        type: 'system',\n        title: 'تحديث النظام',\n        message: 'تم إضافة ميزات جديدة للمنصة، تحقق منها الآن',\n        time: 'منذ 5 ساعات',\n        unread: false,\n        actions: [\n            { text: 'اكتشف المزيد', link: 'index.html' }\n        ]\n    },\n    {\n        id: 5,\n        type: 'message',\n        title: 'رسالة جديدة',\n        message: 'أرسل لك خالد الهنائي رسالة جديدة',\n        time: 'أمس',\n        unread: false,\n        actions: [\n            { text: 'عرض الرسالة', link: 'chat.html' }\n        ]\n    }\n];\n\nlet currentFilter = 'all';\n\n// ==================== Load Notifications ====================\nfunction loadNotifications() {\n    const list = document.getElementById('notificationsList');\n    const empty = document.getElementById('notificationsEmpty');\n    const badge = document.getElementById('notificationBadge');\n    \n    if (!list) return;\n    \n    let filteredNotifications = notificationsData;\n    \n    // Apply filter\n    if (currentFilter === 'unread') {\n        filteredNotifications = notificationsData.filter(n => n.unread);\n    } else if (currentFilter !== 'all') {\n        filteredNotifications = notificationsData.filter(n => n.type === currentFilter || n.type === currentFilter + 's');\n    }\n    \n    // Update badge\n    const unreadCount = notificationsData.filter(n => n.unread).length;\n    if (badge) {\n        badge.textContent = unreadCount;\n        badge.style.display = unreadCount > 0 ? 'block' : 'none';\n    }\n    \n    // Save to localStorage for header badge\n    localStorage.setItem('unread_notifications', unreadCount);\n    \n    // Show empty state if no notifications\n    if (filteredNotifications.length === 0) {\n        list.style.display = 'none';\n        empty.style.display = 'block';\n        return;\n    }\n    \n    list.style.display = 'block';\n    empty.style.display = 'none';\n    \n    // Render notifications\n    list.innerHTML = filteredNotifications.map(notification => `\n        <div class=\"notification-item ${notification.unread ? 'unread' : ''}\" data-id=\"${notification.id}\">\n            <div class=\"notification-icon ${notification.type}\">\n                ${getNotificationIcon(notification.type)}\n            </div>\n            <div class=\"notification-content\">\n                <div class=\"notification-header\">\n                    <div class=\"notification-title\">${notification.title}</div>\n                    <div class=\"notification-time\">${notification.time}</div>\n                </div>\n                <div class=\"notification-message\">${notification.message}</div>\n                ${notification.actions && notification.actions.length > 0 ? `\n                    <div class=\"notification-actions\">\n                        ${notification.actions.map(action => `\n                            <button class=\"notification-action-btn ${action.link ? 'primary' : 'secondary'}\" \n                                    onclick=\"${action.link ? `__setHref('${action.link}'` : `handleAction('${action.action}', ${notification.id})`}\">\n                                ${action.text}\n                            </button>\n                        `).join('')}\n                    </div>\n                ` : ''}\n            </div>\n            <button class=\"notification-delete\" onclick=\"deleteNotification(${notification.id})\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                    <line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"></line>\n                    <line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"></line>\n                </svg>\n            </button>\n        </div>\n    `).join(''));\n    \n    // Add click event to mark as read\n    document.querySelectorAll('.notification-item').forEach(item => {\n        item.addEventListener('click', function(e) {\n            if (!e.target.closest('.notification-delete') && !e.target.closest('.notification-action-btn')) {\n                const id = parseInt(this.getAttribute('data-id'));\n                markAsRead(id);\n            }\n        });\n    });\n}\n\nfunction getNotificationIcon(type) {\n    const icons = {\n        'message': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path></svg>',\n        'order': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></svg>',\n        'system': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"></line></svg>',\n        'success': '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg>'\n    };\n    return icons[type] || icons['system'];\n}\n\n\nfunction markAsRead(id) {\n    const notification = notificationsData.find(n => n.id === id);\n    if (notification) {\n        notification.unread = false;\n        loadNotifications();\n    }\n}\n\nfunction deleteNotification(id) {\n    notificationsData = notificationsData.filter(n => n.id !== id);\n    loadNotifications();\n    showToast('تم حذف الإشعار', 'success');\n}\n\nfunction handleAction(action, id) {\n    const notification = notificationsData.find(n => n.id === id);\n    \n    if (action === 'accept') {\n        showToast('تم قبول الطلب', 'success');\n        deleteNotification(id);\n    } else if (action === 'rate') {\n        showToast('شكراً لتقييمك', 'success');\n        deleteNotification(id);\n    }\n}\n\n// ==================== Event Listeners ====================\ndocument.addEventListener('DOMContentLoaded', function() {\n    // Filter tabs\n    const filterTabs = document.querySelectorAll('.filter-tab');\n    filterTabs.forEach(tab => {\n        tab.addEventListener('click', function() {\n            filterTabs.forEach(t => t.classList.remove('active'));\n            this.classList.add('active');\n            currentFilter = this.getAttribute('data-filter');\n            loadNotifications();\n        });\n    });\n    \n    // Mark all as read\n    const markAllReadBtn = document.getElementById('markAllReadBtn');\n    if (markAllReadBtn) {\n        markAllReadBtn.addEventListener('click', function() {\n            notificationsData.forEach(n => n.unread = false);\n            loadNotifications();\n            showToast('تم تعليم جميع الإشعارات كمقروءة', 'success');\n        });\n    }\n    \n    // Clear all\n    const clearAllBtn = document.getElementById('clearAllBtn');\n    if (clearAllBtn) {\n        clearAllBtn.addEventListener('click', function() {\n            if (confirm('هل أنت متأكد من حذف جميع الإشعارات؟')) {\n                notificationsData = [];\n                loadNotifications();\n                showToast('تم حذف جميع الإشعارات', 'success');\n            }\n        });\n    }\n    \n    // Load notifications\n    loadNotifications();\n});\n<\/script>\n<script>\n        fetch('components/footer.html')\n            .then(response => response.text())\n            .then(data => {\n                document.getElementById('footer-container').innerHTML = data;\n            });\n    <\/script>\n\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href');\n    if(!href) return;\n    if(/^https?:\\/\\//i.test(href) || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;\n    var path = href.split('?')[0].split('#')[0];\n    var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n    if(m){\n      e.preventDefault();\n      var q = href.indexOf('?') !== -1 ? href.split('?')[1].split('#')[0] : '';\n      window.parent.postMessage({type:'navigate', page:m[1], query:q}, '*');\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n", "settings": "<!DOCTYPE html>\n\n<html dir=\"rtl\" lang=\"ar\">\n<head>\n<script>\n(function(){\n  function pageKeyFromUrl(u){\n    try{\n      var path = String(u).split('?')[0].split('#')[0];\n      var m = path.match(/([a-zA-Z0-9_\\-]+)\\.html$/);\n      return m ? m[1] : null;\n    }catch(e){ return null; }\n  }\n  window.__setHref = function(u){\n    var key = pageKeyFromUrl(u);\n    if(key){\n      var q = '';\n      var s = String(u);\n      if(s.indexOf('?') !== -1) q = s.split('?')[1].split('#')[0];\n      try{ window.parent.postMessage({type:'navigate', page:key, query:q}, '*'); }catch(e){}\n      return;\n    }\n    try{ window.location.href = u; }catch(e){}\n  };\n})();\n<\/script>\n\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>الإعدادات - حاذق</title>\n<link href=\"__SHARED_CSS_style.css__\" rel=\"stylesheet\"/>\n<style>/* ==================== Settings Page Styles ==================== */\n\n.settings-wrapper {\n    padding: var(--spacing-xl) 0;\n    min-height: calc(100vh - 200px);\n}\n\n.settings-grid {\n    display: grid;\n    grid-template-columns: 280px 1fr;\n    gap: var(--spacing-xl);\n    margin-top: var(--spacing-xl);\n}\n\n/* Settings Sidebar */\n.settings-sidebar {\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    padding: var(--spacing-md);\n    box-shadow: var(--shadow-sm);\n    border: 2px solid var(--border-color);\n    height: fit-content;\n    position: sticky;\n    top: 90px;\n}\n\n.settings-nav {\n    display: flex;\n    flex-direction: column;\n    gap: var(--spacing-xs);\n}\n\n.settings-nav-item {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-sm);\n    padding: var(--spacing-sm) var(--spacing-md);\n    border-radius: var(--radius-md);\n    color: var(--text-secondary);\n    font-weight: 500;\n    font-size: 0.9rem;\n    transition: var(--transition-fast);\n    text-decoration: none;\n}\n\n.settings-nav-item:hover {\n    background: var(--bg-color);\n    color: var(--text-primary);\n}\n\n.settings-nav-item.active {\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n    color: var(--primary-color);\n}\n\n.settings-nav-item svg {\n    flex-shrink: 0;\n}\n\n/* Settings Content */\n.settings-content {\n    background: var(--surface-color);\n    border-radius: var(--radius-xl);\n    padding: var(--spacing-xl);\n    box-shadow: var(--shadow-sm);\n    border: 2px solid var(--border-color);\n}\n\n.settings-section {\n    display: none;\n}\n\n.settings-section.active {\n    display: block;\n}\n\n.settings-section h2 {\n    font-size: 1.5rem;\n    font-weight: 700;\n    margin-bottom: var(--spacing-xl);\n    color: var(--text-primary);\n}\n\n/* Setting Group */\n.setting-group {\n    margin-bottom: var(--spacing-lg);\n}\n\n.setting-group label {\n    display: block;\n    margin-bottom: var(--spacing-xs);\n    font-weight: 600;\n    color: var(--text-primary);\n    font-size: 0.9rem;\n}\n\n.setting-input,\n.setting-textarea,\n.setting-select {\n    width: 100%;\n    padding: var(--spacing-sm) var(--spacing-md);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-md);\n    font-size: 0.95rem;\n    transition: var(--transition-base);\n    font-family: inherit;\n}\n\n.setting-input:focus,\n.setting-textarea:focus,\n.setting-select:focus {\n    outline: none;\n    border-color: var(--primary-color);\n    box-shadow: 0 0 0 3px rgba(33, 56, 81, 0.1);\n}\n\n.setting-textarea {\n    resize: vertical;\n    min-height: 100px;\n}\n\n/* Setting Toggle */\n.setting-toggle {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: var(--spacing-md);\n    background: var(--bg-color);\n    border-radius: var(--radius-lg);\n    margin-bottom: var(--spacing-md);\n    border: 2px solid var(--border-color);\n    transition: var(--transition-fast);\n}\n\n.setting-toggle:hover {\n    border-color: var(--primary-color);\n}\n\n.toggle-info h3 {\n    font-size: 0.95rem;\n    font-weight: 600;\n    margin-bottom: 0.25rem;\n    color: var(--text-primary);\n}\n\n.toggle-info p {\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n}\n\n/* Toggle Switch */\n.toggle-switch {\n    position: relative;\n    display: inline-block;\n    width: 50px;\n    height: 28px;\n    flex-shrink: 0;\n}\n\n.toggle-switch input {\n    opacity: 0;\n    width: 0;\n    height: 0;\n}\n\n.toggle-slider {\n    position: absolute;\n    cursor: pointer;\n    top: 0;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    background-color: var(--border-color);\n    transition: var(--transition-base);\n    border-radius: var(--radius-full);\n}\n\n.toggle-slider:before {\n    position: absolute;\n    content: \"\";\n    height: 20px;\n    width: 20px;\n    left: 4px;\n    bottom: 4px;\n    background-color: white;\n    transition: var(--transition-base);\n    border-radius: var(--radius-full);\n}\n\n.toggle-switch input:checked + .toggle-slider {\n    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);\n}\n\n.toggle-switch input:checked + .toggle-slider:before {\n    transform: translateX(22px);\n}\n\n/* Theme Options */\n.theme-options {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: var(--spacing-md);\n    margin-top: var(--spacing-sm);\n}\n\n.theme-option {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: var(--spacing-sm);\n    padding: var(--spacing-lg);\n    background: var(--bg-color);\n    border: 2px solid var(--border-color);\n    border-radius: var(--radius-lg);\n    cursor: pointer;\n    transition: var(--transition-base);\n}\n\n.theme-option:hover {\n    border-color: var(--primary-color);\n    transform: translateY(-2px);\n}\n\n.theme-option.active {\n    border-color: var(--primary-color);\n    background: linear-gradient(135deg, rgba(33, 56, 81, 0.1) 0%, rgba(161, 124, 26, 0.1) 100%);\n}\n\n.theme-option svg {\n    stroke: var(--primary-color);\n}\n\n.theme-option span {\n    font-weight: 600;\n    color: var(--text-primary);\n    font-size: 0.9rem;\n}\n\n/* Social Account */\n.social-account {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: var(--spacing-md);\n    background: var(--bg-color);\n    border-radius: var(--radius-lg);\n    margin-bottom: var(--spacing-md);\n    border: 2px solid var(--border-color);\n}\n\n.social-info {\n    display: flex;\n    align-items: center;\n    gap: var(--spacing-md);\n}\n\n.social-info svg {\n    flex-shrink: 0;\n}\n\n.social-info h3 {\n    font-size: 0.95rem;\n    font-weight: 600;\n    margin-bottom: 0.25rem;\n    color: var(--text-primary);\n}\n\n.social-info p {\n    font-size: 0.85rem;\n    color: var(--text-secondary);\n}\n\n/* Danger Zone */\n.danger-zone {\n    margin-top: var(--spacing-2xl);\n    padding: var(--spacing-lg);\n    background: rgba(239, 68, 68, 0.05);\n    border: 2px solid rgba(239, 68, 68, 0.2);\n    border-radius: var(--radius-lg);\n}\n\n.danger-zone h3 {\n    font-size: 1.1rem;\n    font-weight: 700;\n    margin-bottom: var(--spacing-md);\n    color: var(--error-color);\n}\n\n/* Responsive */\n@media (max-width: 1024px) {\n    .settings-grid {\n        grid-template-columns: 1fr;\n    }\n    \n    .settings-sidebar {\n        position: static;\n    }\n    \n    .settings-nav {\n        flex-direction: row;\n        overflow-x: auto;\n        padding-bottom: var(--spacing-xs);\n    }\n    \n    .settings-nav-item {\n        white-space: nowrap;\n    }\n}\n\n@media (max-width: 768px) {\n    .settings-content {\n        padding: var(--spacing-lg);\n    }\n    \n    .settings-section h2 {\n        font-size: 1.25rem;\n    }\n    \n    .theme-options {\n        grid-template-columns: 1fr;\n    }\n    \n    .setting-toggle {\n        flex-direction: column;\n        align-items: flex-start;\n        gap: var(--spacing-md);\n    }\n    \n    .social-account {\n        flex-direction: column;\n        align-items: flex-start;\n        gap: var(--spacing-md);\n    }\n    \n    .social-account .btn {\n        width: 100%;\n    }\n}\n</style>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;display=swap\" rel=\"stylesheet\"/>\n</head>\n<body>\n<!-- Header -->\n<header class=\"header\">\n<div class=\"container\">\n<div class=\"header-content\">\n<div class=\"logo\">\n<a href=\"index.html\"><h1>حاذق</h1></a>\n</div>\n<nav class=\"header-nav\">\n<ul class=\"nav-links\">\n<li><a data-ar=\"الرئيسية\" data-en=\"Home\" href=\"index.html\">الرئيسية</a></li>\n<li><a data-ar=\"المواهب\" data-en=\"Talents\" href=\"talents.html\">المواهب</a></li>\n<li><a data-ar=\"المتجر\" data-en=\"Store\" href=\"store.html\">المتجر</a></li>\n<li><a data-ar=\"الورش\" data-en=\"Workshops\" href=\"workshops.html\">الورش</a></li>\n<li><a data-ar=\"المجتمع\" data-en=\"Community\" href=\"community.html\">المجتمع</a></li>\n</ul>\n</nav>\n<div class=\"header-actions\">\n<button class=\"lang-toggle\" id=\"langToggle\">\n<svg fill=\"none\" height=\"18\" stroke=\"currentColor\" stroke-width=\"2\" viewbox=\"0 0 24 24\" width=\"18\">\n<circle cx=\"12\" cy=\"1
